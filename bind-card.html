<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<meta name="robots" content="noindex">
<title>開始免費試用 — 日本再留計劃 StayJP</title>
<style>
:root{--bg:#f7f2e8;--ink:#3c3227;--muted:#8a7d6d;--line:#e4dccd;--ac:#c8452f;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:24px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.terms{font-size:14px;color:var(--ink);margin:0;padding-left:20px}
.terms li{margin-bottom:9px}
.terms li:last-child{margin-bottom:0}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0}
#ECPayPayment{min-height:120px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:999px;background:var(--ac);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:18px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:10px;font-weight:500}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.msg.err{display:block;background:#fdecea;color:#9b2c1c}
.msg.info{display:block;background:#eef3ec;color:#4a6046}
.spin{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">開始 7 天免費試用</h1>
  <p class="lead" id="lead">綁定信用卡即可解鎖全部功能,試用期間不扣款。</p>

  <div class="card">
    <ul class="terms" id="terms"><li>載入中…</li></ul>
    <p class="hint">卡號由綠界科技(ECPay)的安全頁面直接處理,StayJP 不會看到、也不會保存你的卡號。</p>
  </div>

  <div class="card">
    <div id="ECPayPayment"></div>
    <div class="spin" id="spin">正在準備安全刷卡欄位…</div>
    <button class="btn" id="go" disabled>確認綁定並開始試用</button>
    <button class="btn sec" id="back">先不要,回上一頁</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
// 官網綁卡試用頁(站內付 2.0)。
// ⚠️ 載入順序 jQuery → node-forge → 綠界 SDK,缺一或調換 SDK 都不會動。
// ⚠️ SDK 一律從「正式」domain 載入,測試/正式靠 initialize('Stage'|'Prod') 切
//    (綠界官方綁卡範例明講 stage domain 的 SDK 是另一支檔案、行為可能異常)。
// ⚠️ #ECPayPayment 這個 id 不能改,SDK 寫死渲染在這裡;容器也不能是 display:none,
//    隱藏中的容器高度 0,SDK 會無聲略過不渲染。
const fbConfig = {
  apiKey: "AIzaSyDnmg2XOuvwgE8m8xCF5sS4o0nQYoUplPI",
  authDomain: "jpnote-1bdd6.firebaseapp.com",
  projectId: "jpnote-1bdd6",
  storageBucket: "jpnote-1bdd6.firebasestorage.app",
  messagingSenderId: "666368174384"
};
if (!firebase.apps.length) firebase.initializeApp(fbConfig);

const FN_BIND_START  = 'https://ecpgbindstart-lsd7okt5qa-de.a.run.app';
const FN_BIND_CREATE = 'https://ecpgbindcreate-lsd7okt5qa-de.a.run.app';

const $ = (id) => document.getElementById(id);
const plan = (new URLSearchParams(location.search).get('plan') || 'monthly');
let tradeNo = '', sdkReady = false;

function say(text, kind) { const m = $('msg'); m.className = 'msg ' + (kind || 'err'); m.textContent = text; }

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('載入失敗:' + src));
    document.head.appendChild(s);
  });
}

function renderTerms(d) {
  const cycle = (plan.indexOf('yearly') === 0) ? '每年' : '每月';
  const li = [];
  if (d.trial_days > 0) {
    li.push(`前 <b>${d.trial_days} 天完全免費</b>,期間可隨時取消,不會扣任何費用。`);
    li.push(`試用結束當天(第 ${d.trial_days + 1} 天)自動扣 <b>NT$${d.charge_twd}</b>,之後 ${cycle}自動續扣同額。`);
  } else {
    $('ttl').textContent = '綁定信用卡';
    $('lead').textContent = '這個帳號已經用過免費試用,綁卡後即開始計費。';
    li.push(`這個帳號先前已使用過免費試用,綁卡後<b>立即</b>開始計費 <b>NT$${d.charge_twd}</b>,之後 ${cycle}自動續扣。`);
  }
  li.push(`綁卡當下會有一筆 <b>NT$${d.verify_amount}</b> 的卡片驗證授權,我們會立刻放棄請款,這筆錢不會真的入帳(部分銀行會在帳單上短暫顯示後自動消失)。`);
  li.push('隨時可在「帳戶」頁一鍵取消自動續訂,已付期間權益保留到期末。');
  $('terms').innerHTML = li.map((t) => '<li>' + t + '</li>').join('');
}

async function main() {
  const user = await new Promise((r) => firebase.auth().onAuthStateChanged(r));
  if (!user) { location.replace('/account.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
  const idToken = await user.getIdToken();

  let d;
  try {
    const res = await fetch(FN_BIND_START, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + idToken },
      body: JSON.stringify({ plan }),
    });
    d = await res.json();
    if (!res.ok || !d.ok) {
      $('spin').style.display = 'none';
      say(d.error === 'already_premium' ? '你已經是付費會員了,不需要再綁卡。' : ('無法開始綁卡:' + (d.reason || d.error || '未知錯誤')));
      return;
    }
  } catch (e) {
    $('spin').style.display = 'none'; say('網路不穩,請重新整理再試一次。'); return;
  }

  tradeNo = d.tradeNo;
  renderTerms(d);

  try {
    await loadScript('https://code.jquery.com/jquery-3.7.1.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/node-forge@0.7.0/dist/forge.min.js');
    await loadScript(d.sdk);
  } catch (e) { $('spin').style.display = 'none'; say('刷卡元件載入失敗,請關掉廣告阻擋或換個網路再試。'); return; }

  // 雙層 rAF:確保容器已經 repaint 有實際高度,SDK 才會渲染(高度 0 會被無聲略過)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ECPay.initialize(d.env, 1, function (errMsg) {
      if (errMsg != null) { $('spin').style.display = 'none'; say('刷卡元件初始化失敗:' + errMsg); return; }
      ECPay.addBindingCard(d.token, 'zh-TW', function (err2) {
        $('spin').style.display = 'none';
        if (err2 != null) { say('刷卡欄位載入失敗:' + err2); return; }
        sdkReady = true; $('go').disabled = false;
      });
    });
  }));
}

$('back').addEventListener('click', () => history.length > 1 ? history.back() : location.assign('/pricing.html'));

$('go').addEventListener('click', async () => {
  if (!sdkReady) return;
  $('go').disabled = true; $('go').textContent = '處理中…'; say('正在驗證卡片,請不要關掉頁面。', 'info');
  // errMsg 必須用 != null 判斷:SDK 有時會回空字串(falsy)但 bindCardPayToken 無效
  ECPay.getBindCardPayToken(async function (info, errMsg) {
    if (errMsg != null || !info || !info.BindCardPayToken) {
      $('go').disabled = false; $('go').textContent = '確認綁定並開始試用';
      say(errMsg ? ('卡片資料有誤:' + errMsg) : '請確認卡號、有效期與安全碼都填好了。');
      return;
    }
    try {
      const idToken = await firebase.auth().currentUser.getIdToken();
      const res = await fetch(FN_BIND_CREATE, {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + idToken },
        body: JSON.stringify({ bindCardPayToken: info.BindCardPayToken, tradeNo }),
      });
      const j = await res.json();
      if (!res.ok || !j.ok) {
        $('go').disabled = false; $('go').textContent = '確認綁定並開始試用';
        say('綁卡失敗:' + (j.reason || j.error || '未知錯誤') + '(沒有扣款)');
        return;
      }
      // 2025/8 起信用卡幾乎一定要 3D 驗證 → 導去銀行驗證頁,驗完綠界會把人送回我們的 OrderResultURL。
      if (j.threeDUrl) { location.assign(j.threeDUrl); return; }
      location.assign('/account.html?bind=ok');
    } catch (e) {
      $('go').disabled = false; $('go').textContent = '確認綁定並開始試用';
      say('網路不穩,請再試一次(沒有扣款)。');
    }
  });
});

main();
</script>
</body>
</html>
