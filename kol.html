<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>推薦成效 — 日本再留計劃</title>
<style>
  :root { --bg:#FAF9F6;--bg2:#FFFFFF;--tx:#2C2C2C;--tx2:#7A7A7A;--tx3:#ACACAC;--ac:#D4654A;--bd:#E8E5E0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1C1C1E;--bg2:#2C2C2E;--tx:#E5E5E5;--tx2:#8E8E93;--tx3:#636366;--ac:#E8734A;--bd:#3A3A3C; } }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  body{background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;max-width:420px;width:100%;padding:28px 24px;box-shadow:0 20px 50px -20px rgba(0,0,0,.25)}
  .brand{font-size:13px;color:var(--ac);font-weight:700;letter-spacing:.5px;margin-bottom:4px}
  h1{font-size:20px;margin-bottom:2px}
  .kol{font-size:14px;color:var(--tx2);margin-bottom:20px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--tx2);margin-top:3px}
  .paid .v{color:#16A34A}
  .trial .v{color:#D946EF}
  .note{font-size:12px;color:var(--tx3);line-height:1.7}
  .err{color:#EF4444;font-size:14px;text-align:center;padding:20px 0}
  .loading{color:var(--tx2);text-align:center;padding:30px 0}
  .range-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
  .range-title{font-size:14px;font-weight:700;margin-bottom:10px}
  .range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .range-row input[type=date]{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font-size:14px}
  .range-row span{color:var(--tx2)}
  .range-row button{background:var(--ac);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .range-row button:disabled{opacity:.5;cursor:not-allowed}
  .range-result{margin-top:12px;font-size:14px;color:var(--tx2);line-height:1.8;min-height:20px}
  .range-result b{color:var(--tx);font-size:17px}
  .range-result .money{color:#16A34A}
  .dlist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .drow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;background:var(--bg2);border-radius:8px}
  .drow .dp{font-weight:700;color:var(--tx)}
  .drow .ds{color:var(--tx3);font-size:11px;background:var(--bg3);padding:1px 7px;border-radius:20px}
  .drow .dm{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .drow .dm.money{color:#16A34A}
  .drow .dx{font-size:11px;color:var(--tx2)}
  .drow .dd{color:var(--tx3);font-size:11px;min-width:34px;text-align:right}
  .drow.voided{opacity:.55}
  .drow.voided .dm{color:var(--tx3);text-decoration:line-through}
  .drow.voided .dx{color:#EF4444}
</style>
</head>
<body>
<div class="card">
  <div class="brand">StayJP · 推薦成效</div>
  <h1 id="title">載入中…</h1>
  <div class="kol" id="kol"></div>
  <div id="body"><div class="loading">查詢中…</div></div>
</div>
<script>
  const FN = 'https://asia-east1-jpnote-1bdd6.cloudfunctions.net/kolStats';
  const q = new URLSearchParams(location.search);
  const code = (q.get('code') || '').toUpperCase();
  const t = q.get('t') || '';
  const title = document.getElementById('title');
  const kolEl = document.getElementById('kol');
  const body = document.getElementById('body');
  if (!code || !t) {
    title.textContent = '連結不完整';
    body.innerHTML = '<div class="err">這個查詢連結缺少參數,請使用主辦方提供的完整連結。</div>';
  } else {
    fetch(FN + '?code=' + encodeURIComponent(code) + '&t=' + encodeURIComponent(t))
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok || !d.ok) {
          title.textContent = '查詢失敗';
          body.innerHTML = '<div class="err">連結無效或已停用,請向主辦方確認。</div>';
          return;
        }
        title.textContent = '推薦碼 ' + d.code;
        kolEl.textContent = d.kol ? (d.kol + ' 的成效') : '';
        const pad = n => (n < 10 ? '0' : '') + n;
        const iso = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
        const now = new Date();
        const first = new Date(now.getFullYear(), now.getMonth(), 1);
        body.innerHTML =
          '<div class="stats">' +
            '<div class="stat"><div class="v">' + d.total + '</div><div class="l">帶來人數</div></div>' +
            '<div class="stat paid"><div class="v">' + d.paid + '</div><div class="l">已付費</div></div>' +
            '<div class="stat trial"><div class="v">' + d.trialing + '</div><div class="l">試用中</div></div>' +
          '</div>' +
          '<div class="note">「帶來人數」= 透過你的推薦碼註冊的人;「已付費」= 其中目前付費訂閱中(結算依據);「試用中」= 免費試用尚未轉付費。數字即時更新。</div>' +
          '<div class="range-box">' +
            '<div class="range-title">📅 期間查詢</div>' +
            '<div class="range-row"><input type="date" id="rFrom" value="' + iso(first) + '"><span>~</span><input type="date" id="rTo" value="' + iso(now) + '"><button id="rBtn">查詢</button></div>' +
            '<div id="rResult" class="range-result">選好日期,查這段期間的<b style="font-size:14px">成交筆數</b>與<b style="font-size:14px">分潤金額</b>。</div>' +
          '</div>';
        document.getElementById('rBtn').onclick = queryRange;
      })
      .catch(() => {
        title.textContent = '連線失敗';
        body.innerHTML = '<div class="err">網路連線失敗,請稍後重新整理。</div>';
      });
  }

  function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function queryRange() {
    const btn = document.getElementById('rBtn');
    const res = document.getElementById('rResult');
    const from = document.getElementById('rFrom').value;
    const to = document.getElementById('rTo').value;
    if (!from || !to) { res.innerHTML = '<span style="color:#EF4444">請選擇起訖日期。</span>'; return; }
    if (from > to) { res.innerHTML = '<span style="color:#EF4444">起始日不能晚於結束日。</span>'; return; }
    btn.disabled = true; res.textContent = '查詢中…';
    fetch(FN + '?code=' + encodeURIComponent(code) + '&t=' + encodeURIComponent(t) + '&from=' + from + '&to=' + to)
      .then(r => r.json())
      .then(d => {
        btn.disabled = false;
        const rg = d && d.range;
        if (!rg) { res.innerHTML = '<span style="color:#EF4444">查詢失敗,請稍後再試。</span>'; return; }
        var PLAN={lifetime:'買斷',yearly_early_bird:'早鳥年費',yearly:'年費',monthly:'月費',adjustment:'額外項目'};
        var SRC={web:'網頁·綠界',paypal:'網頁·PayPal',app:'App內購'};
        var list=(rg.rows||[]).map(function(r){
          var when=new Date(r.at); var ds=(when.getMonth()+1)+'/'+when.getDate();
          var planTxt = r.plan==='adjustment' ? ('額外:'+(r.note||'調整')) : (PLAN[r.plan]||r.plan||'—');
          var srcTxt = SRC[r.source]||r.source;
          var money = 'NT$'+(r.amount||0).toLocaleString();
          if(r.voided) return '<div class="drow voided"><span class="dp">'+esc(planTxt)+'</span><span class="ds">'+esc(srcTxt)+'</span><span class="dm">'+money+'</span><span class="dx">✗ 已退費</span><span class="dd">'+ds+'</span></div>';
          var stTxt = r.state==='paid'?'已付款':(r.state==='locked'?'可領':'鎖定中');
          return '<div class="drow"><span class="dp">'+esc(planTxt)+'</span><span class="ds">'+esc(srcTxt)+'</span><span class="dm money">'+money+'</span><span class="dx">'+stTxt+'</span><span class="dd">'+ds+'</span></div>';
        }).join('');
        res.innerHTML = rg.from + ' ~ ' + rg.to + '<br>成交 <b>' + rg.conversions + '</b> 筆 · 分潤 <b class="money">NT$' + (rg.commission_twd || 0).toLocaleString() + '</b>' +
          (list ? '<div class="dlist">'+list+'</div>' : '') +
          '<br><span style="font-size:12px;color:var(--tx3)">(退費會標「已退費」不計入;金額為預估分潤,實際以結算為準。App 內購與網頁分成比例不同)</span>';
      })
      .catch(() => { btn.disabled = false; res.innerHTML = '<span style="color:#EF4444">連線失敗,請稍後再試。</span>'; });
  }
</script>
<script src="i18n.js"></script>
<script src="ui-map.js"></script>
<script src="translate-layer.js"></script>
</body>
</html>
