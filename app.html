/* 英文模式:隱藏單字元中文分類圖示徽章(助/型/形/在/他…),分類名已英文 */
html[lang="en"] .ci2 { display: none; }

/* == 文字大小(data-fs:標準/大/特大)== 放大「學習內容」文字,頂欄/導覽/按鈕不動 → 不跑版。
   單字卡是變動高度虛擬列表,字級變大會自動重量測(remeasure),不會重疊。
   涵蓋:單字卡全部 + 文法卡(標題/句型/說明/例句/備註)+ 易混淆例句。 */
/* ---- 大 (~+15%) ---- */
html[data-fs="large"] .vw{font-size:23px}
html[data-fs="large"] .vr,html[data-fs="large"] .vi .vex .exz{font-size:13.5px}
html[data-fs="large"] .vm,html[data-fs="large"] .vi .vex .exj{font-size:16px}
html[data-fs="large"] .gc .gt{font-size:18px}
html[data-fs="large"] .gc .pt,html[data-fs="large"] .gc .ep{font-size:16px}
html[data-fs="large"] .gc .ex .j,html[data-fs="large"] .cf-eg .ex .j{font-size:16px}
html[data-fs="large"] .gc .ex .z,html[data-fs="large"] .gc .nt{font-size:16px}
/* ---- 特大 (~+30%) ---- */
html[data-fs="xlarge"] .vw{font-size:26px}
html[data-fs="xlarge"] .vr,html[data-fs="xlarge"] .vi .vex .exz{font-size:16px}
html[data-fs="xlarge"] .vm,html[data-fs="xlarge"] .vi .vex .exj{font-size:18px}
html[data-fs="xlarge"] .gc .gt{font-size:21px}
html[data-fs="xlarge"] .gc .pt,html[data-fs="xlarge"] .gc .ep{font-size:18px}
html[data-fs="xlarge"] .gc .ex .j,html[data-fs="xlarge"] .cf-eg .ex .j{font-size:18px}
html[data-fs="xlarge"] .gc .ex .z,html[data-fs="xlarge"] .gc .nt{font-size:17px}
/* ---- 測驗/模考/讀解/聽力等彈窗:整塊等比放大(zoom 涵蓋所有文字,連 inline 詳解卡也吃得到)。
   zoom 會連框一起放大 → 同步用 calc 縮小框寬高,讓框維持原尺寸、只有內容變大,不溢出螢幕。 ---- */
html[data-fs="large"] .quiz-box{zoom:1.15}
html[data-fs="xlarge"] .quiz-box{zoom:1.28}

/* ── 字級 +1px 後的窄螢幕收斂(2026-08) ─────────────────────────────
   放大字級後兩處變擠:
   1) .hd-bar 是 9 個 flex 項目(文法/單字 + 分隔 + N5~N1 + 分隔 + ★),
      #tabsBar 用 display:contents 所以等級鈕也是直接項目。
      360px 下內容 409 > 框 360,最右邊的 ★ 被推出可視範圍。
      → 縮 padding / gap / 藥丸左右內距,讓整條在常見手機寬度內塞得下。
   2) 彈窗被 .onb-mask 的 padding:20px 夾成 320px,字放大後更擠。
      → 窄螢幕把外距縮小、卡片內距收斂,實際內容區變寬。
   只在窄螢幕生效,平板/桌機維持原設計。 */
@media (max-width: 430px) {
  .hd-bar { padding: 4px 8px; gap: 4px; }
  .hd-bar .mode-pill,
  .hd-bar .tab-pill,
  .hd-bar .fav-pill { padding-left: 8px; padding-right: 8px; }
  .onb-mask { padding: 12px; }
  .onb-card { padding: 20px 14px; }
}
/* .hd-top(標題列)在 ≤355px 會把最右邊的「登入」推出畫面:
   內含 11 個項目(選單/標題/模式/進度/語言/字級A/主題/說明/連續/登入),
   標題已被壓到 93px,其餘多為固定寬度按鈕。
   → 窄螢幕收斂左右內距與間距,並讓標題可進一步縮短(過長時以 … 截斷),
     確保最右邊的登入鈕一定在畫面內。 */
@media (max-width: 380px) {
  .hd-top { padding: 0 8px; gap: 4px; }
  .hd-top > h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hd-top .theme-btn { padding-left: 4px; padding-right: 4px; }
  .hd-top .streak-btn { padding-left: 6px; padding-right: 6px; }
}
@media (max-width: 320px) {
  .hd-top { padding: 0 6px; gap: 3px; }
  .hd-top .theme-btn { padding-left: 3px; padding-right: 3px; }
}

/* 極窄機(≤340px,如舊款小螢幕 Android)再收一段,讓 ★ 也進得來 */

}

let db = null, auth = null, currentUser = null, _authResolved = false;
if (fbConfig) {
  firebase.initializeApp(fbConfig);
  // Safari ITP 會擋 Firestore 預設的 fetch streams + WebChannel,改長輪詢 + 禁 fetch streams
  // 必須在 firebase.firestore() 第一次取用之前設,否則無效
  try { firebase.firestore().settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false }); } catch (e) {}
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(u => { currentUser = u; _authResolved = true; _writeAuthCache(u); if (u) storeRefCode(); try { localStorage.setItem('stayjp_logged_in', u ? '1' : '0'); } catch (e) {} updateAuthUI(); loadFavorites(); loadCloudData(); if (typeof Streak !== 'undefined') { Streak.syncDown(); Streak.render(); } });
  // 推薦碼歸因:登入後首次把 localStorage 的 ?ref= 碼寫進 users/{uid}.ref_code(已有就不覆蓋 → 首次點擊歸因)
  function storeRefCode() {
    try {
      var ref = localStorage.getItem('stayjp_ref');
      if (!ref || !currentUser || !db) return;
      var docRef = db.collection('users').doc(currentUser.uid);
      docRef.get().then(function (d) {
        if (d.exists && d.data() && d.data().ref_code) return;   // 首次歸因,不覆蓋既有
        docRef.set({ ref_code: ref, ref_at: Date.now() }, { merge: true });
      }).catch(function () {});
    } catch (e) {}
  }
  // 換頁(整頁重載)還原前先用 localStorage 快取樂觀渲染成已登入(見 _authUser);這裡只需在
  // 還原完先畫一次(讀快取),onAuthStateChanged 回來會再對帳覆寫。
  updateAuthUI();
  // 保險:萬一 auth 卡住沒回呼,4 秒後標記已解析「並重繪」→ 退回可用的「登入」鈕,絕不卡在佔位/快取
  setTimeout(function () { if (!_authResolved) { _authResolved = true; updateAuthUI(); } }, 4000);
  // 累計學員計數的 +1 移除：每位訪客寫 1 次 → Firestore Spark 方案 20K 寫/日上限會吃光配額

}

// ========== AUTH ==========
// Google OAuth 在 WebView/內嵌瀏覽器會回 disallowed_useragent，是 Google 端封鎖無法繞過
function isInAppBrowser() {
  const ua = navigator.userAgent || '';
  // Line / FB / IG / Threads(Barcelona) / WeChat / Twitter(X) / TikTok / KakaoTalk / Naver
  return /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Twitter|TikTok|KAKAOTALK|NAVER|Barcelona|BytedanceWebview/i.test(ua);
}
function detectPlatform() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'desktop';
}
function showInAppHelp() {
  const old = document.getElementById('inAppBanner'); if (old) old.remove();
  const url = location.href;
  const platform = detectPlatform();
  const ua = navigator.userAgent || '';
  const isLine = /Line\//i.test(ua);
  const isThreads = /Barcelona/i.test(ua);
  const isIG = /Instagram/i.test(ua);
  const isFB = /FBAN|FBAV|FB_IAB/i.test(ua);

  let stepGuide = '';
  if (isLine) {
    stepGuide = platform === 'ios'
      ? '1. 點右下角的 <strong>「⋯」</strong>圖示\n2. 選 <strong>「在預設瀏覽器中開啟」</strong>'
      : '1. 點右上角的 <strong>「⋮」</strong>圖示\n2. 選 <strong>「在其他瀏覽器中開啟」</strong>';
  } else if (isThreads || isIG) {
    stepGuide = platform === 'ios'
      ? '1. 點右上角的 <strong>「⋯」</strong>\n2. 選 <strong>「在外部瀏覽器中開啟」</strong>'
      : '1. 點右上角的 <strong>「⋮」</strong>\n2. 選 <strong>「在 Chrome 中開啟」</strong>';
  } else if (isFB) {
    stepGuide = platform === 'ios'
      ? '1. 點右下角的 <strong>「⋯」</strong>\n2. 選 <strong>「在 Safari 中開啟」</strong>'
      : '1. 點右上角的 <strong>「⋮」</strong>\n2. 選 <strong>「在外部瀏覽器中開啟」</strong>';
  } else {
    stepGuide = '請點 App 內瀏覽器右上角或右下角的選單按鈕，選擇「在外部瀏覽器中開啟」';
  }

  const androidIntent = platform === 'android'
    ? `<a class="cc-btn primary" href="intent://${location.host}${location.pathname}${location.search}${location.hash}#Intent;scheme=https;package=com.android.chrome;end" style="text-decoration:none;display:flex;align-items:center;justify-content:center">用 Chrome 開啟</a>`
    : '';

  const mask = document.createElement('div');
  mask.className = 'cc-mask';
  mask.innerHTML = `<div class="cc-box" role="dialog" aria-modal="true" style="width:min(380px,calc(100vw - 32px))">
    <div class="cc-title">登入請用外部瀏覽器開啟 </div>
    <div class="cc-msg">免費內容在這裡就能直接用!只有「登入（存進度、3 天試用、訂閱）」因為 Google 限制,需要用 Safari / Chrome 開啟。三秒切過去:</div>
    <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.9;color:var(--tx)">
      <div style="font-weight:700;margin-bottom:6px;color:var(--ac2)"><i data-ic=phone></i> 開啟方式</div>
      <div style="white-space:pre-line">${stepGuide}</div>
    </div>
    <div style="font-size:12px;color:var(--tx2);margin-bottom:10px">或直接複製網址，貼到 Safari / Chrome 開啟：</div>
    <div style="background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--tx2);word-break:break-all;margin-bottom:12px;font-family:monospace">${url}</div>
    <div class="cc-btns" style="flex-direction:column;gap:8px">
      <button class="cc-btn primary" data-act="copy"><i data-ic=clipboard></i> 複製網址</button>
      ${androidIntent}
      <button class="cc-btn" data-act="cancel">關閉</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add('on'));
  const close = () => { mask.classList.remove('on'); setTimeout(()=>mask.remove(), 200); };
  mask.addEventListener('click', async e => {
    if (e.target === mask || e.target.dataset.act === 'cancel') close();
    else if (e.target.dataset.act === 'copy') {
      let ok = false;
      try { await navigator.clipboard.writeText(url); ok = true; } catch(err) {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch(_) {}
        ta.remove();

}

let _signingIn = false;
function handleAuth() {
  // 原生 App(WebView)內:登入一律發 OPEN_LOGIN 開原生選單(Apple/Google)。
  // ⚠️ 必須擺在 _authResolved guard「之前」—— App 的 WebView 裡 Firebase 登入狀態常沒及時還原,
  //    _authResolved=false 會把這段擋掉 → 登入鈕點了完全沒反應(訂閱無此 guard 所以正常)。
  if (window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp) {
    if (_authUser()) {
      // 已登入(含樂觀快取)→ 這次點擊是「登出」:網頁登出 + 通知原生也登出(原生 Firebase + RevenueCat),否則狀態卡住要重開 app
      try { auth.signOut(); } catch (e) {}
      currentUser = null; _writeAuthCache(null); updateAuthUI();
      try { if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'NATIVE_LOGOUT' })); } catch (e) {}
      return;
    }
    try { if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'OPEN_LOGIN' })); } catch (e) {}
    return;
  }
  // 以下為一般網頁路徑:登入狀態還沒還原完 → 忽略點擊,避免誤判未登入而重複登入
  if (!_authResolved) return;
  if (currentUser) { auth.signOut(); currentUser = null; _writeAuthCache(null); updateAuthUI(); return; }
  if (isInAppBrowser()) { showInAppHelp(); return; }
  // web 未登入 → 開 Google/Apple 選單(iOS 用 Apple 付費者要用 Apple 登入才對得到同一 uid)
  toggleLoginMenu();
}
function toggleLoginMenu(e) {
  e?.stopPropagation();
  document.getElementById('loginMenu')?.classList.toggle('show');
}
// 實際登入:google | apple。Apple 付費者(iOS)必須用 Apple 登入才對得到同一 Firebase uid → 網頁才看得到訂閱。
function loginWith(provider) {
  document.getElementById('loginMenu')?.classList.remove('show');
  if (_signingIn) return;   // 防連點:前一個登入彈窗還沒結束就別再開(auth/cancelled-popup-request)
  _signingIn = true;
  let p;
  if (provider === 'apple') {
    p = new firebase.auth.OAuthProvider('apple.com');
    p.addScope('email'); p.addScope('name');
  } else {
    p = new firebase.auth.GoogleAuthProvider();
  }
  auth.signInWithPopup(p)
    .catch(e => {
      const code = e && e.code;
      // 連點被取消 / 用戶自己關彈窗 = 良性,不彈
      if (code === 'auth/cancelled-popup-request' || code === 'auth/popup-closed-by-user') return;
      // 網路不穩 → 友善提示,不丟英文
      if (code === 'auth/network-request-failed') { AppUI.alert('網路不穩,登入連線失敗,請稍後再試一次。'); return; }
      // Apple 尚未在 Firebase 開通 → 友善提示,別丟英文
      if (code === 'auth/operation-not-allowed') { AppUI.alert('此登入方式暫時無法使用,請改用另一種方式登入。'); return; }
      AppUI.alert('登入失敗: ' + (e && e.message || e));

// ========== CLOUD SYNC: Quiz History & SRS ==========
function loadCloudData() {
  if (!currentUser || !db) return;
  // 雙讀:進度大 key 優先讀 user_progress/{uid}(壓縮),缺則退回 users/{uid} 舊欄位。
  // 未遷移用戶無 user_progress doc → 全走 legacy,行為零改變。
  Promise.all([
    db.collection('users').doc(currentUser.uid).get(),
    db.collection('user_progress').doc(currentUser.uid).get().catch(() => null),
  ]).then(async ([doc, pdoc]) => {
    if (!doc.exists && !(pdoc && pdoc.exists)) return;
    const d = doc.exists ? doc.data() : {};
    if (pdoc && pdoc.exists && window.ProgressCodec) {
      const pd = pdoc.data() || {};
      for (const k of ProgressCodec.PROGRESS_BIG_KEYS) {
        const v = pd[k];
        if (v == null) continue;
        try { d[k] = await ProgressCodec.gunzipJSON(v.toUint8Array ? v.toUint8Array() : v); }
        catch (e) { /* 壞資料 → 保留 legacy d[k] */ }
      }
    }
    // Merge quiz history
    if (d.quiz_history) {
      const local = JSON.parse(localStorage.getItem('quiz_history') || '[]');
      const merged = mergeHistory(local, d.quiz_history || []);
      localStorage.setItem('quiz_history', JSON.stringify(merged));
    }
    // Merge SRS data
    if (d.srs_data) {
      const local = JSON.parse(localStorage.getItem('srs_data') || '{}');
      const merged = mergeSRS(local, d.srs_data || {});
      localStorage.setItem('srs_data', JSON.stringify(merged));
    }
    // Merge all other synced data (study_log, word_notebook, grammar_srs, daily_progress, mock_exam_history)
    SYNC_KEYS.forEach(k => {
      if (d[k] == null || d[k] === '') return;
      if (SCALAR_SYNC_KEYS.has(k)) {   // 純字串(程度/目標/考試日):直接還原,不進 JSON 合併(否則 JSON.parse 炸掉整段還原)
        if (typeof d[k] === 'string') localStorage.setItem(k, d[k]);
        return;
      }
      const local = JSON.parse(localStorage.getItem(k) || (Array.isArray(d[k]) ? '[]' : '{}'));
      if (Array.isArray(d[k])) {
        let merged;
        if (k === 'word_notebook') {
          // 語意去重：同 (w, lv) 只保留一份（取較早的 added）
          const byKey = new Map();
          [...local, ...d[k]].forEach(x => {
            if (!x || !x.w) return;
            const key = x.w + '\u0000' + (x.lv || '');
            const prev = byKey.get(key);
            if (!prev || (x.added && prev.added && x.added < prev.added)) byKey.set(key, x);
          });
          merged = [...byKey.values()];
        } else if (k === 'wrong_questions') {
          // 語意去重：同 (mode, id) 只保留一份（取較新的 ts）
          const byKey = new Map();
          [...local, ...d[k]].forEach(x => {
            if (!x || !x.mode || !x.id) return;
            const key = x.mode + '␀' + x.id;
            const prev = byKey.get(key);
            if (!prev || ((x.ts||0) > (prev.ts||0))) byKey.set(key, x);
          });
          merged = [...byKey.values()];
        } else {
          // 其他 array：JSON 字串去重
          const seen = new Set();
          merged = [...local, ...d[k]].filter(x => { const s = JSON.stringify(x); if (seen.has(s)) return false; seen.add(s); return true; });
        }
        localStorage.setItem(k, JSON.stringify(merged));
      } else {
        const merged = { ...d[k] };
        if (k === 'study_log') {
          // 學習日曆:按「日期聯集、同日各項取最大」合併——原本同日雲端整筆蓋本機,
          // 而上傳又是整包覆蓋,兩台裝置輪流用會互吃日期 → 連勝天數兩邊不一致(用戶回報)。
          let changed = false;
          Object.entries(local).forEach(([date, val]) => {
            const c = merged[date];
            if (!c) { merged[date] = val; changed = true; }
            else {
              const mx = {
                vocab: Math.max(c.vocab || 0, (val && val.vocab) || 0),
                grammar: Math.max(c.grammar || 0, (val && val.grammar) || 0),
                quiz: Math.max(c.quiz || 0, (val && val.quiz) || 0),
                minutes: Math.max(c.minutes || 0, (val && val.minutes) || 0),
              };
              if (JSON.stringify(mx) !== JSON.stringify(c)) changed = true;
              merged[date] = mx;
            }
          });
          localStorage.setItem(k, JSON.stringify(merged));
          // 本機有雲端沒有的資料 → 回寫,讓另一台下次載入就拿到聯集(雙向收斂)
          if (changed) setTimeout(() => { try { saveAllCloud(); } catch (e) {} }, 1200);
        } else {
          // Object: cloud values win if newer, local wins otherwise
          Object.entries(local).forEach(([key, val]) => {
            if (!merged[key]) merged[key] = val;
            else if (val && typeof val === 'object' && val.lastReview && (!merged[key].lastReview || val.lastReview > merged[key].lastReview)) merged[key] = val;
          });
          localStorage.setItem(k, JSON.stringify(merged));
        }
      }
    });
    // Backfill study_log from quiz_history for dates missing from calendar
    const qh = JSON.parse(localStorage.getItem('quiz_history') || '[]');
    if (qh.length) {
      const sl = JSON.parse(localStorage.getItem('study_log') || '{}');
      let patched = false;
      const dayCounts = {};
      qh.forEach(q => {
        if (!q.date) return;
        const day = q.date.split('T')[0];
        dayCounts[day] = (dayCounts[day] || 0) + 1;
      });
      Object.entries(dayCounts).forEach(([day, cnt]) => {
        if (!sl[day]) {
          sl[day] = { vocab: 0, grammar: 0, quiz: cnt };
          patched = true;
        }
      });
      if (patched) {
        localStorage.setItem('study_log', JSON.stringify(sl));
      }
    }
    // 合併後一律把 union 推回雲端:讓「登出時學的 / 只存在本機的學習日」也同步上去,
    // 其他裝置下次登入就拿得到 → 修「火焰跨裝置連續、但月曆塗滿散落各機」(只有 backfill 時才推會漏掉)。
    if (typeof saveAllCloud === 'function') saveAllCloud();
    if (typeof SRS !== 'undefined') SRS.updateReviewCount();
    // 回訪用戶在這台第一次登入、雲端資料剛載入 → 標記引導完成並關掉(避免對老用戶閃出新手引導)
    if (typeof _onbHasData === 'function' && _onbHasData()) {
      localStorage.setItem('onboarding_done_v1', '1');
      if (typeof _onbRemove === 'function') _onbRemove();
    }
    doRender();
  }).catch(() => {});
}
function mergeHistory(local, cloud) {
  const all = [...local, ...cloud];
  const seen = new Set();
  return all.filter(h => { const k = h.date + h.level + h.score; if (seen.has(k)) return false; seen.add(k); return true; }).slice(-200);
}
function mergeSRS(local, cloud) {
  const merged = { ...cloud };
  Object.entries(local).forEach(([k, v]) => {
    if (!merged[k] || (v.lastReview && (!merged[k].lastReview || v.lastReview > merged[k].lastReview))) {
      merged[k] = v;
    }
  });
  return merged;
}
// 雙寫的新路:進度大 key 各自壓縮寫 user_progress/{uid}(舊路仍照寫 users/{uid} → 回滾無損、未遷移用戶照讀舊欄位)。

// ── Sync ALL data ──
const SYNC_KEYS = ['study_log','word_notebook','grammar_srs','daily_progress','mock_exam_history','exam_date','base_level','goal_level','reading_done','reading_scores','listening_scores','listening_done','shadow_favs','wrong_questions'];
const SCALAR_SYNC_KEYS = new Set(['exam_date','base_level','goal_level']);   // 純字串值:不可 JSON.parse/stringify(JSON.parse('n3')會炸→之前這三個永遠沒同步到雲端,用戶回報「程度填過卻不記得」)
function saveAllCloud() {
  if (!currentUser || !db) return;
  const payload = {};
  SYNC_KEYS.forEach(k => {
    try {
      const v = localStorage.getItem(k); if (v == null || v === '') return;
      payload[k] = SCALAR_SYNC_KEYS.has(k) ? v : JSON.parse(v);   // 純字串直接存,別 JSON.parse
    } catch(e) {}
  });
  if (Object.keys(payload).length) db.collection('users').doc(currentUser.uid).set(payload, { merge: true });
  // 大 key 另壓縮雙寫 user_progress(小純量 exam_date/base_level/goal_level/daily_progress 續留 users)
  if (window.ProgressCodec) {
    const big = {};
    ProgressCodec.PROGRESS_BIG_KEYS.forEach(k => { if (payload[k] != null) big[k] = payload[k]; });
    saveProgressKeys(big);
  }
}

          const repeatMs = Math.max(1200, item.j.length * 200 / speed);
          pendingTimer = setTimeout(() => { pendingTimer = null; stage = 2; step(); }, repeatMs);
        } else {
          // 跟讀停頓關閉：一次播完直接下一句
          stage = 4; step();
        }
      });
    } else if (stage === 2) {
      setStatus('<i data-ic=volume></i> 再播一次');
      playOnce(item.j, () => {
        if (paused) return;
        if (repeatWindow) {
          stage = 3;
          setStatus('<i data-ic=mic></i> 再跟著念一次…');
          const repeatMs = Math.max(1200, item.j.length * 200 / speed);
          pendingTimer = setTimeout(() => { pendingTimer = null; stage = 4; step(); }, repeatMs);
        } else {
          stage = 4; step();
        }
      });
    } else if (stage === 4) {
      // 句末短間隔後切下句
      pendingTimer = setTimeout(() => { pendingTimer = null; idx++; stage = 0; if (idx < queue.length) step(); else exit(true); }, 400);
    }
  }

  function start(items) {
    if (!items || !items.length) { AppUI.alert('沒有內容可跟讀'); return; }
    queue = items;
    idx = 0; stage = 0; paused = false;
    open();
    track('shadow_start', { count: items.length, mode: currentMode, level: currentLevel });
    // iOS Safari unlock：在 user-gesture context 下先播靜音 buffer 讓 _sharedAudio 取得
    // 自動播放許可。否則之後 setTimeout 觸發的 play() 會被 iOS autoplay policy 擋掉
    // （第二句後沒聲音的根因）
    if (!_sharedAudio) _sharedAudio = new Audio();
    _sharedAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAESsAAABAAgAZGF0YQAAAAA=';
    _sharedAudio.play().catch(() => {});
    step();
  }

  function next() { clearTimer(); idx = Math.min(idx + 1, queue.length - 1); stage = 0; step(); }
  function prev() { clearTimer(); idx = Math.max(idx - 1, 0); stage = 0; step(); }
  function replay() { clearTimer(); stage = 0; step(); }
  function togglePause() {
    paused = !paused;
    if (paused) { clearTimer(); setStatus('<i data-ic=pause></i> 暫停'); return; }
    // 恢復播放：一律從當前句子的播放階段（stage 0）重來，避免卡在跟讀停頓 / 間隔等中間狀態
    stage = 0;
    step();
  }
  function exit(reachedEnd) {
    clearTimer();
    stopRec();                       // 離開時停止錄音、釋放麥克風
    if (recStream) { try { recStream.getTracks().forEach(t => t.stop()); } catch (e) {} recStream = null; }
    if (recAudio) { try { recAudio.pause(); } catch (e) {} recAudio = null; }
    if (recUrl) { try { URL.revokeObjectURL(recUrl); } catch (e) {} recUrl = null; }
    closeOverlay();
    if (reachedEnd) track('shadow_complete', { count: queue.length, mode: currentMode, level: currentLevel });
  }

  // === 錄音對比(純本機)===
  async function toggleRec() {
    if (recording) { stopRec(); return; }
    const hint = document.getElementById('recHint'), btn = document.getElementById('recToggleBtn');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      if (hint) hint.textContent = '此瀏覽器不支援錄音,換 Safari/Chrome 試試。'; return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      if (hint) hint.textContent = '沒有麥克風權限 — 請在瀏覽器允許麥克風後再試。'; return;
    }
    recChunks = [];
    // iOS 只支援 mp4/aac、桌機/Android 多為 webm/opus。挑一個瀏覽器實際支援的容器,
    // 否則預設容器與實際編碼不符 → 回放常常「沒聲音」或延遲解碼。
    const _recMime = ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'].find(t => {
      try { return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
    });
    try { mediaRec = _recMime ? new MediaRecorder(recStream, { mimeType: _recMime }) : new MediaRecorder(recStream); }
    catch (e) { if (hint) hint.textContent = '錄音啟動失敗,請重試。'; return; }
    mediaRec.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
    mediaRec.onstop = () => {
      if (recUrl) { try { URL.revokeObjectURL(recUrl); } catch (e) {} }
      const blob = new Blob(recChunks, { type: (mediaRec && mediaRec.mimeType) || (recChunks[0] && recChunks[0].type) || 'audio/mp4' });
      recUrl = URL.createObjectURL(blob);
      const pb = document.getElementById('recPlayBtn');
      if (pb) { pb.disabled = false; pb.style.opacity = '1'; }
      setRecPlayBtn(false);   // 新錄音就緒 → 按鈕回到「▶ 聽我的」
      if (hint) hint.textContent = '已錄音,按「聽我的」和原音()對比';
      if (recStream) { try { recStream.getTracks().forEach(t => t.stop()); } catch (e) {} recStream = null; }  // 用完就關麥克風
    };
    // 錄音時先暫停跟讀播放(TTS/自動跳),避免原音蓋到錄音、造成卡頓
    if (!paused) { paused = true; clearTimer(); }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    try { if (_sharedAudio) _sharedAudio.pause(); } catch (e) {}
    mediaRec.start();
    recording = true;
    if (btn) { btn.textContent = '停止錄音'; btn.style.background = '#555'; }
    if (hint) hint.textContent = '錄音中… 念完按「停止錄音」';
  }
  function stopRec() {
    if (mediaRec && recording) { try { mediaRec.stop(); } catch (e) {} }
    recording = false;
    const btn = document.getElementById('recToggleBtn');
    if (btn) { btn.textContent = '開始錄音'; btn.style.background = '#B8362A'; }
  }
  function setRecPlayBtn(playing) {
    const pb = document.getElementById('recPlayBtn');
    if (pb) pb.textContent = playing ? '停止' : '▶ 聽我的';
  }
  function playRec() {
    if (!recUrl) return;
    // 正在播 → 再按一下就停(icon 已是 ⏹ 停止)
    if (recAudio && !recAudio.paused) { try { recAudio.pause(); recAudio.currentTime = 0; } catch (e) {} setRecPlayBtn(false); return; }
    // 先停掉正在播的原音/朗讀 + 暫停跟讀,避免和自己的錄音疊在一起造成卡頓
    if (!paused) { paused = true; clearTimer(); }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    try { if (_sharedAudio) _sharedAudio.pause(); } catch (e) {}
    // 共用一個播放元件(不每次 new Audio),回放更順;playsInline 讓 iOS 不跳全螢幕、走一般播放路徑
    if (!recAudio) {
      recAudio = new Audio(); recAudio.preload = 'auto'; recAudio.playsInline = true;
      recAudio.addEventListener('ended', () => setRecPlayBtn(false));
      recAudio.addEventListener('pause', () => setRecPlayBtn(false));
    }
    try { recAudio.pause(); } catch (e) {}
    recAudio.src = recUrl;
    recAudio.currentTime = 0;
    recAudio.play().then(() => setRecPlayBtn(true)).catch(() => setRecPlayBtn(false));
  }

  // Collect playable texts from currently rendered grammar / vocab list.
  function collectGrammarTexts() {
    const out = [];
    document.querySelectorAll('.gc .ex').forEach(ex => {
      const j = ex.querySelector('.j');
      const z = ex.querySelector('.z');
      if (!j) return;
      // Grammar j contains <em> markup — strip via textContent
      const _c = j.cloneNode(true); _c.querySelectorAll('rt, svg').forEach(el => el.remove());
      const jText = (_c.textContent || '').replace(/[\s　]+$/,'').trim();
      // The .j also contains the speaker SVG label; strip it
      const cleanJ = jText.replace(/[ \s]*$/, '').trim();
      if (cleanJ) out.push({ j: cleanJ, z: z ? z.textContent : '' });
    });
    return out;
  }
  function collectVocabTexts() {
    const out = [];
    const lv = (typeof currentLevel === 'string') ? currentLevel : '';
    document.querySelectorAll('.vi').forEach(vi => {
      const text = vi.dataset.r || vi.dataset.w;
      const w = vi.dataset.w || '';
      // 從 DOM 抓中譯（cvt 已經套用過繁/簡）
      const m = (vi.querySelector('.vm')?.textContent || '').trim();
      if (!text) return;
      // z 行：漢字 · 中譯（兩者都有則用 · 分隔；只有漢字或只有中譯都正常顯示）
      let z = '';
      if (w && w !== text && m) z = w + ' · ' + m;
      else if (w && w !== text) z = w;
      else if (m) z = m;
      // 帶上 w/lv/m → 收藏走 word_notebook 統一收藏池
      out.push({ j: text, z, w, lv, m });
    });
    return out;
  }

  function startCurrent() {
    const items = currentMode === 'vocab' ? collectVocabTexts() : collectGrammarTexts();
    start(items);
  }

  // 跟讀我的收藏：合併 shadow_favs（句子）+ word_notebook（單字），洗牌後播放
  function startFavs() {
    const d = loadFavs();
    const items = Object.values(d).map(f => ({ j: f.j, z: f.z || '' }));
    try {
      const nb = JSON.parse(localStorage.getItem('word_notebook')) || [];
      nb.forEach(x => {
        if (!x || !x.w) return;
        const j = x.r || x.w;
        let z = '';
        if (x.w !== j && x.m) z = x.w + ' · ' + x.m;
        else if (x.w !== j) z = x.w;
        else if (x.m) z = x.m;
        items.push({ j, z, w: x.w, lv: x.lv, m: x.m || '' });
      });
    } catch(e) {}
    if (!items.length) { AppUI.alert('還沒有收藏。在單字旁點 ★ 或在跟讀按 / F 加入。'); return; }
    items.sort(() => Math.random() - 0.5);
    start(items);
  }

  // 只跟讀「收藏的文法」例句(文法卡 ★ → favorites[lv]),純文法、專注練不熟的
  function startGrammarFavs() {
    const items = [];
    ['n5','n4','n3','n2','n1'].forEach(lv => {
      const favIds = favorites[lv] || [];
      if (!favIds.length) return;
      const byId = {};
      (getGrammarData(lv).data || []).forEach(g => { byId[g.id] = g; });
      favIds.forEach(id => {
        const g = byId[id];
        if (!g || !Array.isArray(g.eg)) return;
        g.eg.forEach(e => {
          const j = (e.j || '').replace(/<[^>]+>/g, '').trim();  // 去掉 <em> 等標籤
          if (j) items.push({ j, z: e.z || g.t || '' });
        });
      });
    });
    if (!items.length) { AppUI.alert('還沒收藏文法。在文法卡右上點 ★ 收藏,再回來這裡只跟讀你收藏的文法。'); return; }
    items.sort(() => Math.random() - 0.5);
    start(items);
  }

  function favCount() {
    let c = Object.keys(loadFavs()).length;
    try { c += (JSON.parse(localStorage.getItem('word_notebook')) || []).length; } catch(e) {}
    return c;
  }

  // ── 發音辨識(免費,不用 AI)──
  function spkPost(o) { try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(o)); } catch (e) {} }
  const kata2hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const spkNorm = s => kata2hira(s).replace(/[\s　、。『』・,.!?！？…ー〜()]/g, '');
  function spkScore(target, heard) {
    // 目標句與辨識結果都轉平假名、去標點 → LCS 比對(分母取兩者較長,少念/多念都扣)
    const a = [...spkNorm(target)], b = [...spkNorm(heard)], m = a.length, n = b.length;
    if (!m || !n) return 0;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    return Math.round(dp[m][n] / Math.max(m, n) * 100);
  }
  function setSpkBtn(on) { const b = document.getElementById('spkMicBtn'); if (b) { b.textContent = on ? '停止' : '發音檢查'; b.style.background = on ? '#555' : '#2563eb'; } }
  function spkErr(st, err) {
    if (!st) return;
    if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture') st.textContent = '需要麥克風權限才能辨識,請允許後再試。';
    else if (err === 'network') st.textContent = '瀏覽器辨識服務連線失敗(Chrome 雲端辨識偶爾會這樣);App 內用裝置原生辨識,不受影響。';
    else if (err === 'language-not-supported') st.textContent = '此裝置不支援日文辨識。';
    else st.textContent = '沒聽清楚,再念一次看看 ';
  }
  function showSpkResult(heard) {
    const it = queue[idx] || {}; const score = spkScore(it.j || '', heard);
    const verdict = score >= 85 ? '完美!發音很清楚 ' : score >= 60 ? '不錯!再順一點就更好 ' : '再念一次試試 ';
    const color = score >= 60 ? 'var(--ok,#16A34A)' : 'var(--ac,#e0563f)';
    const res = document.getElementById('spkResult'); if (!res) return;
    res.innerHTML = '<div style="background:var(--bg3,#f4f4f5);border-radius:12px;padding:12px 14px;max-width:340px;margin:0 auto">' +
      '<div style="font-size:24px;font-weight:800;color:' + color + '">' + score + '%</div>' +
      '<div style="font-size:13.5px;margin-top:2px">' + verdict + '</div>' +
      '<div style="font-size:12px;color:var(--tx3,#999);margin-top:6px">我聽到:「' + heard + '」</div></div>';
  }
  function stopSpeech() { if (spkIsNative()) spkPost({ type: 'SPEECH_STOP' }); else { try { sr && sr.stop(); } catch (e) {} } }
  function startSpeechNative(st) {
    spkFinal = ''; listening = true; setSpkBtn(true); if (st) st.textContent = '聽你念…';
    clearTimeout(spkTimer); spkTimer = setTimeout(() => spkPost({ type: 'SPEECH_STOP' }), 8000);
    window.stayjpSpeechResult = (transcript, isFinal) => { if (isFinal) { if (transcript) spkFinal = transcript; } else if (transcript && st) st.textContent = '… ' + transcript; };
    window.stayjpSpeechEnd = (err) => { listening = false; setSpkBtn(false); clearTimeout(spkTimer); if (spkFinal) { if (st) st.textContent = ''; showSpkResult(spkFinal); } else spkErr(st, err); };
    spkPost({ type: 'SPEECH_START', lang: 'ja-JP' });
  }
  function speechToggle() {
    if (listening) { stopSpeech(); return; }
    const st = document.getElementById('spkStatus'), res = document.getElementById('spkResult');
    if (res) res.innerHTML = '';
    // 先停原音,避免蓋到辨識
    paused = true; clearTimer(); if (audioEl) { try { audioEl.pause(); } catch (e) {} }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    if (spkIsNative()) { startSpeechNative(st); return; }
    if (!SR_CLS) { if (st) st.textContent = '這個瀏覽器不支援語音辨識,請用 Chrome/Safari 或 App。'; return; }
    spkFinal = ''; let finalText = '', gotErr = '';
    sr = new SR_CLS(); sr.lang = 'ja-JP'; sr.interimResults = true; sr.continuous = false; sr.maxAlternatives = 1;
    sr.onstart = () => { listening = true; setSpkBtn(true); if (st) st.textContent = '聽你念…'; clearTimeout(spkTimer); spkTimer = setTimeout(() => { try { sr.stop(); } catch (e) {} }, 8000); };
    sr.onresult = e => { let interim = ''; for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript)); if (interim && st) st.textContent = '… ' + interim; };
    sr.onerror = ev => { gotErr = ev.error || 'error'; };
    sr.onend = () => { listening = false; setSpkBtn(false); clearTimeout(spkTimer); if (finalText) { if (st) st.textContent = ''; showSpkResult(finalText); } else spkErr(st, gotErr); };
    try { sr.start(); } catch (e) { if (st) st.textContent = '無法啟動辨識,請重試。'; }
  }

  return { startCurrent, startFavs, startGrammarFavs, start, favCount };
})();

// ========== DAILY STORY (今日故事) ==========
// 把每日 20 個單字串成一篇短故事 + 跟讀。
// Story 動態 fetch from scripts/daily-stories/output/{level}_{batchIdx}.json
// 之後可改為從 Firestore content/master.stories 拉。
const DailyStory = (() => {
  // 故事庫:key = `${level}_${batchIdx}`,batchIdx = floor(totalOffset / DAILY_NEW)
  // 動態 fetch 後填這個 cache。內嵌 fallback 給 batch 0 一篇示範。
  const STORIES = {
    'n5_0': {
      title: 'N5 Day 1 · 我的家族',
      title_en: 'N5 Day 1 · My Family',
      vocab: ['私','僕','あなた','彼','彼女','皆さん','人','方','子供','男','女','男の子','女の子','大人','友達','名前','家族','お父さん','お母さん','お兄さん'],
      sentences: [
        { j: '私の名前は田中です。', z: '我叫田中。', e: 'My name is Tanaka.' },
        { j: '家族は四人です。お父さん、お母さん、お兄さん、僕です。', z: '家裡有四個人:爸爸、媽媽、哥哥、我。', e: 'There are four people in my family: Dad, Mom, my older brother, and me.' },
        { j: '僕は男の子で、学校に友達がたくさんいます。', z: '我是男孩子,學校裡有很多朋友。', e: "I'm a boy, and I have lots of friends at school." },
        { j: 'クラスの男の子も女の子も、皆さん優しい人ばかりです。', z: '班上的男生女生,大家都是很善良的人。', e: 'The boys and girls in my class are all kind people.' },
        { j: '隣の家に彼と彼女が住んでいます。', z: '隔壁住著他和她。', e: 'A guy and a girl live next door.' },
        { j: '彼は大人の男の人、彼女は女の人で、子供もいます。', z: '他是大人男生,她是女生,還有一個小孩。', e: "He's a grown man and she's a woman, and they have a child." },
        { j: 'あなたの家族には、優しい方がいますか?', z: '你家裡也有善良的人嗎?', e: 'Are there any kind people in your family too?' },
      ],

  };

  let _audio = null;
  let _playing = false;
  let _playToken = 0;

  function getStoryId() {
    const prog = getDailyProgress(currentLevel);
    const batchIdx = Math.floor(prog.totalOffset / DAILY_NEW);
    return `${currentLevel}_${batchIdx}`;
  }

  function highlightVocab(jp, vocabList) {
    // 依長度排序,長詞先替換,避免「お父さん」被「父」吃掉
    const sorted = [...vocabList].sort((a, b) => b.length - a.length);
    let out = jp;
    for (const w of sorted) {
      const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      out = out.replace(re, `<em class="ds-hl">${w}</em>`);
    }
    return out;
  }

  async function fetchStory(id) {
    if (STORIES[id]) return STORIES[id];

    try {
      const r = await fetch(`scripts/daily-stories/output/${id}.json`);
      if (!r.ok) return null;
      const data = await r.json();
      if (!data.pass || !data.story) return null;
      // 同時保存 vocab list 進故事物件(畫面 highlight 要用)
      const story = { ...data.story, vocab: data.vocab };
      STORIES[id] = story;
      return story;
    } catch (e) { return null; }

  async function open() {

    if (!story) {

  function showModal(story) {

      <div class="cc-box" style="width:min(560px,calc(100vw - 32px));max-height:85vh;overflow-y:auto">

        </div>

            <div class="ds-sent" data-i="${i}">

          <button class="cc-btn" id="dsPlayAll" onclick="DailyStory.playAll()" style="flex:1;background:var(--ac);color:#fff;border-color:var(--ac);font-size:14px;padding:11px"><i data-ic=volume></i> 播放整段</button>
          <button class="cc-btn" onclick="DailyStory.toggleTrans()" style="flex:1"><i data-ic=globe></i> 切換中譯</button>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--tx3);text-align:center">點任一句直接播 · 按 ESC 關閉</div>
      </div>
    `;
    document.body.appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('on'));
    document.addEventListener('keydown', _onEsc);
  }

  function _onEsc(e) { if (e.key === 'Escape') close(); }

  function close() {
    _playToken++;
    stopAudio();
    const mask = document.getElementById('dsMask');
    if (mask) { mask.classList.remove('on'); setTimeout(() => mask.remove(), 250); }
    document.removeEventListener('keydown', _onEsc);
  }

  function stopAudio() {
    _playing = false;
    _playToken++;   // 作廢任何進行中的播放鏈 / play() fallback
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (_audio) { try { _audio.onended = null; _audio.onerror = null; _audio.pause(); _audio.src = ''; } catch (e) {} _audio = null; }
    document.querySelectorAll('.ds-sent.playing').forEach(el => el.classList.remove('playing'));
  }

  function playSentence(text, onEnd) {
    const myToken = _playToken;
    const hash = window.__TTS && window.__TTS[text];
    if (hash) {
      if (!_audio) _audio = new Audio();
      _audio.onended = onEnd;
      _audio.onerror = onEnd;
      _audio.src = window.ttsUrl ? window.ttsUrl(hash) : 'audio/tts/' + hash + '.mp3';
      _audio.playbackRate = 0.95 * (typeof getTtsSpeed === 'function' ? getTtsSpeed() : 1);
      // play() 被 stopAudio 中斷會 reject;若已停止(token 變了)就別 fallback 到瀏覽器語音(否則關掉後還繼續講)
      _audio.play().catch(() => { if (myToken === _playToken) speakBrowser(text, onEnd); else onEnd && onEnd(); });
    } else {
      speakBrowser(text, onEnd);
    }
  }

  function speakBrowser(text, onEnd) {
    if (!window.speechSynthesis) { onEnd && onEnd(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.9 * (typeof getTtsSpeed === 'function' ? getTtsSpeed() : 1);
    const voices = speechSynthesis.getVoices();
    const ja = voices.find(v => v.lang.startsWith('ja'));
    if (ja) u.voice = ja;
    u.onend = () => onEnd && onEnd();
    speechSynthesis.speak(u);
  }

  function playOne(i) {
    stopAudio();
    const story = STORIES[getStoryId()];
    if (!story) return;
    const sent = story.sentences[i];
    const el = document.querySelector(`.ds-sent[data-i="${i}"]`);
    if (el) el.classList.add('playing');
    playSentence(sent.r || sent.j, () => { if (el) el.classList.remove('playing'); });
  }

  async function playAll() {
    // 在播 → 視為「暫停」鍵,停止後不再重啟
    if (_playing) {
      stopAudio();
      const btn = document.getElementById('dsPlayAll');
      if (btn) btn.textContent = '播放整段';
      return;
    }
    const story = STORIES[getStoryId()];
    if (!story) return;
    stopAudio();
    _playing = true;
    const myToken = ++_playToken;
    const btn = document.getElementById('dsPlayAll');
    if (btn) btn.textContent = '暫停';
    for (let i = 0; i < story.sentences.length; i++) {
      if (myToken !== _playToken || !_playing) break;
      const sent = story.sentences[i];
      const el = document.querySelector(`.ds-sent[data-i="${i}"]`);
      if (el) el.classList.add('playing');
      await new Promise(resolve => playSentence(sent.r || sent.j, resolve));
      if (el) el.classList.remove('playing');
      // 句間停頓
      await new Promise(r => setTimeout(r, 350));
    }
    _playing = false;
    if (btn) btn.textContent = '播放整段';
  }

  function toggleTrans() {
    const body = document.getElementById('dsBody');
    if (!body) return;
    const showing = body.dataset.trans === 'on';
    body.dataset.trans = showing ? 'off' : 'on';
    body.querySelectorAll('.ds-z').forEach(el => {
      el.style.display = showing ? 'none' : 'block';
    });
  }

  return { open, close, playOne, playAll, toggleTrans };
})();

// ========== ANALYTICS ==========
// Thin wrapper around gtag so call sites stay readable and we tolerate missing GA
// (e.g. ad-blocker dropping the script). Param values are kept short — GA4 rejects
// strings >100 chars and we don't want to leak full sentences.
function track(event, params) {
  try {
    if (typeof gtag === 'function') gtag('event', event, params || {});
  } catch (e) { /* never crash the UI on telemetry */ }
}

// ========== STREAK ==========
// Daily-visit streak counter. Stored in localStorage so anonymous users get value
// immediately; once they log in we sync to Firestore so the streak survives a cache wipe
// or device switch. Layered prompts at 3 / 7 days nudge anonymous users to log in to
// "back up" what they've already accumulated (loss aversion > acquisition framing).
const Streak = (() => {
  const KEY = 'streak_v1';
  const PROMPT_KEY = 'streak_login_prompt_at_7';

  function todayLocal() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
  function diffDays(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  // study_log(跨裝置日期聯集合併)推導的連續天數——比 streak_v1 計數器可靠,取兩者較大顯示/上傳
  function _derived() {
    try {
      if (typeof Calendar !== 'undefined' && Calendar.getStreaks) return Calendar.getStreaks();
    } catch (e) {}
    return { current: 0, longest: 0 };
  }
  function effectiveDays() {
    const s = load(), d = _derived();
    return Math.max(s.days || 0, d.current || 0);
  }

  function markToday() {
    const s = load();
    const today = todayLocal();
    // 換裝置/雲端合併後 study_log 比本機計數器新 → 先校正再累加(修跨裝置天數不同步)
    const dv = _derived().current || 0;
    if (dv > (s.days || 0)) { s.days = dv; }
    if (s.last === today) { save(s); return s; } // already counted today
    if (!s.last) {
      s.days = 1;
    } else {
      const gap = diffDays(s.last, today);
      if (gap === 1) s.days = (s.days || 0) + 1;
      else if (gap > 1) s.days = 1; // streak broken — reset
      // gap === 0 already handled above; gap < 0 (clock went backward) ignore
    }
    s.last = today;
    s.longest = Math.max(s.longest || 0, s.days);
    save(s);
    syncUp(s);
    if ([3, 7, 14, 30, 60, 100, 365].includes(s.days)) track('streak_milestone', { days: s.days });
    return s;
  }

  function syncUp(s) {
    if (typeof currentUser === 'undefined' || !currentUser || !db) return;
    db.collection('users').doc(currentUser.uid).set({ streak: s }, { merge: true }).catch(() => {});
  }
  // Pull cloud value on login and merge with local — keep whichever has more days/last.
  async function syncDown() {
    if (!currentUser || !db) return;
    try {
      const doc = await db.collection('users').doc(currentUser.uid).get();
      const cloud = (doc.exists && doc.data().streak) || null;
      if (!cloud) { syncUp(load()); return; }
      const local = load();
      const winner = (cloud.last || '') > (local.last || '') ? cloud : (cloud.days || 0) > (local.days || 0) ? cloud : local;
      save(winner);
      render();
    } catch (e) { /* offline — local wins */ }
  }

  function render() {
    const s = load();
    const btn = document.getElementById('streakBtn');
    const num = document.getElementById('streakNum');
    if (!btn || !num) return;
    const days = effectiveDays();
    if (!days) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    num.textContent = days;
    btn.classList.toggle('streak-warn', !currentUser && days >= 3);
  }

  function showInfo() {
    const s = load();
    const isLoggedIn = typeof currentUser !== 'undefined' && currentUser;
    // 統計:學習天數 = study_log 有活動的日子;單日最多 = 最大動作數
    let daysLearned = 0, maxDay = 0, heat = '';
    try {
      const log = (typeof Calendar !== 'undefined' && Calendar.getLog) ? Calendar.getLog() : {};
      Object.keys(log).forEach(k => {
        const d = log[k]; const n = (d.vocab||0)+(d.grammar||0)+(d.quiz||0);
        if (n > 0) { daysLearned++; if (n > maxDay) maxDay = n; }
      });
      heat = (typeof Calendar !== 'undefined' && Calendar.heatmapHTML) ? Calendar.heatmapHTML() : '';
    } catch (e) {}
    const loginHint = (!isLoggedIn && (s.days || 0) >= 1)
      ? `<div class="hm-hint">${enOr(cvt('紀錄目前只存在這台裝置,登入後自動雲端備份。'),'Your record lives on this device only — sign in to back it up.')} <button class="hm-login" onclick="document.getElementById('heatModal').remove();handleAuth()">${enOr('登入','Sign in')}</button></div>`
      : '';
    const old = document.getElementById('heatModal'); if (old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = 'heatModal'; wrap.className = 'hm-backdrop';
    wrap.innerHTML = `<div class="hm-card" role="dialog" aria-modal="true">
      <div class="hm-title"><i data-ic=fire></i> ${enOr(cvt('學習熱力圖'),'Study heatmap')}</div>
      <div class="hm-stats">
        <div><b>${effectiveDays()}</b><span>${enOr(cvt('連續天數'),'Streak')}</span></div>
        <div><b>${daysLearned}</b><span>${enOr(cvt('學習天數'),'Days studied')}</span></div>
        <div><b>${maxDay}</b><span>${enOr(cvt('單日最多'),'Best day')}</span></div>
      </div>
      <div class="hm-heat">${heat}</div>
      <div class="hm-note">${enOr(cvt('每天學習就會點亮一格・顯示近三個月'),'Study any day to light a square · last 3 months')}</div>
      ${loginHint}
      <button class="hm-close" onclick="document.getElementById('heatModal').remove()">${enOr(cvt('關閉'),'Close')}</button>
    </div>`;
    wrap.onclick = (e) => { if (e.target === wrap) wrap.remove(); };
    document.body.appendChild(wrap);
    try { if (window.hydrateIcons) hydrateIcons(wrap); } catch (e) {}
  }

  // First time the user hits 7 days while still anonymous, surface a one-shot login modal.
  function maybePromptAt7() {
    const s = load();
    const promptedAlready = localStorage.getItem(PROMPT_KEY);
    const isLoggedIn = typeof currentUser !== 'undefined' && currentUser;
    if (s.days >= 7 && !promptedAlready && !isLoggedIn) {
      localStorage.setItem(PROMPT_KEY, '1');
      setTimeout(() => {
        if (confirm(`你已經連續學習 ${s.days} 天了！\n\n這份紀錄目前只存在這台裝置——清快取或換裝置就會消失。\n\n登入後雲端備份，1 秒搞定。要登入嗎？`)) handleAuth();
      }, 1500);
    }
  }

  return { markToday, render, showInfo, syncDown, maybePromptAt7, effectiveDays };
})();

function showConfirm(opts) {
  return new Promise(resolve => {
    const { title = '', message = '', okText = '確定', cancelText = '取消', danger = false } = opts || {};
    const mask = document.createElement('div');
    mask.className = 'cc-mask';
    mask.innerHTML = `<div class="cc-box" role="dialog" aria-modal="true">
      ${title?`<div class="cc-title">${title}</div>`:''}
      <div class="cc-msg">${message}</div>
      <div class="cc-btns">
        <button class="cc-btn" data-act="cancel">${cancelText}</button>
        <button class="cc-btn ${danger?'danger':'primary'}" data-act="ok">${okText}</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('on'));
    const close = (val) => {
      mask.classList.remove('on');
      setTimeout(() => mask.remove(), 200);
      document.removeEventListener('keydown', onKey);
      resolve(val);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(false); else if (e.key === 'Enter') close(true); };
    document.addEventListener('keydown', onKey);
    mask.addEventListener('click', e => {
      if (e.target === mask) close(false);
      else if (e.target.dataset.act === 'ok') close(true);
      else if (e.target.dataset.act === 'cancel') close(false);
    });
  });
}

function renderVocab() {

  const favList = [...favSet];
  const mn = document.getElementById('mn');
  const sd = document.getElementById('sd');

  let filtered = data;
  if (lf) filtered = filtered.filter(d => d.w.includes(lf)||d.r.includes(lf)||d.m.includes(lf)||( /^[a-z0-9 \-']+$/.test(lf) && kanaToRomaji(d.r).includes(lf) ));

  const groups = {};

      <button class="daily-btn ${dailyMode?'on':''}" onclick="toggleDailyMode()">${dailyMode?t('show_all'):t('daily_mode')}</button>
      <button class="shadow-trigger" onclick="Shadow.startCurrent()" ${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('shadow')?'style="opacity:.55"':''}>${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('shadow')?'<i data-ic=lock></i>':'<i data-ic=headphones></i>'} ${enOr('跟讀本頁','Shadow this page')}</button>
      ${themeFilter ? `<span class="th-active"><i data-ic=tag></i> ${enOr(cvt(themeFilter), themeEn(themeFilter))} · ${filtered.length} ${enOr(cvt('字'),'words')} <button onclick="setThemeFilter('')">${enOr(cvt('清除'),'Clear')}</button></span>` : ''}
      <button class="daily-btn imm-btn ${document.body.classList.contains('imm-zh')?'on':''}" onclick="toggleImmersion()" title="${enOr('隱藏中文翻譯,點卡片才顯示——逼自己用日文理解','Hide Chinese; tap a card to reveal')}"><i data-ic=eye></i> ${document.body.classList.contains('imm-zh')?enOr('顯示中文','Show ZH'):enOr('隱藏中文','Hide ZH')}</button>
      ${dailyView?`<button class="daily-btn" onclick="FlashCard.beginToday()" ${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('flashcard')?'style="opacity:.55"':''}>${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('flashcard')?'<i data-ic=lock></i>':'<i data-ic=bolt></i>'} 快速背本批</button>`:''}
      ${dailyView?`<button class="daily-btn" onclick="DailyStory.open()" style="background:linear-gradient(135deg,#D4654A,#E8734A);color:#fff;border-color:#D4654A${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('story')?';opacity:.55':''}">${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('story')?'<i data-ic=lock></i>':'<i data-ic=book></i>'} 今日故事</button>`:''}
      ${window.ToolQuota&&ToolQuota.upsellLine?ToolQuota.upsellLine():''}
      ${dailyView?`<div class="daily-batch-row">
        ${prog.totalOffset>0?`<button class="daily-btn" onclick="prevDailyBatch()">${t('prev_batch')}</button>`:''}
        ${prog.totalOffset<cnt?`<button class="daily-btn" onclick="nextDailyBatch()">${t('next_batch')}</button>`:''}
        ${prog.totalOffset>0?`<button class="daily-btn daily-reset" onclick="resetDailyBatch()" title="${t('reset_progress')}">↺</button>`:''}
      </div>`:''}
    </div>`;
    if (!dailyView) {
      h += `<div class="intro"><h2>${t('vocab_title', { lv })}</h2><p>${t('vocab_desc', { lv, n: cnt })}</p><div class="tg"><span>JLPT ${lv}</span><span>${t('vocab_tag', { n: cnt })}</span><span>${t('listen_tag')}</span></div></div>`;
    } else {
      const start = prog.totalOffset;
      const end = Math.min(start + DAILY_NEW, cnt);
      h += `<div class="intro"><h2>${t('daily_title', { lv })}</h2><p>${t('daily_desc', { start: start+1, end, count: end-start })}</p><div class="tg"><span>${t('daily_tag', { n: DAILY_NEW })}</span><span>${t('listen_tag')}</span></div></div>`;
    }
  }

  // 從 .vi 的 data-r（平假名讀音）發音，fallback 到 data-w（漢字）
  const spkSvg = '<svg class="spk" onclick="event.stopPropagation();var vi=this.closest(\'.vi\');speak(vi.dataset.r||vi.dataset.w)" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>';

  // 單一單字卡 HTML(兩處渲染共用,免分歧)。控制項(喇叭/変/詞性/★)絕對定位右上,
  // 讓詞義+例句+虛線滿版;虛線上半=點卡身唸單字,虛線下半=點例句唸例句(見 document click 委派)。
  // 例句一律可點(音檔已全生成,speak() 有 mp3 用 mp3、沒有退瀏覽器 TTS)。
  const esc1 = s => (''+s).replace(/'/g, "\\'");
  function vocabCardHTML(d, catName, isFav) {
    const verbBtn = d.c === '動' ? `<button class="verb-btn" onclick="event.stopPropagation();openVerbModal('${esc1(d.w)}','${esc1(d.r||'')}')" title="變化表">変</button>` : '';
    const ex = d.ex ? `<div class="vex" data-nolang data-j="${(''+d.ex.j).replace(/"/g,'&quot;')}" onclick="event.stopPropagation();speak(this.dataset.j)" title="${enOr('點例句聽發音','Tap to hear')}"><span class="exj">${window.furiganaHTML?window.furiganaHTML(d.ex.j):d.ex.j}<svg class="vex-spk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg></span><span class="exz">${enOr(d.ex.z,d.ex.e||'')}</span></div>` : '';
    return `<div class="vi" data-fid="${d.w}" data-w="${d.w}" data-r="${d.r||''}">`
      + `<div class="vx-ctrl"><span class="vspd${getTtsSpeed() !== 1 ? ' on' : ''}" onclick="event.stopPropagation();cycleTtsSpeed()" title="${enOr('語音速度(點擊切換)', 'Audio speed (tap to cycle)')}">${getTtsSpeed() === 1 ? '1' : getTtsSpeed()}×</span>${spkSvg}${verbBtn}<span class="vp">${catLabel(catName)}</span><svg class="star ${isFav?'on':''}" onclick="event.stopPropagation();toggleFav('${esc1(d.w)}')" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>`
      + `<div class="vw">${d.w}</div>${d.w!==d.r?`<div class="vr">${d.r}</div>`:''}<div class="vm">${cvt(d.m)}</div>`
      + ex
      + `</div>`;
  }

  // Use virtual list for full list (no search, no daily, no fav filter)
  const useVL = !lf && !showFavOnly && !dailyMode && typeof VirtualList !== 'undefined' && filtered.length > 200;

  if (useVL) {
    // Destroy previous virtual list if active
    VirtualList.destroy();

    // Build flat item array with category headers
    // 同時記錄「分類 → header 在扁平陣列的索引」,讓側邊欄能叫 VirtualList 捲到該分類。
    const vlItems = [];
    window._vlCatIndex = {};
    VOCAB_CATS.forEach(cat => {
      const items = groups[cat.key];
      if (!items || !items.length) return;
      window._vlCatIndex[cat.key] = vlItems.length;
      vlItems.push({ type: 'header', cat, count: items.length });
      items.forEach(d => vlItems.push({ type: 'item', d, catName: cat.name }));
    });

    const vc = filtered.length;
    h += `<div id="vl-container"></div>`;
    mn.innerHTML = h;

    const vlContainer = document.getElementById('vl-container');
    VirtualList.init({
      container: vlContainer,
      items: vlItems,
      itemHeight: 170,   // 僅估計值(未量測項用);真實高度由 VirtualList 渲染後量測修正,標題/卡片各自正確
      buffer: 8,
      renderItem: (entry) => {
        if (entry.type === 'header') {
          return `<section class="cs"><h2><span class="ci2">${entry.cat.icon}</span>${catLabel(entry.cat.name)}<span style="font-size:12px;color:#999;font-weight:400;margin-left:auto">${t('cat_count_vocab', { n: entry.count })}</span></h2></section>`;
        }
        const d = entry.d;
        const isFav = favList.includes(d.w);
        return vocabCardHTML(d, entry.catName, isFav);
      }
    });

    document.getElementById('stats').textContent = `${vc} / ${data.length}`;
    updateFavCount();
  } else {
    // Destroy virtual list if switching away from full mode
    if (typeof VirtualList !== 'undefined' && VirtualList.isActive()) VirtualList.destroy();
    window._vlCatIndex = null;   // 非虛擬列表 → 側邊欄改走 #vcat anchor(區塊都在 DOM)

    let vc = 0;
    VOCAB_CATS.forEach(cat => {
      const items = groups[cat.key];
      if (!items||!items.length) return;
      vc += items.length;
      h += `<section class="cs" id="vcat-${cat.key}"><h2><span class="ci2">${cat.icon}</span>${catLabel(cat.name)}<span style="font-size:12px;color:#999;font-weight:400;margin-left:auto">${t('cat_count_vocab', { n: items.length })}</span></h2>`;
      h += '<div class="vg">';
      items.forEach(d => {
        const isFav = favList.includes(d.w);
        h += vocabCardHTML(d, cat.name, isFav);
      });
      h += '</div></section>';
    });

    if (!vc) h += `<div class="nr"><p>${showFavOnly?t('no_fav_vocab'):t('no_result_vocab')}</p></div>`;
    // 底部換批列(使用者回饋:背完一批不用上滑找按鈕)。只在每日模式 + 有結果時顯示。
    if (dailyView && vc) {
      h += `<div class="daily-batch-row" style="margin-top:20px;justify-content:center">
        ${prog.totalOffset>0?`<button class="daily-btn" onclick="prevDailyBatch()">${t('prev_batch')}</button>`:''}
        ${prog.totalOffset<data.length?`<button class="daily-btn" onclick="nextDailyBatch()">${t('next_batch')}</button>`:''}
      </div>`;
    }
    mn.innerHTML = h;
    document.getElementById('stats').textContent = `${vc} / ${data.length}`;
    updateFavCount();
  }

  // Sidebar
  let sh = '';
  // ── 依主題篩選(單語ノート式生活主題)──
  if (window.VOCAB_THEMES) {
    const tCount = {};
    data.forEach(d => { const th = VOCAB_THEMES[d.w + '|' + (d.r || '')]; if (th) tCount[th] = (tCount[th] || 0) + 1; });
    const names = (window.VOCAB_THEME_LIST || Object.keys(tCount)).filter(n => tCount[n]);
    if (names.length) {
      sh += `<div class="ct" onclick="toggleCat(this)">${enOr(cvt('生活主題'), 'Themes')}${themeFilter ? ' · ' + enOr(cvt(themeFilter), themeEn(themeFilter)) : ''}</div>`;
      sh += `<div class="ci theme-chips" style="max-height:${themeFilter ? 60 : 400}px">`;
      if (themeFilter) {
        sh += `<button class="th-chip on" onclick="setThemeFilter('')">${enOr(cvt(themeFilter), themeEn(themeFilter))} ✕</button>`;
      } else {
        names.forEach(n => { sh += `<button class="th-chip" onclick="setThemeFilter('${n}')">${enOr(cvt(n), themeEn(n))} <i>${tCount[n]}</i></button>`; });
      }
      sh += '</div>';
    }
  }
  VOCAB_CATS.forEach(cat => {
    const items = groups[cat.key];
    if (!items||!items.length) return;
    sh += `<div class="ct" onclick="toggleCat(this)">${catLabel(cat.name)} (${items.length})</div><div class="ci" style="max-height:${Math.min(items.length, 51) * 56}px">`;
    items.slice(0,50).forEach(d => { sh += `<a href="#vcat-${cat.key}" onclick="return vocabJump('${cat.key}')">${d.w} ${d.m}</a>`; });
    if(items.length>50) sh+=`<a href="#vcat-${cat.key}" style="color:var(--ac)" onclick="return vocabJump('${cat.key}')">${t('sidebar_more', { n: items.length-50 })}</a>`;
    sh += '</div>';
  });
  sd.innerHTML = sh;

  // Update footer
  const vocabTotal = (typeof VOCAB_N5!=='undefined'?VOCAB_N5.length:0) + (typeof VOCAB_N4!=='undefined'?VOCAB_N4.length:0) + (typeof VOCAB_N3!=='undefined'?VOCAB_N3.length:0) + (typeof VOCAB_N2!=='undefined'?VOCAB_N2.length:0) + (typeof VOCAB_N1!=='undefined'?VOCAB_N1.length:0);
  document.getElementById('ftInfo').textContent = t('ft_vocab', { lv: currentLevel.toUpperCase(), n: data.length, total: vocabTotal });
}

// ========== RENDER CONFUSABLES ==========
function renderConfuse() {
  const data = typeof CONFUSABLES !== 'undefined' ? CONFUSABLES : [];
  const mn = document.getElementById('mn');
  const sd = document.getElementById('sd');
  const lf = searchTerm;
  const lvFilter = currentLevel; // 'all','n3','n2'

  let filtered = data;
  if (lvFilter !== 'all') filtered = filtered.filter(d => d.level && d.level.toLowerCase().includes(lvFilter));
  if (lf) filtered = filtered.filter(d => d.title.includes(lf) || d.words.some(w => w.w.includes(lf)||w.m.includes(lf)) || (d.tip&&d.tip.includes(lf)));

  let h = '';
  if (!lf) {
    h += `<div class="intro"><h2>${t('confuse_title')}</h2><p>${t('confuse_desc')}</p><div class="tg"><span>${t('confuse_tag', { n: filtered.length })}</span><span>${t('confuse_expand')}</span></div></div>`;
  }

  filtered.forEach(cf => {
    h += '<div class="cf-card" onclick="this.classList.toggle(\'o\')"><div class="cf-hd"><span class="cf-lv">'+cf.level+'</span>'+cvt(cf.title)+'<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div><div class="cf-bd"><div class="cf-words">';
    cf.words.forEach(w => {
      h += '<div class="cf-w"><span class="cfw">'+w.w+'</span><span class="cfm">'+cvt(w.m)+'</span><span class="cfn">'+cvt(w.note)+'</span></div>';
    });
    h += '</div>';
    if (cf.tip) h += '<div class="cf-tip">'+cvt(cf.tip)+'</div>';
    if (cf.eg && cf.eg.length) {
      h += '<div class="cf-eg">';
      cf.eg.forEach(e => {
        const pureJ = e.j.replace(/<[^>]+>/g,'').replace(/'/g,"\\'");
        h += '<div class="ex" onclick="event.stopPropagation();speak(\''+pureJ+'\')" title="'+enOr('點方框唸例句','Tap box to hear')+'"><div class="j">'+(window.furiganaHTMLRich?window.furiganaHTMLRich(e.j):e.j)+'<svg class="ex-spk" onclick="event.stopPropagation();speak(\''+pureJ+'\')" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg></div><div class="z">'+cvt(e.z)+'</div></div>';
      });
      h += '</div>';
    }
    h += '</div></div>';
  });
  if (!filtered.length) h += `<div class="nr"><p>${t('no_result_confuse')}</p></div>`;
  mn.innerHTML = h;
  document.getElementById('stats').textContent = filtered.length + ' 組';

  let sh = '';
  filtered.slice(0, 60).forEach(cf => { sh += '<a href="#" onclick="event.preventDefault();closeSdMobile()">'+cf.title+'</a>'; });
  sd.innerHTML = sh;
  document.getElementById('ftInfo').textContent = t('ft_confuse', { n: data.length });
}

// ========== RENDER GRAMMAR ==========
function getGrammarData(lv) {
  // N5/N4/N3/N2/N1 grammar 從 Firestore 載入後設成 window globals；資料還沒到時用空陣列防 ReferenceError
  if (lv === 'n5') return { data: typeof N5 !== 'undefined' ? N5 : [], cats: CATS_N5 };
  if (lv === 'n4') return { data: typeof N4 !== 'undefined' ? N4 : [], cats: CATS_N4 };
  if (lv === 'n3') return { data: typeof N3 !== 'undefined' ? N3 : [], cats: CATS_N3 };
  if (lv === 'n2') return { data: typeof N2 !== 'undefined' ? N2 : [], cats: CATS_N2 };
  if (lv === 'n1') return { data: typeof N1 !== 'undefined' ? N1 : [], cats: CATS_N1 };
  return { data: [], cats: [] };
}
function render() {
  const gd = getGrammarData(currentLevel);
  const data = gd.data;
  const cats = gd.cats;
  const favList = favorites[currentLevel] || [];
  const mn = document.getElementById('mn');
  const sd = document.getElementById('sd');
  const lf = searchTerm;

  let filtered = data;
  if (lf) filtered = filtered.filter(d => d.t.includes(lf)||d.ex.includes(lf)||(d.p&&d.p.includes(lf))||d.eg.some(e=>e.j.includes(lf)||e.z.includes(lf)));
  if (showFavOnly) filtered = filtered.filter(d => favList.includes(d.id));

  // Grammar daily mode: limit to batch
  const gProg = getGrammarDailyProgress(currentLevel);
  if (grammarDailyMode && !lf && !showFavOnly) {
    const start = gProg.totalOffset;
    const end = Math.min(start + GRAMMAR_DAILY_NEW, data.length);
    filtered = data.slice(start, end);
  }

  const groups = {};
  cats.forEach(c => groups[c.name] = []);
  filtered.forEach(d => { if(groups[d.cat]) groups[d.cat].push(d); });

  let h = '';
  if (!lf && !showFavOnly) {
    // 文章入口卡、JLPT/AI 捷徑列已移到「學習面板」(renderHub);清單頁不再重複。
    const lv = currentLevel.toUpperCase();
    const cnt = data.length;
    const gMas = levelGrammarMastery(currentLevel);
    h += `<div class="daily-bar">
      <div class="dp"><div class="dp-lbl">${t('total_progress_grammar', { lv })}<button class="dp-help" onclick="dailyHelp()" aria-label="說明">ⓘ ${enOr('說明','Help')}</button></div><div class="dp-bar"><div class="dp-fill" style="width:${Math.round(gMas.learned/cnt*100)}%"></div></div>
      <div class="dp-txt">${enOr(cvt('已學'),'Learned')} ${gMas.learned} / ${cnt}${gMas.mastered ? ' ・' + enOr(cvt('熟練'),'mastered') + ' ' + gMas.mastered : ''}</div></div>
      <button class="daily-btn ${grammarDailyMode?'on':''}" onclick="toggleGrammarDailyMode()">${grammarDailyMode?t('show_all'):t('daily_mode')}</button>
      <button class="shadow-trigger" onclick="Shadow.startCurrent()" ${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('shadow')?'style="opacity:.55"':''}>${window.ToolQuota&&ToolQuota.isLocked&&ToolQuota.isLocked('shadow')?'<i data-ic=lock></i>':'<i data-ic=headphones></i>'} ${enOr('跟讀本頁','Shadow this page')}</button>
      ${currentLevel === 'n5' ? `<button class="shadow-trigger" style="background:var(--ac2);color:#fff" onclick="jumpToParticles()"><i data-ic=book></i> ${enOr('跳到助詞','Jump to particles')}</button>` : ''}
      ${window.ToolQuota&&ToolQuota.upsellLine?ToolQuota.upsellLine():''}
      ${grammarDailyMode?`<div class="daily-batch-row">
        ${gProg.totalOffset>0?`<button class="daily-btn" onclick="prevGrammarBatch()">${t('prev_batch')}</button>`:''}
        ${gProg.totalOffset<cnt?`<button class="daily-btn" onclick="nextGrammarBatch()">${t('next_batch')}</button>`:''}
        ${gProg.totalOffset>0?`<button class="daily-btn daily-reset" onclick="resetGrammarBatch()" title="${t('reset_progress')}">↺</button>`:''}
      </div>`:''}
    </div>`;
    if (!grammarDailyMode) {
      h += `<div class="intro"><h2>${t('grammar_title', { lv })}</h2><p>${t('grammar_desc', { lv, n: cnt })}</p><div class="tg"><span>JLPT ${lv}</span><span>${t('grammar_tag', { n: cnt })}</span><span>${t('brand_tag')}</span></div></div>`;
    } else {
      const start = gProg.totalOffset;
      const end = Math.min(start + GRAMMAR_DAILY_NEW, cnt);
      h += `<div class="intro"><h2>${t('daily_title_grammar', { lv })}</h2><p>${t('daily_desc_grammar', { start: start+1, end, count: end-start })}</p><div class="tg"><span>${t('daily_tag', { n: GRAMMAR_DAILY_NEW })}</span><span>${t('brand_tag')}</span></div></div>`;
    }
  }

  let vc = 0;
  cats.forEach(cat => {
    const items = groups[cat.name];
    if (!items||!items.length) return;
    vc += items.length;
    h += `<section class="cs" id="cat-${cat.name}"><h2><span class="ci2">${cat.icon}</span>${catLabel(cat.name)}<span style="font-size:12px;color:#999;font-weight:400;margin-left:auto">${t('cat_count_grammar', { n: items.length })}</span></h2>`;
    items.forEach((d,i) => {
      const isFav = favList.includes(d.id);
      const idx = data.indexOf(d) + 1;
      const reportUrl = `mailto:stayjpplan@gmail.com?subject=${encodeURIComponent('[文法錯誤] ' + d.id + ' ' + d.t)}&body=${encodeURIComponent('文法 ID：' + d.id + '\n文法名：' + d.t + '\n\n錯誤描述：\n（請說明哪裡有錯，例如：接續格式、例句語感、中譯…）\n')}`;
      // 標題 🔊：播放第一個例句(已有 VOICEVOX 預錄,零讀音風險)。不用展開卡片就能先聽一次。
      const _gEx = (d.eg && d.eg[0]) ? d.eg[0].j.replace(/<[^>]+>/g, '').replace(/'/g, "\\'") : '';
      // 文法卡標題喇叭:先唸「文法句型本身」(VOICEVOX 預錄,__TTS_G),唸完自動接第一個例句。
      // 沒有句型音檔(混中文標題等)→ 照舊直接播例句。
      window.playGrammarTitle = window.playGrammarTitle || function (gid, exText) {
        try {
          var h = window.__TTS_G && window.__TTS_G[gid];
          if (!h) { if (exText) speak(exText); return; }
          var au = new Audio(window.ttsUrl ? window.ttsUrl(h) : 'audio/tts/' + h + '.mp3');

const LANG_CYCLE = ['zh-TW', 'zh-CN', 'en'];

// OpenCC 繁→簡 runtime 轉換（保留單一資料來源）
let _tw2cn = null;
function ensureOpenCC() {
  return new Promise((resolve) => {
    if (_tw2cn) return resolve(_tw2cn);
    if (window.OpenCC) {
      _tw2cn = window.OpenCC.Converter({ from: 'tw', to: 'cn' });
      if (I18n.setConverter) I18n.setConverter(_tw2cn);   // 讓 t() 在 zh-CN 缺 key 時也轉簡,不露繁體
      return resolve(_tw2cn);
    }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js';
    s.onload = () => {
      _tw2cn = window.OpenCC.Converter({ from: 'tw', to: 'cn' });
      if (I18n.setConverter) I18n.setConverter(_tw2cn);
      resolve(_tw2cn);
    };
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}
// Fisher-Yates 洗牌(全域)。⚠️ 別用 arr.sort(()=>Math.random()-0.5):對小陣列(如 4 選項)有嚴重偏差,
// 會讓原本 index 0 的元素(選擇題常把正解放第一個)大機率留在左上 → 答案老是左上。測驗選項/抽題一律用這個。
window.shuf = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

// 純中文 UI 容器(選單/設定彈窗,無日文詞頭)在 zh-CN 時把寫死的繁體字轉簡。
// 含假名的文字節點跳過(那是日文),避免動到日文內容;不做全域 walk(會誤傷「動詞」這類日文漢字詞頭)。
function cvtStaticUI(root) {
  if (I18n.getLang() !== 'zh-CN') return;
  const el = typeof root === 'string' ? document.getElementById(root) : root;
  if (!el) return;
  if (!_tw2cn) { ensureOpenCC().then(() => cvtStaticUI(el)); return; }   // OpenCC 還沒載好 → 載完再轉(自癒,免時序競態)
  const kana = /[ぁ-ゖァ-ヺー]/;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const list = []; let n;
  while ((n = w.nextNode())) list.push(n);
  list.forEach(node => {
    if (kana.test(node.nodeValue)) return;
    const c = _tw2cn(node.nodeValue);
    if (c !== node.nodeValue) node.nodeValue = c;
  });
}

// cvt(text): 若當前語言是 zh-CN，用 OpenCC 轉繁→簡；否則原樣回傳
// 用於：中文說明/中譯/分類名等非日文內容
function cvt(text) {
  if (!text || I18n.getLang() !== 'zh-CN' || !_tw2cn) return text;
  return _tw2cn(text);
}

let _enLoading = null;

function overlayEnglishContent(on) {
  const EN = window.STAYJP_EN || {};

  [['N5','N5_EN'],['N4','N4_EN'],['N3','N3_EN'],['N2','N2_EN'],['N1','N1_EN']].forEach(([b, e]) => {

        if (en) {

          if (en.p != null) it.p = en.p;   // 結構
          if (en.ex != null) it.ex = en.ex;
          if (en.n != null) it.n = en.n;
          (it.eg || []).forEach((x, k) => { if (en.eg && en.eg[k] != null) x.z = en.eg[k]; });
        }
      } else if (it.__zh) {
        it.t = it.__zh.t; it.p = it.__zh.p; it.ex = it.__zh.ex; it.n = it.__zh.n;
        (it.eg || []).forEach((x, k) => { if (it.__zh.eg[k] != null) x.z = it.__zh.eg[k]; });

  [['VOCAB_N5','VOCAB_N5_EN'],['VOCAB_N4','VOCAB_N4_EN'],['VOCAB_N3','VOCAB_N3_EN'],['VOCAB_N2','VOCAB_N2_EN'],['VOCAB_N1','VOCAB_N1_EN']].forEach(([b, e]) => {
    const arr = window[b]; const em = EN[e]; if (!Array.isArray(arr) || !Array.isArray(em) || arr.length !== em.length) return;

    });

const FS_LEVELS = ['normal', 'large', 'xlarge'];
const FS_LABEL = { normal: 'A', large: 'A+', xlarge: 'A++' };
const FS_NAME = { normal: '標準', large: '大', xlarge: '特大' };
function applyFontSize() {
  let fs = 'normal';
  try { fs = localStorage.getItem('fontSize') || 'normal'; } catch (e) {}
  if (FS_LEVELS.indexOf(fs) < 0) fs = 'normal';
  document.documentElement.setAttribute('data-fs', fs);
  const lbl = document.getElementById('fsBtnLabel');
  if (lbl) lbl.textContent = FS_LABEL[fs];
}
function cycleFontSize() {
  let fs = 'normal';
  try { fs = localStorage.getItem('fontSize') || 'normal'; } catch (e) {}
  const next = FS_LEVELS[(FS_LEVELS.indexOf(fs) + 1) % FS_LEVELS.length] || 'normal';
  try { localStorage.setItem('fontSize', next); } catch (e) {}
  applyFontSize();
  if (typeof showToast === 'function') showToast('文字大小:' + FS_NAME[next]);
  // 字級是純 CSS,文字會就地重排;不整頁 doRender(那會閃一下、還把展開的分類收合掉)。
  // 只有單字全列表用虛擬列表(絕對定位),卡片變高需重新量測位置 → 呼叫 remeasure(只重排列表)。
  if (typeof VirtualList !== 'undefined' && VirtualList.isActive && VirtualList.isActive()) {
    VirtualList.remeasure();
  }
}
// 原生 App 主題橋(index.html 沒載 auth-header.js,故內嵌):切色 → 回報 data-theme + --bg 色碼,
// 原生照著漆安全區(瀏海/底部)。一般瀏覽器無 STAYJP_NATIVE → 跳過。
(function () {
  function reportTheme() {
    try {
      if (!(window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp)) return;
      if (!(window.ReactNativeWebView && window.ReactNativeWebView.postMessage)) return;
      var theme = document.documentElement.getAttribute('data-theme') || 'light';
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'THEME', payload: { theme: theme, bg: bg } }));
    } catch (_) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reportTheme);
  else reportTheme();
  try {
    new MutationObserver(reportTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (_) {}
})();
function updateThemeIcon() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = isDark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
}

applyI18n();
// 語言就緒旗標:zh-TW 立即可渲染;en/zh-CN 等英文疊層 / OpenCC 就緒(見下方 ready 區塊)。
// fallback:萬一準備失敗,3 秒後強制放行,內容一定會出來(不會空白卡死)。
window._langReady = (typeof I18n === 'undefined') || (I18n.getLang() !== 'en' && I18n.getLang() !== 'zh-CN');
setTimeout(function () { if (!window._langReady) { window._langReady = true; if (typeof doRender === 'function') doRender(); } }, 3000);

// 一次性清理：舊版 cloud merge bug 造成 word_notebook 同 (w, lv) 累積重複
// 修 key: JSON.stringify(entry) → (w, lv)，並同步回 cloud
(function dedupeNotebook() {
  try {
    const raw = localStorage.getItem('word_notebook');
    if (!raw) return;
    const nb = JSON.parse(raw);
    if (!Array.isArray(nb) || nb.length === 0) return;
    const byKey = new Map();
    nb.forEach(x => {
      if (!x || !x.w) return;
      const key = x.w + '\u0000' + (x.lv || '');
      const prev = byKey.get(key);
      if (!prev || (x.added && prev.added && x.added < prev.added)) byKey.set(key, x);
    });
    const deduped = [...byKey.values()];
    if (deduped.length !== nb.length) {
      localStorage.setItem('word_notebook', JSON.stringify(deduped));
      if (typeof saveAllCloud === 'function') saveAllCloud();
    }
  } catch(e) {}
})();

// Init — 多數初始化不直接吃 vocab/grammar 資料（render 時才查 window globals），先跑
loadFavorites();

if(location.hash){const el=document.querySelector(location.hash);if(el&&el.classList.contains('gc')){el.classList.add('o');setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),100)}}

// 等內容資料就位（重訪通常立刻 resolve，首訪等 Firestore fetch）→ 餵 Listening/Reading items + 跑需要 vocab data 的遷移 + 重 render
(typeof ContentLoader !== 'undefined' ? ContentLoader.ready() : Promise.resolve()).then(async () => {
  // lang=en:內容就位後先疊英文,再重繪讓文法/單字卡呈現英文(例句/解說)
  if (I18n.getLang() === 'en') { try { await applyContentLang(); } catch (_) {} window._langReady = true; if (typeof doRender === 'function') doRender(); }
  // lang=en:把 reading/listening 題目(q/options/解說)就地換成英文(日文文章/音檔腳本不動);由 reading-listening-en.js 提供
  if (I18n.getLang() === 'en' && window.RL_EN) {
    try {
      (window.READING_PASSAGES || []).forEach(function (p) {
        var e = window.RL_EN.reading[p.id];
        if (e && p.questions) p.questions.forEach(function (q, i) { if (e[i]) { q.q = e[i].q_en; q.options = e[i].options_en; if (e[i].explanation_en) q.explanation = e[i].explanation_en; } });
      });
      (window.LISTENING_ITEMS || []).forEach(function (x) {
        var e = window.RL_EN.listening[x.id];
        if (e) { x.q = e.q_en; x.options = e.options_en; }
      });
    } catch (_) {}
  }
  if (typeof Listening !== 'undefined' && Listening.setItems) Listening.setItems(window.LISTENING_ITEMS || []);
  if (typeof Reading !== 'undefined' && Reading.setPassages) Reading.setPassages((window.READING_PASSAGES || []).concat(window.READING_EXTRA || []));

  // 一次性遷移：把舊版 favorites.v{lv} 的單字 ★ 收藏併入 word_notebook（單字池統一）
  if (!localStorage.getItem('migrated_vocab_fav_v1')) {
    let nb; try { nb = JSON.parse(localStorage.getItem('word_notebook')) || []; } catch(e) { nb = []; }
    let changed = false;
    ['n5','n4','n3','n2','n1'].forEach(lv => {
      const arr = (favorites && favorites['v'+lv]) || [];
      if (!arr.length) return;
      const data = getVocabData(lv);
      arr.forEach(w => {
        if (nb.find(x => x.w === w && x.lv === lv)) return;
        const entry = data.find(d => d.w === w);
        nb.push({ w, r: entry?.r || w, m: entry?.m || '', lv, added: new Date().toISOString() });
        changed = true;
      });
      favorites['v'+lv] = [];
    });
    if (changed) {
      localStorage.setItem('word_notebook', JSON.stringify(nb));
      saveFavLocal();
      if (typeof saveAllCloud === 'function') saveAllCloud();
    }
    localStorage.setItem('migrated_vocab_fav_v1', '1');
  }

  // 重 render（首訪原本第一次 render 拿到空資料）
  if (typeof doRender === 'function') doRender();
}).catch(e => console.warn('[content-loader] ready failed:', e));
setTimeout(()=>{ if(typeof SRS!=='undefined') SRS.updateReviewCount(); }, 100);

function openMoreMenu() {
  var m = document.getElementById('moreMenu');
  if (m.classList.contains('open')) { closeMore(); return; }
  cvtStaticUI('moreMenu');   // 簡中模式:把選單裡寫死(無 data-i18n)的繁體字轉簡,避免繁簡混雜
  document.getElementById('moreBackdrop').classList.add('show');
  m.classList.add('open');
}
function closeMore() {
  document.getElementById('moreMenu').classList.remove('open');
  document.getElementById('moreBackdrop').classList.remove('show');
}
function switchBottomTab(btn) {
  document.querySelectorAll('.ftb-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
// 學習 tab 的 doRender() 是重量級操作（重建整頁文法/單字 + 側欄 + 行事曆）。
// 同步跑會卡住點擊那一幀、看起來像「頁面凍結」。改為先讓 tab 高亮 paint，
// 下一個 macrotask 再跑渲染 → 點擊立即有反應、主執行緒不被阻塞。
function deferRender() {
  requestAnimationFrame(() => setTimeout(doRender, 0));
}
// 文法備註折疊：N5 初學者預設收起進階說明，點擊才展開，避免資訊過載
function toggleNote(btn) {
  var note = btn.nextElementSibling;
  var nowHidden = note.classList.toggle('nt-hidden');
  btn.textContent = nowHidden ? '展開說明 ▾' : '收合說明 ▴';
}
// 文法詳解:只對日文例句(.gd-jp)上 furigana + 即點即查,中文解說不動(避免給中文字亂加日文讀音)
function grammarDetailHTML(html) {
  if (!html) return '';
  if (!window.furiganaHTML) return html;
  return html.replace(/(<span class='gd-jp'>)([\s\S]*?)(<\/span>)/g, function (_m, o, inner, c) {
    return o + window.furiganaHTML(inner) + c;
  });
}
function toggleDetail(btn) {
  var body = btn.nextElementSibling;
  var nowHidden = body.classList.toggle('gd-hidden');
  var en = (typeof I18n !== 'undefined' && I18n.lang && I18n.lang() === 'en');
  btn.textContent = (nowHidden ? '' + (en ? 'Deep dive' : '詳解') + ' ▾' : '' + (en ? 'Hide' : '收合詳解') + ' ▴');
}
