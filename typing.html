<style>

<script>
// 日文打字練習(2026-10-31,Mia 拍板:參考 Threads 上日文打字練習文的反應)。
// 單字檔按級延遲載入;題目來自各級 VOCAB 的 w/r 與例句 ex.j/ex.z。
// 兩種練法:看著打(題目在眼前,練速度)/ 聽寫(藏題目,聽發音+看中文自己打)。
// 照做題規則:打完 → 送出 → 詳解 → 自己按下一題(Enter 也可以),不自動跳。
// 付費牆同 wordguess.html:免費每日 1 輪(10 題),Premium/試用/白名單無限。
function enOr(zh,en){ try{ return I18n.isForeign()?I18n.pick(zh,en):zh; }catch(e){ return zh; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ls(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function today(){ return (window.DayKey&&DayKey.today)?DayKey.today():new Date().toISOString().slice(0,10); }
function hydrate(){ try{ if(window.Icons&&Icons.hydrate) Icons.hydrate(); }catch(e){} }
const ic = n => (window.icon ? window.icon(n) : '');
const N = 10;

// ── Premium 判斷(同 wordguess.html)──
const TP_ADMIN = ['stayjpplan@gmail.com','abc83327@gmail.com'];
let tpPremium=false, tpAdmin=false, tpTrialStart=null, tpPending=true;
setTimeout(()=>{ tpPending=false; },6000);
(function initAuth(){
  try{
    const cfg = { apiKey:"AIzaSyDnmg2XOuvwgE8m8xCF5sS4o0nQYoUplPI", authDomain:"jpnote-1bdd6.firebaseapp.com", projectId:"jpnote-1bdd6" };
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(u=>{
      tpAdmin = !!(u && TP_ADMIN.includes((u.email||'').toLowerCase()));
      if(!u){ tpPremium=false; tpPending=false; renderHome(); return; }
      tpPending=true; setTimeout(()=>{ tpPending=false; },6000);
      try{ if(localStorage.getItem('jd_prem_'+u.uid)==='1') tpPremium=true; }catch(e){}
      let _wl=null, _sub=null;
      const _sync=()=>{
        if(_wl!==null && _sub!==null){ tpPremium = _wl || _sub || tpAdmin; tpPending=false; }
        else if(_wl===true || _sub===true) tpPremium=true;
        try{ if(_wl!==null&&_sub!==null) localStorage.setItem('jd_prem_'+u.uid, tpPremium?'1':'0'); }catch(e){}
        renderHome();
      };
      firebase.firestore().doc('free_users/'+u.uid).get().then(s=>{ _wl=s.exists; _sync(); }).catch(()=>{});
      firebase.firestore().doc('users/'+u.uid).get().then(s=>{
        const d=s.data()||{}, sub=d.subscription;
        _sub=!!(sub && (sub.status==='active'||sub.status==='trialing'||sub.status==='cancelled') && (sub.expiresAt||0)>Date.now());
        const ts=d.trial_started_at;
        if(ts && typeof ts.toMillis==='function') tpTrialStart=ts.toMillis(); else if(ts && ts.seconds) tpTrialStart=ts.seconds*1000;
        _sync();
      }).catch(()=>{});
    });
  }catch(e){}
})();
const isNative = () => !!(window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp);
function tpUnlimited(){
  if(tpPremium || tpAdmin || tpPending) return true;
  if(!isNative() && tpTrialStart!=null && Date.now() < tpTrialStart + 3*86400000) return true;
  if(isNative() && window.STAYJP_NATIVE.isPremium) return true;
  return false;
}
const usedToday = () => parseInt(ls('tp_day_'+today(), 0), 10) || 0;
function gateRound(){
  if(tpUnlimited()) return false;
  if(usedToday()>=1){ showGate(); return true; }
  lsSet('tp_day_'+today(), usedToday()+1);
  return false;
}
function goPlans(){
  try{ if(isNative() && window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify({ type:'OPEN_PAYWALL', lang:(localStorage.getItem('ui_lang')||'zh-TW') })); return; } }catch(e){}
  location.href='pricing.html';
}
function showGate(){
  const el=document.createElement('div'); el.id='gateCard';
  el.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900" data-x></div>'+
    '<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:901;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:340px;width:88%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)">'+
    '<div style="font-size:30px;color:var(--ac);margin-bottom:8px"><i data-ic=lock></i></div>'+
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px">'+enOr('今天的免費一輪(10 題)練完了',"You've done today's free round (10 items)")+'</div>'+
    '<div style="font-size:13.5px;color:var(--tx2);line-height:1.7;margin-bottom:16px">'+enOr('明天會再送一輪。升級 Premium 就能無限練。','A new free round tomorrow. Premium unlocks unlimited rounds.')+'</div>'+
    '<button class="btn pri wide" id="gGo">'+enOr('看訂閱方案 →','See plans →')+'</button>'+
    '<button class="btn wide" data-x>'+enOr('先不用','Not now')+'</button></div>';
  document.body.appendChild(el);
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>el.remove());
  el.querySelector('#gGo').onclick=()=>{ el.remove(); goPlans(); };
  hydrate();
}

// ── 題庫(單字檔按級延遲載入;例句讀音表 ex-furigana.js 第一次用到才載)──
const LEVELS = ['n5','n4','n3','n2','n1'];
const VOC = {}; const _lvP = {}; let _furiP = null;
function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); }); }
function loadLevel(l){
  if(VOC[l]) return Promise.resolve();
  if(_lvP[l]) return _lvP[l];
  _lvP[l] = loadScript('vocab-'+l+'.js').then(()=>{ VOC[l] = window['VOCAB_'+l.toUpperCase()] || []; }).catch(e=>{ _lvP[l]=null; throw e; });
  return _lvP[l];
}
function loadFuri(){ if(window.EX_FURI) return Promise.resolve(); if(_furiP) return _furiP; _furiP = loadScript('ex-furigana.js').catch(()=>{ _furiP=null; }); return _furiP; }
const hasKanji = s => /[一-鿿々]/.test(s||'');
// 題目池:單字 = 每個字一題;例句 = 有例句的字一題(同一句只出一次)
function pool(lv, kind){
  const seen=new Set(); const out=[];
  (VOC[lv]||[]).forEach((v,i)=>{
    if(!v||!v.w) return;
    if(kind==='word'){ const k=v.w+'|'+v.r; if(seen.has(k)) return; seen.add(k); out.push({ i, v, t:v.w, r:v.r||'', zh:v.m||'' }); }
    else { const j=v.ex&&v.ex.j; if(!j||seen.has(j)) return; seen.add(j); out.push({ i, v, t:j, r:'', zh:(v.ex.z||'') }); }
  });
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ── 比對:全半形統一、去空白與標點;單字另接受直接打假名讀音 ──
const PUNCT = /[\s　。、．，!！?？「」『』（）()・…～〜~\-－—:：;；"'“”]/g;
function norm(s){ let t=String(s||''); try{ t=t.normalize('NFKC'); }catch(e){} return t.replace(PUNCT,''); }
function isRight(q, typed){
  const a = norm(typed); if(!a) return false;
  if(a===norm(q.t)) return true;
  if(q.r && a===norm(q.r)) return true;   // 單字:直接打讀音也算對(片假名字 w==r)
  return false;
}
// 逐字標色:對的綠、錯的紅、沒打到的灰底線(以目標的「可比對字元」為準)
function cmpChars(s){ return norm(s).split(''); }
// 單字題:打的是純假名就拿讀音當對照(不然 僕 vs ぼく 每個字都紅)
function refOf(q, typed){ return (q.kind==='word' && q.r && !hasKanji(typed)) ? q.r : q.t; }
function diffHtml(target, typed, asYours){
  const T=cmpChars(target), Y=cmpChars(typed); let out='';
  if(asYours){
    Y.forEach((c,i)=>{ out+='<span class="c '+(c===T[i]?'ok':'ng')+'">'+esc(c)+'</span>'; });
    if(T.length>Y.length) out+='<span class="c miss">'+esc(T.slice(Y.length).join(''))+'</span>';
  } else {
    T.forEach((c,i)=>{ const cls = i<Y.length ? (Y[i]===c?'ok':'ng') : (i===Y.length?'cur':''); out+='<span class="c '+cls+'">'+esc(c)+'</span>'; });
  }
  return out;
}
// 假名標注:例句用 ex-furigana 表(djb2 與 scripts/gen-ex-furigana.mjs 同),再補單字本身的讀音;單字直接用 r
function exHash(t){ let h=5381; for(let q=0;q<t.length;q++){ const cp=t.codePointAt(q); if(cp>0xffff) q++; h=((Math.imul(h,33)^cp)>>>0); } return ('0000000'+h.toString(16)).slice(-8); }
// 漢字段 → 讀音字典:由已載入的各級單字建(跟 app.html 一樣「字典有的詞優先、ex-furigana 表補留白」)。
// 食べる/たべる → 食:た;お金/おかね → 金:かね。同一段多個讀音取先遇到的(只是提示用)。
const KJ = /[\u4e00-\u9fff々]/; let _kd=null, _kdN=0;
function kanjiDict(){
  const n=Object.keys(VOC).length; if(_kd && _kdN===n) return _kd;
  const d={}; const put=(k,v)=>{ if(k && v && !d[k]) d[k]=v; };
  LEVELS.forEach(l=>(VOC[l]||[]).forEach(v=>{
    const w=String(v.w||''), r=String(v.r||''); if(!hasKanji(w)||!r) return;
    const m=w.match(/^([^\u4e00-\u9fff々]*)(.*[\u4e00-\u9fff々])(.*)$/); if(!m) return;
    const pre=m[1], kp=m[2], tail=m[3];
    if(tail && !r.endsWith(tail)) return;
    if(pre && !r.startsWith(pre)) return;
    const stem=r.slice(pre.length, r.length-tail.length); if(!stem) return;
    if(!/[^\u4e00-\u9fff々]/.test(kp)) put(kp, stem);   // 段裡只有漢字才收(避免「お金」整段當 key)
  }));
  _kd=d; _kdN=n; return d;
}
function runRuby(run){   // 整段查字典;查不到就試拆成兩段都查得到
  const d=kanjiDict(); if(d[run]) return '<ruby>'+esc(run)+'<rt>'+esc(d[run])+'</rt></ruby>';
  for(let k=1;k<run.length;k++){ const a=run.slice(0,k), b=run.slice(k); if(d[a]&&d[b]) return '<ruby>'+esc(a)+'<rt>'+esc(d[a])+'</rt></ruby><ruby>'+esc(b)+'<rt>'+esc(d[b])+'</rt></ruby>'; }
  return esc(run);
}
function rubyHtml(q){
  if(q.kind==='word'){ return (hasKanji(q.t)&&q.r&&q.r!==q.t) ? '<ruby>'+esc(q.t)+'<rt>'+esc(q.r)+'</rt></ruby>' : esc(q.t); }
  const t=q.t; const pairs=(window.EX_FURI&&window.EX_FURI[exHash(t)]||[]).slice();
  let out='', i=0;
  while(i<t.length){
    if(!KJ.test(t[i])){ out+=esc(t[i]); i++; continue; }
    if(pairs.length && t.substr(i,pairs[0][0].length)===pairs[0][0]){ const p=pairs.shift(); out+='<ruby>'+esc(p[0])+'<rt>'+esc(p[1])+'</rt></ruby>'; i+=p[0].length; continue; }
    let j=i; while(j<t.length && KJ.test(t[j])) j++;
    // 段落可能是「表裡的裸段」接在字典詞後面(例:学生＋表裡的段);逐段先試字典,剩下的再交給表
    const run=t.slice(i,j);
    const nextPair = pairs.length ? t.indexOf(pairs[0][0], i) : -1;
    if(nextPair>i && nextPair<j){ out+=runRuby(t.slice(i,nextPair)); i=nextPair; continue; }
    out+=runRuby(run); i=j;
  }
  return out;
}

// ── 發音(預生 mp3,manifest 1.2MB 第一次用到才載;App 內交給原生播)──
let _ttsP=null, _au=null;
function ensureTTS(){ if(window.__TTS) return Promise.resolve(); if(_ttsP) return _ttsP;
  _ttsP=new Promise(res=>{ const s=document.createElement('script'); s.src='audio/tts/manifest.js'; s.onload=()=>res(); s.onerror=()=>{ _ttsP=null; res(); }; document.head.appendChild(s); }); return _ttsP; }
function say(text){
  ensureTTS().then(()=>{
    const h=window.__TTS&&window.__TTS[text]; if(!h) return;
    const rel=window.ttsUrl?window.ttsUrl(h):'audio/tts/'+h+'.mp3';
    try{ if(window.STAYJP_NATIVE&&window.STAYJP_NATIVE.canPlayB64&&window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify({type:'PLAY_URL',url:new URL(rel,location.href).href})); return; } }catch(e){}
    try{ if(_au) _au.pause(); _au=new Audio(rel); _au.play().catch(()=>{}); }catch(e){}
  });
}
function sayQ(q){ say(q.kind==='word' ? (window.wordSpeakKey ? wordSpeakKey(q.v) : (q.v.r||q.v.w)) : q.t); }
window.addEventListener('load',()=>setTimeout(ensureTTS,1500));

// ── 設定與紀錄 ──
const $ = id => document.getElementById(id);
const S = Object.assign({ lv:'n5', kind:'word', mode:'copy', order:'seq' }, ls('tp_cfg',{}));
const POS = ls('tp_pos',{});           // {lv|kind: 下一題 index}(依序出題記到哪)
const STATS = Object.assign({ rounds:0, items:0, right:0, bestCpm:0, hist:[] }, ls('tp_stats',{}));
function saveCfg(){ lsSet('tp_cfg',S); }
function posKey(){ return S.lv+'|'+S.kind; }
function show(id){ ['vHome','vQuiz','vEnd'].forEach(v=>$(v).classList.toggle('hidden', v!==id)); window.scrollTo(0,0); }
function seg(id, key, cb){ $(id).querySelectorAll('button').forEach(b=>{ b.classList.toggle('on', b.dataset.v===S[key]); b.onclick=()=>{ S[key]=b.dataset.v; saveCfg(); seg(id,key); if(cb) cb(); }; }); }
function cpmOf(chars, ms){ return ms>0 ? Math.round(chars/(ms/60000)) : 0; }
function renderHome(){
  seg('segLv','lv',renderHome); seg('segKind','kind',renderHome); seg('segMode','mode');
  $('chipOrder').innerHTML = (S.order==='seq' ? ic('refresh')+enOr('依課程順序','Course order') : ic('sparkle')+enOr('隨機出題','Random'));
  $('chipOrder').classList.toggle('on', S.order==='seq');
  $('chipOrder').onclick=()=>{ S.order = S.order==='seq'?'rand':'seq'; saveCfg(); renderHome(); };
  const p = POS[posKey()]||0;
  $('posNote').textContent = (S.order==='seq' && p>0) ? enOr('接著從第 '+(p+1)+' 題','Continue from #'+(p+1)) : '';
  $('btnStart').textContent = enOr('開始練習(10 題)','Start · 10 items');
  $('freeNote').textContent = tpUnlimited() ? '' : (usedToday()>=1 ? enOr('今天的免費一輪用完了,明天再來;Premium 無限練','Free round used today; Premium is unlimited') : enOr('免費每天 1 輪(10 題),Premium 無限','Free: one round a day · Premium: unlimited'));
  const acc = STATS.items ? Math.round(STATS.right/STATS.items*100) : 0;
  $('kpiHome').innerHTML = '<div><b>'+STATS.rounds+'</b><span>'+enOr('練過幾輪','Rounds')+'</span></div><div><b>'+acc+'%</b><span>'+enOr('正確率','Accuracy')+'</span></div><div><b>'+(STATS.bestCpm||0)+'</b><span>'+enOr('最快 字/分','Best CPM')+'</span></div>';
  $('histHome').innerHTML = (STATS.hist||[]).slice(-5).reverse().map(h=>'<div><span>'+esc(h.d.slice(5))+' · '+h.lv.toUpperCase()+' '+esc(h.kind==='word'?enOr('單字','Words'):enOr('例句','Sentences'))+(h.mode==='dict'?' · '+enOr('聽寫','Dictation'):'')+'</span><span>'+h.ok+'/'+h.n+' · '+h.cpm+' '+enOr('字/分','cpm')+'</span></div>').join('');
  $('statCard').classList.toggle('hidden', !STATS.rounds);
  hydrate();
}

// ── 一輪 ──
let round=[], qi=0, wrongs=[], okN=0, okChars=0, typeMs=0, tStart=0, tTimer=null, answered=false, composing=false, kanaOn=false, peeked=false;
function pickRound(){
  let P = pool(S.lv, S.kind); if(!P.length) return [];
  if(S.order==='rand') return shuffle(P).slice(0,N);
  const start = (POS[posKey()]||0) % P.length;
  const out = []; for(let k=0;k<N && k<P.length;k++) out.push(P[(start+k)%P.length]);
  return out;
}
function startRound(btn, items){
  if(!items && gateRound()) return;
  const b=btn||$('btnStart'); const old=b.textContent; b.disabled=true; b.textContent=enOr('載入題庫…','Loading…');
  Promise.all([loadLevel(S.lv), S.kind==='sent'?loadFuri():Promise.resolve()]).then(()=>{
    b.disabled=false; b.textContent=old;
    round = items || pickRound();
    if(!round.length){ alertBox(enOr('這一級還沒有題目','No items at this level yet')); return; }
    round.forEach(q=>{ q.kind=S.kind; });
    qi=0; wrongs=[]; okN=0; okChars=0; typeMs=0; kanaOn=false;
    try{ gtag('event','typing_start',{ level:S.lv, kind:S.kind, mode:S.mode }); }catch(e){}
    show('vQuiz'); renderQ();
  }).catch(()=>{ b.disabled=false; b.textContent=old; alertBox(enOr('題庫載入失敗,請確認網路再試','Could not load the word list. Check your connection and try again.')); });
}
function alertBox(msg){
  const el=document.createElement('div');
  el.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900" data-x></div><div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:901;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:320px;width:88%;text-align:center"><div style="font-size:15px;line-height:1.7;margin-bottom:14px">'+esc(msg)+'</div><button class="btn pri wide" data-x>OK</button></div>';
  document.body.appendChild(el); el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>el.remove());
}
function q(){ return round[qi]; }
function renderQ(){
  const cur=q(); answered=false; peeked=false; tStart=0; stopTimer(); $('liveTime').textContent='0.0 s'; $('liveCpm').textContent='';
  $('qPos').textContent = (qi+1)+' / '+round.length;
  $('qBar').style.width = Math.round(qi/round.length*100)+'%';
  $('btnQuit').textContent = enOr('結束','Quit');
  $('qTag').textContent = S.lv.toUpperCase()+' · '+(cur.kind==='word'?enOr('單字','Word'):enOr('例句','Sentence'))+' · '+(S.mode==='dict'?enOr('聽寫','Dictation'):enOr('看著打','Copy'));
  $('qZh').textContent = cur.zh;
  $('btnPlay').innerHTML = ic('volume')+enOr('播放','Play');
  $('btnPlay').onclick=()=>sayQ(cur);
  $('btnKana').innerHTML = ic('eye')+enOr('假名','Kana');
  $('btnKana').classList.toggle('hidden', S.mode==='dict' || (cur.kind==='word' && !hasKanji(cur.t)));
  $('btnKana').onclick=()=>{ kanaOn=!kanaOn; $('btnKana').classList.toggle('on',kanaOn); paintTarget(); };
  $('btnPeek').innerHTML = ic('eye')+enOr('偷看一下','Peek');
  $('btnPeek').classList.toggle('hidden', S.mode!=='dict');
  $('btnPeek').onclick=()=>{ peeked=true; $('btnPeek').classList.add('on'); paintTarget(); };
  $('qResult').innerHTML='';
  $('btnSubmit').textContent = enOr('送出','Submit'); $('btnSubmit').onclick=submit; $('btnSubmit').disabled=false;
  const inp=$('inp'); inp.value=''; inp.disabled=false; inp.placeholder = S.mode==='dict' ? enOr('聽完用日文打出來','Type what you hear') : enOr('照著打','Type it');
  paintTarget();
  if(S.mode==='dict') setTimeout(()=>sayQ(cur), 200);
  setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 50);
}
function paintTarget(){
  const cur=q(); const el=$('qJp');
  if(S.mode==='dict' && !peeked && !answered){ el.className='jp hid'; el.textContent=cur.t; return; }
  el.className='jp';
  if(kanaOn || (S.mode==='dict' && peeked)) el.innerHTML = rubyHtml(cur);
  else el.innerHTML = answered ? rubyHtml(cur) : diffHtml(refOf(cur, $('inp').value), $('inp').value, false);
}
function startTimer(){ if(tStart) return; tStart=Date.now(); tTimer=setInterval(()=>{ const ms=Date.now()-tStart; $('liveTime').textContent=(ms/1000).toFixed(1)+' s'; const n=cmpChars($('inp').value).length; $('liveCpm').textContent = n>1 ? cpmOf(n,ms)+' '+enOr('字/分','cpm') : ''; },200); }
function stopTimer(){ if(tTimer){ clearInterval(tTimer); tTimer=null; } }
$('inp').addEventListener('compositionstart',()=>{ composing=true; startTimer(); });
$('inp').addEventListener('compositionend',()=>{ composing=false; if(!answered) paintTarget(); });
$('inp').addEventListener('input',()=>{ if(answered) return; startTimer(); if(!composing) paintTarget(); });
$('inp').addEventListener('keydown',e=>{
  if(e.key!=='Enter' || e.isComposing || composing || e.keyCode===229) return;
  e.preventDefault(); if(answered) next(); else submit();
});
function submit(){
  if(answered) return;
  const cur=q(), typed=$('inp').value; if(!norm(typed)) { try{ $('inp').focus(); }catch(e){} return; }
  answered=true; stopTimer();
  const ms = tStart ? Date.now()-tStart : 0; typeMs+=ms;
  const ok = isRight(cur, typed);
  if(ok){ okN++; okChars+=cmpChars(cur.t).length; } else wrongs.push({ q:cur, typed });
  $('inp').disabled=true; paintTarget();
  const v=cur.v;
  $('qResult').innerHTML='<div class="res '+(ok?'ok':'ng')+'">'
    +'<div class="head">'+ic(ok?'check':'x')+(ok?enOr('打對了','Correct'):enOr('有打錯的地方','Not quite'))+(ms?' <span style="font-weight:500;font-size:13px;color:var(--tx3)">· '+(ms/1000).toFixed(1)+' s · '+cpmOf(cmpChars(typed).length,ms)+' '+enOr('字/分','cpm')+'</span>':'')+'</div>'
    +(ok?'':'<div class="yours"><small>'+enOr('你打的','You typed')+'</small>'+diffHtml(refOf(cur,typed),typed,true)+'</div>')
    +'<div class="ans"><span class="w">'+rubyHtml(cur)+'</span>'+(cur.kind==='word'&&cur.r&&cur.r!==cur.t?'<span class="r">'+esc(cur.r)+'</span>':'')
    +'<button class="play" id="rPlay" aria-label="'+esc(enOr('聽發音','Play'))+'">'+ic('volume')+'</button>'
    +'<span class="m">'+esc(cur.kind==='word' ? (v.m||'') : ((v.ex&&v.ex.z)||''))+(cur.kind==='sent'&&v.w?'<br><span style="font-size:12.5px;color:var(--tx3)">'+esc(v.w)+(v.r&&v.r!==v.w?'('+esc(v.r)+')':'')+' '+esc(v.m||'')+'</span>':'')+'</span></div>'
    +'</div>';
  $('rPlay').onclick=()=>sayQ(cur);
  $('btnSubmit').textContent = qi+1<round.length ? enOr('下一題','Next') : enOr('看結果','See results');
  $('btnSubmit').onclick=next;
  hydrate();
  if(ok && S.mode!=='dict') sayQ(cur);
  try{ $('btnSubmit').focus(); }catch(e){}
}
function next(){
  if(!answered) return;
  if(S.order==='seq'){ POS[posKey()] = ((POS[posKey()]||0)+1); lsSet('tp_pos',POS); }
  qi++;
  if(qi>=round.length){ answered=false; finish(); } else renderQ();
}
$('btnQuit').onclick=()=>{ if(qi>0 || answered) finish(); else { show('vHome'); renderHome(); } };
function finish(){
  stopTimer();
  const n = Math.min(round.length, answered ? qi+1 : qi); if(!n){ show('vHome'); renderHome(); return; }
  const cpm = cpmOf(okChars, typeMs), acc = Math.round(okN/n*100);
  STATS.rounds++; STATS.items+=n; STATS.right+=okN; if(cpm>STATS.bestCpm) STATS.bestCpm=cpm;
  STATS.hist=(STATS.hist||[]).concat([{ d:today(), lv:S.lv, kind:S.kind, mode:S.mode, ok:okN, n, cpm }]).slice(-30); lsSet('tp_stats',STATS);
  try{ if(window.StayDaily&&StayDaily.log) StayDaily.log('quiz'); }catch(e){}
  try{ gtag('event','typing_done',{ level:S.lv, kind:S.kind, mode:S.mode, ok:okN, n, cpm }); }catch(e){}
  show('vEnd');
  $('eLbl').textContent = enOr('這一輪打對','Correct this round');
  $('eScore').textContent = okN+' / '+n;
  $('kpiEnd').innerHTML = '<div><b>'+acc+'%</b><span>'+enOr('正確率','Accuracy')+'</span></div><div><b>'+cpm+'</b><span>'+enOr('字/分','CPM')+'</span></div><div><b>'+(typeMs/1000).toFixed(0)+'s</b><span>'+enOr('打字時間','Typing time')+'</span></div>';
  $('eBest').textContent = cpm && cpm>=STATS.bestCpm ? enOr('新紀錄!最快 '+cpm+' 字/分','New record: '+cpm+' cpm') : enOr('最快紀錄 '+(STATS.bestCpm||0)+' 字/分','Best: '+(STATS.bestCpm||0)+' cpm');
  $('eWrongCard').classList.toggle('hidden', !wrongs.length);
  $('eWrongLbl').textContent = enOr('打錯的','Missed');
  $('eWrong').innerHTML = wrongs.map(({q,typed})=>'<li><span class="w">'+esc(q.t)+'</span><span class="m">'+esc(q.zh)+'</span></li>').join('');
  $('btnAgain').textContent = enOr('再來一輪','Another round');
  $('btnRetryWrong').textContent = enOr('重打錯的','Retype the missed ones');
  $('btnRetryWrong').classList.toggle('hidden', !wrongs.length);
  $('btnHome').textContent = enOr('換等級或練法','Change level or mode');
  hydrate();
}
$('btnAgain').onclick=()=>startRound($('btnAgain'));
$('btnRetryWrong').onclick=()=>startRound($('btnRetryWrong'), wrongs.map(w=>w.q));
$('btnHome').onclick=()=>{ show('vHome'); renderHome(); };

function applyStatic(){
  if(I18n.isPacked()){ document.title=I18n.pick('日文打字練習','Japanese Typing Practice')+' | StayJP'; return; }
  if(I18n.getLang()!=='en') return;
  $('tBack').textContent='Back'; $('tTitle').textContent='Japanese Typing Practice'; $('tSub').textContent='Typing a word or sentence sticks better than reading it. Copy mode trains speed, dictation trains recall; every item comes with the meaning, kana and audio.';
  $('tLv').textContent='Level'; $('tKind').textContent='What to type'; $('tMode').textContent='How'; $('tStat').textContent='My record'; $('tFoot').textContent='Study tools';
  const m={ '單字':'Words','一個字一題':'One word per item','例句':'Sentences','整句打完':'Whole sentence','看著打':'Copy','題目在眼前，練速度':'Text shown · speed','聽寫':'Dictation','聽發音＋看中文，自己打':'Audio + meaning · recall' };
  document.querySelectorAll('[data-z]').forEach(e=>{ if(m[e.dataset.z]) e.textContent=m[e.dataset.z]; });
}
applyStatic();
$('btnStart').onclick=()=>startRound($('btnStart'));
renderHome();
</script>
