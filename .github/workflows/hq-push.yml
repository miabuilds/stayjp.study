name: Push StayJP to StayHQ

# 2026-11-09:11/5 停掉每日摘要信時,推總部那步跟著停了(總部 StayJP 資料卡在 11/4)。
# 拆成獨立 workflow,一天兩次,不寄任何信。總部 cron 22:30 UTC 統整,這裡 22:05 先推。
on:
  schedule:
    - cron: '5 22 * * *'   # 台灣 06:05
    - cron: '5 6 * * *'    # 台灣 14:05(白天回饋也會更新)
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install functions deps (firebase-admin)
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund
      - name: Push daily summary to StayHQ
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          HQ_URL: ${{ secrets.HQ_URL }}
          HQ_TOKEN: ${{ secrets.HQ_TOKEN }}
        run: node scripts/hq-push.mjs 14
