<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活日語會話 — 真的會用到的一句話｜StayJP 日本再留計劃</title>
<meta name="description" content="去日本真的用得到的生活會話:便利商店、餐廳點餐、問路、飯店、身體不舒服。每句點一下就發音,自然口語,適合旅遊與初學。">
<style>
  :root{
    --bg:#FFF7EE; --bg2:#FFFFFF; --tx:#3A342E; --tx2:#8A7F72; --tx3:#B8AEA0;
    --ac:#F0662F; --ac2:#FF7A45; --pink:#FF6B9D; --blue:#3AA6E8; --green:#2FBF71; --yellow:#FFC24B;
    --bd:#F0E4D4; --me:#FFE7D6; --you:#EAF4FF; --serif:"Noto Serif TC",serif;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:#1B1713; --bg2:#26201A; --tx:#F2E9DE; --tx2:#B0A392; --tx3:#6E6355;
    --ac:#FF7A45; --ac2:#FF8C5C; --bd:#3A2F25; --me:#3A2A20; --you:#22303A;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;gap:10px;padding:16px 0}
  header .logo{font-family:var(--serif);font-weight:700;font-size:17px}
  header .sp{flex:1}
  header a,.langbtn{color:var(--tx2);text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;font-family:inherit}
  .langbtn{border:1.5px solid var(--ac);border-radius:999px;padding:5px 13px;color:var(--ac);font-weight:600}
  .hero{text-align:center;padding:26px 0 10px}
  .hero .big{font-size:44px;line-height:1}
  h1{font-family:var(--serif);font-size:clamp(26px,6vw,36px);margin:10px 0 8px;text-wrap:balance}
  .hero p{color:var(--tx2);font-size:15px}
  .hint{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--tx2);margin-top:14px}
  .scene{margin:26px 0;background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:16px 16px 20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
  .scene .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .scene .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .scene .ti{font-family:var(--serif);font-weight:700;font-size:19px}
  .scene .ti small{display:block;font-family:-apple-system,sans-serif;font-weight:400;font-size:12px;color:var(--tx2)}
  .row{display:flex;margin:9px 0;gap:8px;align-items:flex-end}
  .row.me{flex-direction:row-reverse}
  .who{font-size:20px;flex-shrink:0;width:30px;text-align:center;line-height:1.9}
  .bubble{max-width:80%;padding:10px 14px;border-radius:18px;position:relative;transition:transform .12s ease}
  .bubble[data-j]{cursor:pointer}
  .bubble:active{transform:scale(.97)}
  .row.you .bubble{background:var(--you);border-bottom-left-radius:6px}
  .row.me .bubble{background:var(--me);border-bottom-right-radius:6px}
  .bubble .jp{font-size:17px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:7px}
  .bubble .jp .spk{width:16px;height:16px;flex-shrink:0;fill:none;stroke:var(--ac);stroke-width:2;opacity:.7}
  .bubble:hover .jp .spk{opacity:1}
  .bubble .rm{font-size:12px;color:var(--tx2);margin-top:2px;font-style:italic}
  .bubble .tr{font-size:13px;color:var(--tx2);margin-top:3px}
  .tip{font-size:12.5px;color:var(--tx2);background:var(--bg);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:10px}
  footer{padding:30px 0;text-align:center;color:var(--tx3);font-size:13px}
  footer a{color:var(--tx2)}
  [data-t]{display:none}
  body[data-lang="zh"] [data-t="zh"]{display:revert}
  body[data-lang="en"] [data-t="en"]{display:revert}
</style>
</head>
<body data-lang="zh">
<div class="wrap">
  <header>
    <span class="logo" data-t="zh">日本再留計劃</span><span class="logo" data-t="en">StayJP</span>
    <span class="sp"></span>
    <a href="about.html" data-t="zh">關於</a><a href="about.html" data-t="en">About</a>
    <button class="langbtn" onclick="toggleLang()"><span data-t="zh">EN</span><span data-t="en">中文</span></button>
  </header>

  <div class="hero">
    <div class="big">🗣️</div>
    <h1><span data-t="zh">去日本,這幾句先學起來</span><span data-t="en">Real phrases you'll actually use in Japan</span></h1>
    <p><span data-t="zh">便利商店、餐廳、問路…真的會用到的自然口語。</span><span data-t="en">Convenience stores, restaurants, directions — natural everyday Japanese.</span></p>
    <div class="hint">👆 <span data-t="zh">點任何一句日文,就會唸給你聽</span><span data-t="en">Tap any Japanese line to hear it</span></div>
  </div>

  <div id="scenes"></div>

  <footer>
    日本再留計劃 (StayJP) ·
    <a href="index.html" data-t="zh">開始學單字文法</a><a href="index.html" data-t="en">Study vocab & grammar</a> ·
    <a href="about.html" data-t="zh">關於</a><a href="about.html" data-t="en">About</a>
  </footer>
</div>

<script src="audio/tts/manifest.js"></script>
<script>
const SCENES = [
  { ic:'🏪', bg:'var(--blue)', zh:'便利商店', en:'Convenience store', lines:[
    { w:'🧑‍💼', side:'you', jp:'いらっしゃいませ。', rm:'Irasshaimase.', zh:'歡迎光臨。', en:'Welcome.' },
    { w:'🧑‍💼', side:'you', jp:'お弁当、温めますか？', rm:'Obentō, atatamemasu ka?', zh:'便當要幫你加熱嗎？', en:'Shall I heat up your bento?' },
    { w:'🙋', side:'me', jp:'はい、お願いします。', rm:'Hai, onegaishimasu.', zh:'好,麻煩你了。', en:'Yes, please.' },
    { w:'🧑‍💼', side:'you', jp:'袋はご利用ですか？', rm:'Fukuro wa go-riyō desu ka?', zh:'需要袋子嗎？', en:'Do you need a bag?' },
    { w:'🙋', side:'me', jp:'大丈夫です。', rm:'Daijōbu desu.', zh:'不用,謝謝。', en:"No, I'm good." },
  ], tipZh:'「大丈夫です」在這裡是婉拒——日本人很少直接說「不要」。', tipEn:'"Daijōbu desu" here means "no thanks" — a soft way to decline.' },

  { ic:'🍜', bg:'var(--ac)', zh:'餐廳點餐', en:'Ordering at a restaurant', lines:[
    { w:'🙋', side:'me', jp:'すみません、注文いいですか？', rm:'Sumimasen, chūmon ii desu ka?', zh:'不好意思,可以點餐了嗎？', en:'Excuse me, can I order?' },
    { w:'🙋', side:'me', jp:'これ、ひとつください。', rm:'Kore, hitotsu kudasai.', zh:'這個給我一份。', en:"I'll have one of these." },
    { w:'🧑‍🍳', side:'you', jp:'お飲み物はいかがですか？', rm:'O-nomimono wa ikaga desu ka?', zh:'要喝點什麼嗎？', en:'Anything to drink?' },
    { w:'🙋', side:'me', jp:'お水で大丈夫です。', rm:'O-mizu de daijōbu desu.', zh:'白開水就好。', en:'Water is fine.' },
    { w:'🙋', side:'me', jp:'お会計お願いします。', rm:'O-kaikei onegaishimasu.', zh:'買單,麻煩你。', en:'Check, please.' },
  ], tipZh:'先說「すみません」叫店員,幾乎萬用。', tipEn:'Start with "Sumimasen" to get staff’s attention — works almost everywhere.' },

  { ic:'🚉', bg:'var(--green)', zh:'問路・車站', en:'Directions & stations', lines:[
    { w:'🙋', side:'me', jp:'すみません、駅はどこですか？', rm:'Sumimasen, eki wa doko desu ka?', zh:'不好意思,車站在哪裡？', en:"Excuse me, where's the station?" },
    { w:'🙋', side:'me', jp:'この電車、渋谷に止まりますか？', rm:'Kono densha, Shibuya ni tomarimasu ka?', zh:'這班車有停澀谷嗎？', en:'Does this train stop at Shibuya?' },
    { w:'🙋', side:'me', jp:'新宿までいくらですか？', rm:'Shinjuku made ikura desu ka?', zh:'到新宿多少錢？', en:'How much to Shinjuku?' },
    { w:'🧑', side:'you', jp:'あそこを右に曲がってください。', rm:'Asoko o migi ni magatte kudasai.', zh:'在那邊右轉。', en:'Turn right over there.' },
  ], tipZh:'聽不懂方向沒關係,加一句「地図で見せてもらえますか？」(可以用地圖指給我看嗎)。', tipEn:'Lost? Try "Chizu de misete moraemasu ka?" — "Can you show me on a map?"' },

  { ic:'🛍️', bg:'var(--pink)', zh:'購物', en:'Shopping', lines:[
    { w:'🙋', side:'me', jp:'これ、試着できますか？', rm:'Kore, shichaku dekimasu ka?', zh:'這個可以試穿嗎？', en:'Can I try this on?' },
    { w:'🙋', side:'me', jp:'他の色はありますか？', rm:'Hoka no iro wa arimasu ka?', zh:'有其他顏色嗎？', en:'Do you have other colors?' },
    { w:'🙋', side:'me', jp:'カードで払えますか？', rm:'Kādo de haraemasu ka?', zh:'可以刷卡嗎？', en:'Can I pay by card?' },
    { w:'🧑‍💼', side:'you', jp:'はい、大丈夫ですよ。', rm:'Hai, daijōbu desu yo.', zh:'可以的,沒問題。', en:'Yes, of course.' },
  ], tipZh:'免稅要護照,問「免税できますか？」(menzei dekimasu ka)。', tipEn:'For tax-free, ask "Menzei dekimasu ka?" and bring your passport.' },

  { ic:'🏨', bg:'var(--blue)', zh:'飯店', en:'At the hotel', lines:[
    { w:'🙋', side:'me', jp:'チェックインお願いします。', rm:'Chekku-in onegaishimasu.', zh:'我要 check-in。', en:'Check-in, please.' },
    { w:'🙋', side:'me', jp:'予約した田中です。', rm:'Yoyaku shita Tanaka desu.', zh:'我是有預約的田中。', en:'I have a reservation under Tanaka.' },
    { w:'🙋', side:'me', jp:'朝ごはんは何時からですか？', rm:'Asagohan wa nanji kara desu ka?', zh:'早餐幾點開始？', en:'What time does breakfast start?' },
    { w:'🙋', side:'me', jp:'荷物を預かってもらえますか？', rm:'Nimotsu o azukatte moraemasu ka?', zh:'可以幫我寄放行李嗎？', en:'Could you hold my luggage?' },
  ] },

  { ic:'🤒', bg:'var(--ac)', zh:'身體不舒服', en:'Feeling unwell', lines:[
    { w:'🙋', side:'me', jp:'ちょっと気分が悪いんです。', rm:'Chotto kibun ga warui n desu.', zh:'我有點不舒服。', en:'I feel a bit unwell.' },
    { w:'🙋', side:'me', jp:'頭が痛いです。', rm:'Atama ga itai desu.', zh:'我頭痛。', en:'I have a headache.' },
    { w:'🙋', side:'me', jp:'近くに薬局はありますか？', rm:'Chikaku ni yakkyoku wa arimasu ka?', zh:'附近有藥局嗎？', en:'Is there a pharmacy nearby?' },
    { w:'🙋', side:'me', jp:'病院に行きたいです。', rm:'Byōin ni ikitai desu.', zh:'我想去醫院。', en:'I want to go to a hospital.' },
  ], tipZh:'緊急時記住:救護車是「119」,警察是「110」。', tipEn:'Emergency: ambulance is 119, police is 110.' },

  { ic:'🙏', bg:'var(--yellow)', zh:'超好用萬用句', en:'Lifesaver phrases', lines:[
    { w:'🙋', side:'me', jp:'もう一度お願いします。', rm:'Mō ichido onegaishimasu.', zh:'請再說一次。', en:'Once more, please.' },
    { w:'🙋', side:'me', jp:'ゆっくり話してもらえますか？', rm:'Yukkuri hanashite moraemasu ka?', zh:'可以說慢一點嗎？', en:'Could you speak slowly?' },
    { w:'🙋', side:'me', jp:'日本語がわかりません。', rm:'Nihongo ga wakarimasen.', zh:'我不懂日文。', en:"I don't understand Japanese." },
    { w:'🙋', side:'me', jp:'英語できますか？', rm:'Eigo dekimasu ka?', zh:'你會說英文嗎？', en:'Do you speak English?' },
  ], tipZh:'這幾句學起來,卡住時都能救場 🙌', tipEn:'Memorize these — they’ll bail you out anytime 🙌' },
];

const esc = s => String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const SPK = '<svg class="spk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>';
function render(){
  document.getElementById('scenes').innerHTML = SCENES.map(s => `
    <div class="scene">
      <div class="head">
        <div class="ic" style="background:${s.bg};color:#fff">${s.ic}</div>
        <div class="ti"><span data-t="zh">${s.zh}</span><span data-t="en">${s.en}</span><small>${esc(s.en)} · ${esc(s.zh)}</small></div>
      </div>
      ${s.lines.map(l => `
        <div class="row ${l.side}">
          <div class="who">${l.w}</div>
          <div class="bubble"${(window.__TTS&&window.__TTS[l.jp])?` data-j="${esc(l.jp)}" onclick="speakLine(this)" title="點我發音 / tap to hear"`:''}>
            <div class="jp">${esc(l.jp)}${(window.__TTS&&window.__TTS[l.jp])?SPK:''}</div>
            <div class="rm">${esc(l.rm)}</div>
            <div class="tr"><span data-t="zh">${esc(l.zh)}</span><span data-t="en">${esc(l.en)}</span></div>
          </div>
        </div>`).join('')}
      ${s.tipZh ? `<div class="tip"><span data-t="zh">💡 ${esc(s.tipZh)}</span><span data-t="en">💡 ${esc(s.tipEn)}</span></div>` : ''}
    </div>`).join('');
}
// 發音:優先 VOICEVOX(__TTS 有的話),否則瀏覽器 TTS。與主站一致。
let _audio = null;
function speakLine(el){
  const t = el.getAttribute('data-j'); if(!t) return;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(_audio){ try{_audio.pause();}catch(e){} _audio=null; }
  const hash = window.__TTS && window.__TTS[t];
  if(hash){ _audio = new Audio('audio/tts/'+hash+'.mp3'); _audio.play().catch(()=>browserSpeak(t)); }
  else browserSpeak(t);
}
function browserSpeak(t){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95;
  const jp = speechSynthesis.getVoices().find(v=>/ja|Japanese/i.test(v.lang));
  if(jp) u.voice = jp;
  speechSynthesis.speak(u);
}
function setLang(l){ document.body.setAttribute('data-lang', l); document.documentElement.lang = l==='en'?'en':'zh-Hant'; try{localStorage.setItem('stayjp_about_lang',l);}catch(e){} }
function toggleLang(){ setLang(document.body.getAttribute('data-lang')==='zh'?'en':'zh'); }
render();
(function(){ try{ var anyA=SCENES.some(function(sc){return sc.lines.some(function(l){return window.__TTS&&window.__TTS[l.jp];});}); var h=document.querySelector(".hint"); if(h&&!anyA) h.style.display="none"; }catch(e){} })();
(function(){ var s; try{s=localStorage.getItem('stayjp_about_lang');}catch(e){} setLang(s || ((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en')); })();
if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
<script src="i18n.js"></script>
<script src="bilingual-sync.js"></script>
</body>
</html>
