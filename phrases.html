<style>
  :root{
    --bg:#FFF7EE; --bg2:#FFFFFF; --tx:#3A342E; --tx2:#8A7F72; --tx3:#B8AEA0;
    --ac:#F0662F; --ac2:#FF7A45; --pink:#FF6B9D; --blue:#3AA6E8; --green:#2FBF71; --yellow:#FFC24B;
    --bd:#F0E4D4; --me:#FFE7D6; --you:#EAF4FF; --serif:"Noto Serif TC",serif;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:#1B1713; --bg2:#26201A; --tx:#F2E9DE; --tx2:#B0A392; --tx3:#6E6355;
    --ac:#FF7A45; --ac2:#FF8C5C; --bd:#3A2F25; --me:#3A2A20; --you:#22303A;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;gap:10px;padding:16px 0}
  header .logo{font-family:var(--serif);font-weight:700;font-size:17px}
  header .sp{flex:1}
  header a,.langbtn{color:var(--tx2);text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;font-family:inherit}
  .langbtn{border:1.5px solid var(--ac);border-radius:999px;padding:5px 13px;color:var(--ac);font-weight:600}
  .hero{text-align:center;padding:26px 0 10px}
  .hero .big{font-size:44px;line-height:1}
  h1{font-family:var(--serif);font-size:clamp(26px,6vw,36px);margin:10px 0 8px;text-wrap:balance}
  .hero p{color:var(--tx2);font-size:15px}
  .hint{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--tx2);margin-top:14px}
  /* 分類 tab:黏在頂部,橫向捲動,點一下只看該類 */
  .cattabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px 18px;margin:0 -18px 4px;background:var(--bg);border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cattabs::-webkit-scrollbar{display:none}
  .cattab{flex-shrink:0;border:1.5px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  .cattab.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .cattab:active{transform:scale(.96)}
  .scene{margin:26px 0;background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:16px 16px 20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
  .scene .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .scene .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .scene .ti{font-family:var(--serif);font-weight:700;font-size:19px}
  .scene .ti small{display:block;font-family:-apple-system,sans-serif;font-weight:400;font-size:12px;color:var(--tx2)}
  .row{display:flex;margin:9px 0;gap:8px;align-items:flex-end}
  .row.me{flex-direction:row-reverse}
  .who{font-size:20px;flex-shrink:0;width:30px;text-align:center;line-height:1.9}
  .bubble{max-width:80%;padding:10px 14px;border-radius:18px;position:relative;transition:transform .12s ease}
  .bubble[data-j]{cursor:pointer}
  .bubble:active{transform:scale(.97)}
  .row.you .bubble{background:var(--you);border-bottom-left-radius:6px}
  .row.me .bubble{background:var(--me);border-bottom-right-radius:6px}
  .bubble .jp{font-size:17px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:7px}
  .bubble .jp .spk{width:16px;height:16px;flex-shrink:0;fill:none;stroke:var(--ac);stroke-width:2;opacity:.7}
  .bubble:hover .jp .spk{opacity:1}
  .bubble .rm{font-size:12px;color:var(--tx2);margin-top:2px;font-style:italic}
  .bubble .tr{font-size:13px;color:var(--tx2);margin-top:3px}
  .tip{font-size:12.5px;color:var(--tx2);background:var(--bg);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:10px}
  footer{padding:30px 0;text-align:center;color:var(--tx3);font-size:13px}
  footer a{color:var(--tx2)}
  [data-t]{display:none}
  body[data-lang="zh"] [data-t="zh"]{display:revert}
  body[data-lang="en"] [data-t="en"]{display:revert}
</style>

const esc = s => String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const SPK = '<svg class="spk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>';
let activeCat = CATS[0].k;
function sceneHtml(s){
  return `
    <div class="scene">
      <div class="head">
        <div class="ic" style="background:${s.bg};color:#fff">${s.ic}</div>
        <div class="ti"><span data-t="zh">${s.zh}</span><span data-t="en">${s.en}</span><small>${esc(s.en)} · ${esc(s.zh)}</small></div>
      </div>
      ${s.lines.map(l => `
        <div class="row ${l.side}">
          <div class="who">${l.w}</div>
          <div class="bubble"${(window.__TTS&&window.__TTS[l.jp])?` data-j="${esc(l.jp)}" onclick="speakLine(this)" title="點我發音 / tap to hear"`:''}>
            <div class="jp">${esc(l.jp)}${(window.__TTS&&window.__TTS[l.jp])?SPK:''}</div>
            <div class="rm">${esc(l.rm)}</div>
            <div class="tr"><span data-t="zh">${esc(l.zh)}</span><span data-t="en">${esc(l.en)}</span></div>
          </div>
        </div>`).join('')}
      ${s.tipZh ? `<div class="tip"><span data-t="zh">💡 ${esc(s.tipZh)}</span><span data-t="en">💡 ${esc(s.tipEn)}</span></div>` : ''}
    </div>`;
}
function renderTabs(){
  document.getElementById('cattabs').innerHTML = CATS.map(c =>
    `<button class="cattab ${c.k===activeCat?'on':''}" onclick="pickCat('${c.k}')"><span data-t="zh">${c.ic} ${c.zh}</span><span data-t="en">${c.ic} ${c.en}</span></button>`
  ).join('');
}
function renderScenes(){
  document.getElementById('scenes').innerHTML = SCENES.filter(s => s.cat === activeCat).map(sceneHtml).join('');
}
function pickCat(k){
  activeCat = k;
  renderTabs();
  renderScenes();
  window.scrollTo({ top: 0, behavior: 'smooth' });   // 切分類回頂端從頭看
}
function render(){ renderTabs(); renderScenes(); }
// 發音:優先 VOICEVOX(__TTS 有的話),否則瀏覽器 TTS。與主站一致。
let _audio = null;
function speakLine(el){
  const t = el.getAttribute('data-j'); if(!t) return;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(_audio){ try{_audio.pause();}catch(e){} _audio=null; }
  const hash = window.__TTS && window.__TTS[t];
  if(hash){ _audio = new Audio(window.ttsUrl ? window.ttsUrl(hash) : 'audio/tts/'+hash+'.mp3'); _audio.play().catch(()=>browserSpeak(t)); }
  else browserSpeak(t);
}
function browserSpeak(t){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95;
  const jp = speechSynthesis.getVoices().find(v=>/ja|Japanese/i.test(v.lang));
  if(jp) u.voice = jp;
  speechSynthesis.speak(u);
}
function setLang(l){ document.body.setAttribute('data-lang', l); document.documentElement.lang = l==='en'?'en':'zh-Hant'; try{localStorage.setItem('stayjp_about_lang',l);}catch(e){} }
function toggleLang(){ setLang(document.body.getAttribute('data-lang')==='zh'?'en':'zh'); }
render();
(function(){ try{ var anyA=SCENES.some(function(sc){return sc.lines.some(function(l){return window.__TTS&&window.__TTS[l.jp];});}); var h=document.querySelector(".hint"); if(h&&!anyA) h.style.display="none"; }catch(e){} })();
(function(){ var s; try{s=localStorage.getItem('stayjp_about_lang');}catch(e){} setLang(s || ((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en')); })();
if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
