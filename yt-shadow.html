<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouTube 跟讀 — 用任何日文影片練口說｜StayJP 日本再留計劃</title>
<meta name="description" content="貼上任何有日文字幕的 YouTube 影片,逐句循環播放、開麥跟讀、即時比對,還能點字查詞。歌、新聞、Vlog 都是你的教材。">
<script>try{var _th=localStorage.getItem('theme');if(_th)document.documentElement.setAttribute('data-theme',_th);}catch(e){}</script>
<style>
:root{--bg:#faf8f4;--bg2:#fff;--bg3:#f4f0e8;--bd:#e8e2d6;--tx:#2d2a26;--tx2:#6f6a61;--tx3:#a39d92;--ac:#c6553b;--soft:rgba(198,85,59,.09);--good:#2E7D57;--goodbg:rgba(46,125,87,.1);--bad:#b3402a}
[data-theme="dark"]{--bg:#191715;--bg2:#221f1c;--bg3:#2a2622;--bd:#3a352f;--tx:#ece7df;--tx2:#a89f92;--tx3:#6f685e;--soft:rgba(198,85,59,.16);--goodbg:rgba(46,125,87,.2)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.btn{border:none;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--bg3);color:var(--tx)}
.btn.pri{background:var(--ac);color:#fff}
.btn:active{transform:scale(.97)}
.note{font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.7}
.err{color:var(--bad);font-size:13px;margin-top:8px}
#playerWrap{display:none;margin-bottom:10px}
#playerBox{position:relative;width:100%!important;height:auto!important;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 4px 18px rgba(0,0,0,.16)}
#playerBox iframe{position:absolute;inset:0;width:100%;height:100%}
/* ── 練習卡(一次一句) ── */
#practice{display:none}
.pc{background:var(--bg2);border:1.5px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.pc-ctr{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:4px}
.pc-ctr button{border:1px solid var(--bd);background:var(--bg3);color:var(--tx);border-radius:12px;min-width:46px;height:42px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.pc-ctr button:active{transform:scale(.94)}
.pc-ctr button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pc-ctr .nav{font-size:20px;line-height:1}
.pc-idx{text-align:center;font-size:12px;color:var(--tx3);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pc-jp{font-size:21px;line-height:2.1;text-align:center;min-height:56px;word-break:break-word;margin-bottom:2px}
.pc-jp rt{font-size:10.5px;color:var(--tx3)}
.pc-jp .hit{color:var(--good);font-weight:700}
.pc-jp.blur{filter:blur(7px);user-select:none;pointer-events:none}
.pc-zh{text-align:center;font-size:13px;color:var(--tx2);margin-bottom:10px;min-height:18px}
.pc-act{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
.micbtn{width:100%;max-width:340px;padding:14px;font-size:16px;border-radius:14px}
.micbtn.rec-on{background:var(--bad)!important;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.saidbox{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:14.5px}
.dictarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;min-height:64px;resize:vertical}
.recnote{font-size:12px;color:var(--tx3);text-align:center;min-height:16px}
/* 結果區 */
.pc-result{display:none;width:100%;border-radius:14px;padding:12px 14px;margin-top:2px}
.pc-result.pass{display:block;background:var(--goodbg);border:1px solid var(--good)}
.pc-result.fail{display:block;background:var(--soft);border:1px solid var(--ac)}
.pc-result .rt1{font-weight:800;font-size:15px}
.pc-result.pass .rt1{color:var(--good)} .pc-result.fail .rt1{color:var(--ac)}
.pc-result .rt2{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.8}
.pc-result .dok{color:var(--good)} .pc-result .dng{color:var(--bad);text-decoration:line-through}
.nextbtn{width:100%;max-width:340px;padding:14px;font-size:16px;border-radius:14px;background:var(--good);color:#fff}
/* KTV 跟播面板:深色襯底,當前句隨播放進度刷色 */
.ktv-wrap{display:none;background:linear-gradient(165deg,#262019,#332a20 60%,#2b2118);border-radius:16px;padding:20px 14px 16px;text-align:center;color:#efe9df;margin:4px 0 8px;position:relative;overflow:hidden}
.ktv-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,rgba(255,176,84,.12),transparent 60%);pointer-events:none}
.ktv-prev,.ktv-next{font-size:13px;color:rgba(255,255,255,.32);min-height:22px;line-height:1.7;cursor:pointer;position:relative}
.ktv-cur{font-size:23px;line-height:1.9;margin:10px 0 6px;font-weight:700;position:relative;word-break:break-word}
.ktv-cur .kt{background-image:linear-gradient(90deg,#ffb054 var(--p,0%),#efe9df var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ktv-cur rt{font-size:10px}
.ktv-zh{font-size:13px;color:rgba(255,255,255,.5);min-height:18px;position:relative}
.modes{display:flex;gap:8px;margin:0 0 12px}
.modes button{flex:1;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:12px;padding:9px;font:inherit;font-weight:700;cursor:pointer}
.modes button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* 這支影片的單字・文法 */
.lp{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.lp summary{font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;list-style:none}
.lp summary::-webkit-details-marker{display:none}
.lp-tabs{display:flex;gap:8px;margin:10px 0}
.lp-tabs button{flex:1;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:10px;padding:7px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lp-tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lp-body{max-height:360px;overflow-y:auto}
.lw{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.lw .lvb{flex-shrink:0;font-size:10px;font-weight:800;color:var(--ac);background:var(--soft);border-radius:5px;padding:2px 6px;margin-top:3px}
.lw .lwx{flex:1;min-width:0}
.lw .lww{font-size:15.5px;font-weight:700}
.lw .lwr{font-size:12px;color:var(--tx3);margin-left:5px;font-weight:400}
.lw .lwm{font-size:12.5px;color:var(--tx2)}
.lw .lwl{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.7}
.lw .lwa{display:flex;gap:5px;flex-shrink:0}
.lw .lwa button{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
.lw .lwa button.saved{color:var(--good);border-color:var(--good)}
.lg{padding:10px 4px;border-bottom:1px solid var(--bd)}
.lg .lgt{font-size:14.5px;font-weight:700}
.lg .lgp{font-size:12px;color:var(--ac);margin-top:2px}
.lg .lgx{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.7}
.lg .lgl{font-size:12px;color:var(--tx3);margin-top:4px;line-height:1.7}
.lp-empty{font-size:12.5px;color:var(--tx3);padding:14px 4px;text-align:center}
/* 影片測驗 */
.qz-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3);margin-bottom:8px}
.qz-bar{height:4px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:14px}
.qz-bar i{display:block;height:100%;background:var(--ac);transition:width .3s ease}
.qz-q{font-size:15px;font-weight:700;text-align:center;margin-bottom:6px}
.qz-sub{font-size:12.5px;color:var(--tx2);text-align:center;margin-bottom:12px}
.qz-blank{font-size:20px;line-height:2;text-align:center;margin:10px 0 14px;word-break:break-word}
.qz-blank .bk{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--ac);color:var(--ac);font-weight:800}
.qz-opts{display:flex;flex-direction:column;gap:9px}
.qz-opt{border:1.5px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;text-align:left;cursor:pointer;line-height:1.7}
.qz-opt:active{transform:scale(.99)}
.qz-opt.ok{border-color:var(--good);background:var(--goodbg);color:var(--good);font-weight:700}
.qz-opt.ng{border-color:var(--bad);background:var(--soft);color:var(--bad);text-decoration:line-through}
.qz-opt:disabled{cursor:default}
.qz-ex{margin-top:12px;background:var(--bg3);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.9}
.qz-ex b{color:var(--ac)}
.qz-ex .exj{font-size:16px;line-height:2.1;margin:2px 0}
.qz-ex .exz{color:var(--tx2);font-size:13px}
.qz-ex rt{font-size:10px;color:var(--tx3)}
.qz-actions{display:flex;gap:8px;margin-top:12px}
.qz-actions .btn{flex:1;padding:12px}
.qz-res{text-align:center;padding:8px 0}
.qz-score{font-size:40px;font-weight:800;color:var(--ac)}
.qz-rv{margin-top:14px;text-align:left}
.qz-rv-item{border-top:1px solid var(--bd);padding:11px 0;font-size:13.5px}
.qz-rv-item .rq{font-weight:700;margin-bottom:3px}
.qz-rv-item .mine{color:var(--bad);font-size:12.5px}
.qz-rv-item .corr{color:var(--good);font-size:12.5px}
/* 句子總覽(跳句用) */
.pc-more{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.pc-more button{border:none;background:none;color:var(--tx3);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline}
#allLines{display:none;margin-top:10px;max-height:300px;overflow-y:auto}
.jl{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13.5px}
.jl:nth-child(odd){background:var(--bg3)}
.jl .t{color:var(--tx3);font-size:11.5px;font-variant-numeric:tabular-nums;flex-shrink:0}
.jl .ok{color:var(--good);font-weight:800;margin-left:auto}
.jl.cur{outline:2px solid var(--ac)}
/* 範例影片牆 */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
@media(min-width:560px){ .gal{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px} }
.gal-c{position:relative;border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--bg);text-align:left}
.gal-c{transition:box-shadow .15s ease,transform .12s ease}
.gal-c:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.gal-c:active{transform:scale(.98)}
.gal-c img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.gal-c .gt{font-size:12.5px;font-weight:700;padding:8px 10px 3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal-c .gtag{display:inline-block;font-size:10.5px;color:var(--ac);background:var(--soft);border-radius:6px;padding:1px 7px;margin:0 10px 9px}
.gal-hd{font-size:13px;font-weight:800;color:var(--tx2);margin:16px 0 0}
.gal-cats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.gal-cats button{border:1px solid var(--bd);background:var(--bg);color:var(--tx2);border-radius:99px;padding:5px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.gal-cats button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.own{margin-top:14px;border-top:1px dashed var(--bd);padding-top:10px}
.own summary{font-size:13px;color:var(--tx2);cursor:pointer;font-weight:700;list-style:none}
.own summary::-webkit-details-marker{display:none}
.backpr{display:none;width:100%;margin-bottom:10px;background:var(--goodbg);color:var(--good);border:1px solid var(--good)}
/* 貼逐字稿 */
.pastebox{display:none;margin-top:12px}
.pastebox textarea{width:100%;padding:10px;border:1.5px dashed var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px;resize:vertical}
.pastebox textarea:focus{border-color:var(--ac);outline:none}
.pb-step{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.pb-n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pb-hint{font-size:12px;color:var(--tx3)}
/* 教學 */
.tut-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;padding:20px;overflow-y:auto}
.tut-mask.show{display:flex;align-items:flex-start;justify-content:center}
.tut-card{background:var(--bg2);border-radius:18px;max-width:480px;width:100%;padding:20px;margin:4vh 0;position:relative}
.tut-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border:none;background:transparent;color:var(--tx2);font-size:17px;cursor:pointer;border-radius:50%}
.tut-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tut-hd img{width:56px;height:auto}
.tut-hd b{font-size:17px}
.tut-step{display:flex;gap:12px;margin-bottom:14px}
.tut-n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.tut-step b{display:block;font-size:14.5px;margin-bottom:2px}
.tut-step p em{font-style:normal;font-weight:700;color:var(--ac)}
.tut-step p{margin:0;font-size:13px;color:var(--tx2);line-height:1.7}
.tut-sub{background:var(--bg3);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:6px}
.tut-sub b{display:inline;font-size:12.5px;color:var(--tx)}
.tut-go{width:100%;margin-top:4px}
.howbtn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:99px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;flex-shrink:0}
@media(min-width:860px){
  .wrap{max-width:1160px}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:18px;align-items:start}
  .colL{position:sticky;top:12px}
  .cols.theater{display:block}
  .cols.theater .colL{position:static;margin-bottom:14px}
}
.thbtn{position:absolute;right:10px;top:10px;z-index:5;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:6px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:none}
#playerWrap:hover .thbtn{display:block}
@media(max-width:859px){ .thbtn{display:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="app.html" class="backbtn" onclick="try{if(history.length>1){history.back();return false}}catch(e){}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg> <span id="bkTx">返回</span></a>
    <b style="font-size:17px" id="hTitle">YouTube 跟讀</b>
    <button class="howbtn" id="howBtn" style="margin-left:auto" onclick="YTS.tut(true)">怎麼用?</button>
  </div>

  <div class="tut-mask" id="tutMask" onclick="if(event.target===this)YTS.tut(false)">
    <div class="tut-card">
      <button class="tut-x" onclick="YTS.tut(false)">✕</button>
      <div class="tut-hd"><img src="images/mascot/tanuki-p08.png" alt=""><b id="tutT">30 秒學會 YouTube 跟讀</b></div>
      <div id="tutBody"></div>
      <button class="btn pri tut-go" id="tutGo" onclick="YTS.tut(false)">開始用</button>
    </div>
  </div>

  <div class="card" id="inputCard">
    <button class="btn backpr" id="backPr" onclick="YTS.backToPractice()">← 回到練習(影片還在)</button>
    <div class="gal-hd" id="galHd" style="margin-top:0">挑一支影片開始練(全部即點即用):</div>
    <div class="gal-cats" id="galCats"></div>
    <div class="gal" id="gal"></div>
    <details class="own" id="ownVid" style="display:none"><!-- 自貼影片先隱藏(用戶:太陽春),流程優化好再放出來 -->
      <summary id="ownSum">用自己的 YouTube 影片練 ▾</summary>
      <div class="urlrow" style="margin-top:10px">
        <input id="urlIn" placeholder="貼上 YouTube 連結或影片 ID" inputmode="url" autocomplete="off">
        <button class="btn pri" id="loadBtn" onclick="YTS.load()">讀取</button>
      </div>
      <div class="note" id="inNote">貼上有日文字幕的影片連結,歌、新聞、Vlog 都行。<br>怎麼確認?在 YouTube 播放器點「字幕 (CC)」→ 語言清單有「<b>日本語</b>」(含自動產生)就能練;只有英文或沒有 CC 的不行。</div>
    </details>
    <div class="err" id="inErr" style="display:none"></div>
    <div class="pastebox" id="pasteBox">
      <div class="pb-step"><span class="pb-n">1</span><button class="btn" onclick="YTS.openTranscript()" id="openTsBtn">在 YouTube 開這支影片 ↗</button><span class="pb-hint" id="pbHint1">點「顯示轉譯稿」→ 全選複製</span></div>
      <div class="note" id="pbNoCap" style="margin:-4px 0 10px 34px">找不到「顯示轉譯稿」?表示這支影片沒有字幕,換一支比較快(範例牆的都能直接練)。</div>
      <div class="pb-step"><span class="pb-n">2</span><div style="flex:1"><textarea id="pasteTa" rows="3" placeholder="複製好貼在這裡,貼上就自動解析"></textarea></div></div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:2px"><button class="btn pri" onclick="YTS.parsePaste()" id="parseBtn" style="display:none">解析</button><a href="javascript:void(0)" style="color:var(--tx3);font-size:12px" onclick="YTS.tut(true)" id="pbHelp">手機怎麼複製?</a></div>
    </div>
  </div>

  <div class="cols">
    <div class="colL"><div id="playerWrap" style="position:relative"><button class="thbtn" id="thBtn" onclick="YTS.theater()">⛶ 劇院模式</button><div id="playerBox"></div></div></div>
    <div class="colR">
      <div id="practice">
        <div class="modes" id="modeRow">
          <button id="mKtv" class="on" onclick="YTS.setMode('ktv')">跟播</button>
          <button id="mShadow" onclick="YTS.setMode('shadow')">跟讀</button>
          <button id="mDict" onclick="YTS.setMode('dict')">聽寫</button>
          <button id="mQuiz" onclick="YTS.setMode('quiz')">測驗</button>
          <button id="mSwap" style="flex:0 0 auto" onclick="YTS.swap()">換影片</button>
        </div>
        <div class="pc">
          <div class="pc-ctr">
            <button class="nav" onclick="YTS.nav(-1)" aria-label="上一句">‹</button>
            <button onclick="YTS.replay()" aria-label="重播"><i data-ic=volume></i></button>
            <button id="spdBtn" onclick="YTS.cycleSpeed()">1x</button>
            <button id="loopBtn" onclick="YTS.toggleLoop()">循環</button>
            <button class="nav" onclick="YTS.nav(1)" aria-label="下一句">›</button>
          </div>
          <div class="pc-idx" id="pcIdx"></div>
          <div class="ktv-wrap" id="ktvBox">

      const head=rows[i].match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?(.*)$/);

  // 剝掉開頭與日文重複的部分,只留真正的中文。
  function dedupeZh(ja,zh){
    ja=(ja||'').trim(); zh=(zh||'').trim();
    if(!zh||!ja) return zh;
    if(zh.startsWith(ja)) return zh.slice(ja.length).replace(/^[\s　:：,，、。.-]+/,'').trim();
    const norm=t=>t.replace(/[\s　、。,．.!！?？「」『』()（）・〜~…–—-]/g,'');

    if(nj && nz.startsWith(nj)){   // 標點不同也算重複:逐字對掉前綴
      let k=0,hit=0;
      while(k<zh.length && hit<nj.length){ if(norm(zh[k])!=='') hit++; k++; }
      return zh.slice(k).replace(/^[\s　:：,，、。.-]+/,'').trim();
    }
    return zh;

  function stripRomaji(t){

    document.getElementById('inErr').style.display='none';

    listOpen=false; document.getElementById('allLines').style.display='none';
    // 從第一個沒完成的句子開始
    cur=0; while(cur<lines.length-1 && done[cur]) cur++;
    renderCard(false);
  }

  // ── 練習卡 ──
  function renderCard(autoplay=true){
    stopRec(); resetAcc(); _settled=false;
    const l=lines[cur]; if(!l) return;
    document.getElementById('pcIdx').textContent=(cur+1)+' / '+lines.length+'　'+fmtT(l.t);
    const isKtv = mode==='ktv';

    } else {

        <textarea class="dictarea" id="dictIn" placeholder="${enOr('聽完把句子打出來','Type what you heard')}"></textarea>

    }
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}

    const n=Object.keys(done).length;
    document.getElementById('progTx').textContent=enOr('已完成 ','Done ')+n+' / '+lines.length;
  }
  function nav(d){
    cur=Math.min(lines.length-1,Math.max(0,cur+d));
    if(mode==='ktv'){ renderKtv(); try{ player.seekTo(lines[cur].t/1000,true); player.playVideo(); }catch(e){} return; }
    renderCard();

    cur=i; listOpen=false; document.getElementById('allLines').style.display='none';
    if(mode==='ktv'){ renderKtv(); try{ player.seekTo(lines[cur].t/1000,true); player.playVideo(); }catch(e){} return; }
    renderCard();
  }

  // ── KTV 跟播:影片連續播,句子隨時間自動跳轉+當前句刷色 ──
  function renderKtv(){
    const l=lines[cur]; if(!l) return;
    document.getElementById('ktvPrev').innerHTML = cur>0 ? esc(lines[cur-1].ja) : '';
    document.getElementById('ktvCur').innerHTML = '<span class="kt" id="ktSpan">'+fr(l.ja)+'</span>';
    document.getElementById('ktvZh').textContent = l.zh||'';
    document.getElementById('ktvNext').innerHTML = cur<lines.length-1 ? esc(lines[cur+1].ja) : '';
    document.getElementById('pcIdx').textContent=(cur+1)+' / '+lines.length+'　'+fmtT(l.t);
    applyZh();
  }
  function startKtv(){
    if(!player) return;
    try{ player.setPlaybackRate(SPEEDS[spdIdx]); player.seekTo(lines[cur].t/1000,true); player.playVideo(); }catch(e){}
    ktvWatch();
  }
  let ktvRaf=0;
  function ktvWatch(){
    if(!player) return;
    clearInterval(watchT);   // 關掉逐句暫停監看
    clearInterval(ktvT); cancelAnimationFrame(ktvRaf);
    ktvT=1;
    const tick=()=>{
      if(!ktvT) return;
      try{
        const ms=player.getCurrentTime()*1000;
        let idx=cur;
        if(ms<lines[cur].t || ms>=lines[cur].t+effD(cur)+4000){ idx=0; }   // 使用者亂拉進度條:重找
        while(idx<lines.length-1 && lines[idx+1].t<=ms) idx++;
        while(idx>0 && lines[idx].t>ms) idx--;
        if(idx!==cur){ cur=idx; renderKtv(); }
        const l=lines[cur];
        const p=Math.max(0,Math.min(100,(ms-l.t)/effD(cur)*100));
        const sp=document.getElementById('ktSpan'); if(sp) sp.style.setProperty('--p',p.toFixed(1)+'%');
      }catch(e){}
      ktvRaf=requestAnimationFrame(tick);
    };
    ktvRaf=requestAnimationFrame(tick);
  }
  function stopKtv(){ ktvT=0; cancelAnimationFrame(ktvRaf); ktvRaf=0; }

  // ── 播放控制 ──
  function playSeg(){
    if(!player||!lines[cur]) return;
    const l=lines[cur];
    clearInterval(watchT);
    try{
      player.setPlaybackRate(SPEEDS[spdIdx]);
      player.seekTo(l.t/1000,true); player.playVideo();
    }catch(e){ return; }
    const end=(l.t+effD(cur))/1000;
    watchT=setInterval(()=>{
      try{
        const c=player.getCurrentTime();
        if(c>=end-0.05){
          if(loopOn){ player.seekTo(l.t/1000,true); }
          else { player.pauseVideo(); clearInterval(watchT); }
        }
      }catch(e){}
    },120);
  }
  function replay(){ if(mode==='ktv'){ try{ player.seekTo(lines[cur].t/1000,true); player.playVideo(); }catch(e){} return; } playSeg(); }
  function cycleSpeed(){
    spdIdx=(spdIdx+1)%SPEEDS.length;
    document.getElementById('spdBtn').textContent=SPEEDS[spdIdx]+'x';
    try{ player&&player.setPlaybackRate(SPEEDS[spdIdx]); }catch(e){}
  }
  function toggleLoop(){
    loopOn=!loopOn;
    document.getElementById('loopBtn').classList.toggle('on',loopOn);
    if(loopOn) playSeg();
  }

  // ── 跟讀:瀏覽器 STT / App 原生 STT 雙路(照 speak.html) ──
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const NATIVE_STT=!!(window.STAYJP_NATIVE&&window.STAYJP_NATIVE.canSpeech&&window.ReactNativeWebView);
  function _nPost(o){ try{ window.ReactNativeWebView.postMessage(JSON.stringify(o)); }catch(e){} }
  let rec=null, recording=false, _acc='', _nBase='', _prevRawN='', _settled=false;
  function toggleRec(){ recording?stopRec(true):startRec(); }
  function resetAcc(){ _acc=''; _nBase=''; _prevRawN=''; }
  function _recUI(on){ const b=document.getElementById('micBtn'); if(b){ b.classList.toggle('rec-on',on); b.innerHTML=on?('<i data-ic=stop></i> '+enOr('停止','Stop')):('<i data-ic=mic></i> '+enOr('開麥跟讀','Shadow with mic')); try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){} } }
  function onSaid(text,fin){
    const inp=document.getElementById('saidIn'); if(inp){ inp.style.display='block'; inp.value=text; }
    const m=matchChars(lines[cur].ja,text);
    paintHits(m.hits);
    if(!fin && m.ratio>=0.99){ stopRec(); showResult(m.ratio,null); return; }   // 唸到全對:自動收麥給分
    if(fin) showResult(m.ratio, null);
  }
  function paintHits(hits){
    const el=document.getElementById('pcJp'); if(!el) return;
    const raw=lines[cur].ja; let hIdx=0; let html='';
    for(const ch of raw){
      if(norm(ch)===''){ html+=esc(ch); continue; }
      html += hits[hIdx] ? '<span class="hit">'+esc(ch)+'</span>' : esc(ch);
      hIdx++;
    }
    el.innerHTML=html;
  }
  function showResult(ratio, diffHtml){
    _settled=true;
    const pct=Math.round(ratio*100), pass=ratio>=0.7;
    const res=document.getElementById('pcRes');
    res.className='pc-result '+(pass?'pass':'fail');
    res.innerHTML=`<div class="rt1">${pass?enOr('答對了!','Correct!'):enOr('再試一次會更好','Almost — try again')} ${pct}%${pass?' ✓':''}</div>`
      + (diffHtml?`<div class="rt2">${diffHtml}</div>`:'');
    if(pass){
      done[cur]=1; try{ localStorage.setItem(doneKey(),JSON.stringify(done)); }catch(e){}
      document.getElementById('pcNext').style.display='flex';
      updProg(); renderList();
    }
  }
  function startRec(){
    if(_settled){ _acc=''; _prevRawN=''; _nBase=''; _settled=false;   // 上一輪已給分:重新開始,不沿用舊累積
      const res=document.getElementById('pcRes'); if(res){ res.className='pc-result'; res.innerHTML=''; }
      document.getElementById('pcNext').style.display='none';
      const jp=document.getElementById('pcJp'); if(jp&&lines[cur]) jp.innerHTML=fr(lines[cur].ja);
    }
    try{ player&&player.pauseVideo(); }catch(e){}
    clearInterval(watchT);
    if(NATIVE_STT){
      _nBase=_acc;   // 這輪之前累積的先當基底
      window.stayjpSpeechResult=(t,fin)=>{
        if(!t) return;
        let nt=(t||'').trim();
        if(_prevRawN && nt.startsWith(_prevRawN)) nt=nt.slice(_prevRawN.length).trim();   // 原生累積 transcript:剝掉上一輪前綴
        const merged=_nBase+nt;
        if(fin){ _acc=merged; _prevRawN=(t||'').trim(); }
        onSaid(merged,false);
      };
      window.stayjpSpeechEnd=(err)=>{ recording=false; _recUI(false); const rn=document.getElementById('recNote'); if(err&&rn) rn.textContent=enOr('辨識出錯('+err+'),可直接打字。','Recognition error ('+err+') — you can type instead.'); };
      recording=true; _recUI(true); _nPost({type:'SPEECH_START',lang:'ja-JP'});
      return;
    }
    if(!SR){
      const rn=document.getElementById('recNote'); if(rn) rn.textContent=enOr('這個瀏覽器不支援語音辨識,可直接打字後看著色。','This browser has no speech recognition — type instead.');
      const inp=document.getElementById('saidIn'); if(inp){ inp.style.display='block'; inp.oninput=()=>onSaid(inp.value,false); inp.onchange=()=>onSaid(inp.value,true); }
      return;
    }
    // 連續聆聽:講慢/停頓不切;瀏覽器自己收工就自動重啟;每段 final 累積進 _acc,前面講的不會被清掉
    rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=true;
    rec.onresult=e=>{
      let interim='';
      for(let k=e.resultIndex;k<e.results.length;k++){
        const t=e.results[k][0].transcript;
        if(e.results[k].isFinal) _acc+=t; else interim+=t;
      }
      onSaid(_acc+interim,false);
    };
    rec.onerror=e=>{ if(e.error==='no-speech'||e.error==='aborted') return;   // 靜音/中止:交給 onend 重啟,不報錯
      const rn=document.getElementById('recNote'); if(rn) rn.textContent=enOr('辨識出錯('+e.error+'),可直接打字。','Recognition error ('+e.error+') — type instead.'); stopRec(); };
    rec.onend=()=>{
      if(recording){ try{ rec.start(); return; }catch(e){} }   // 使用者沒按停:瀏覽器超時自動續錄
      recording=false; _recUI(false);
    };
    try{ rec.start(); recording=true; _recUI(true); }catch(e){}
  }
  function stopRec(settle){
    const was=recording;
    recording=false;   // 先降旗:onend 才不會自動重啟
    if(NATIVE_STT&&was){ _nPost({type:'SPEECH_STOP'}); }
    else if(rec&&was){ try{rec.stop();}catch(e){} }
    _recUI(false);
    // 只有使用者自己按「停止」才結算;換句/換模式時的 stopRec 不能拿舊累積評新句
    if(settle && was && mode==='shadow' && _acc){ const m=matchChars(lines[cur].ja,_acc); paintHits(m.hits); showResult(m.ratio,null); }
  }

  // ── 聽寫 ──
  function checkDict(){
    const ta=document.getElementById('dictIn'); const said=(ta&&ta.value||'').trim();
    if(!said) return;
    const l=lines[cur]; l._rev=true;
    // 漢字寫法與假名寫法都算對:兩種比對取高分
    const t=normK(l.ja), s=normK(said);
    const dp=Array.from({length:s.length+1},()=>new Array(t.length+1).fill(0));
    for(let a=1;a<=s.length;a++)for(let b=1;b<=t.length;b++) dp[a][b]=s[a-1]===t[b-1]?dp[a-1][b-1]+1:Math.max(dp[a-1][b],dp[a][b-1]);
    let a=s.length,b=t.length; const keepS=new Set();
    while(a>0&&b>0){ if(s[a-1]===t[b-1]){keepS.add(a-1);a--;b--;} else if(dp[a-1][b]>=dp[a][b-1])a--; else b--; }
    let html='';
    for(let k=0;k<s.length;k++) html+=keepS.has(k)?'<span class="dok">'+esc(s[k])+'</span>':'<span class="dng">'+esc(s[k])+'</span>';
    document.getElementById('pcJp').classList.remove('blur');
    document.getElementById('pcZh').style.filter='';
    showResult(Math.max(t.length?dp[s.length][t.length]/Math.max(t.length,s.length):0, lcsRatio(said, kanaOf(l.ja)||l.ja)), html);
  }

  // ── 這支影片的單字・文法:掃字幕比對站上題庫,點開才載入大檔(vocab 每級 600KB) ──
  let learnTabCur='w', learnData=null, learnLoading=false;
  function loadScript(src){
    return new Promise(res=>{
      if(document.querySelector('script[data-lp="'+src+'"]')) return res();
      const el=document.createElement('script'); el.src=src; el.dataset.lp=src;
      el.onload=()=>res(); el.onerror=()=>res();
      document.head.appendChild(el);
    });
  }
  async function openLearn(det){
    if(!det.open || learnData || learnLoading) return;
    learnLoading=true;
    const body=document.getElementById('lpBody');
    body.innerHTML='<div class="lp-empty">'+enOr('載入中…','Loading…')+'</div>';
    await Promise.all(['vocab-n3.js','vocab-n2.js','vocab-n1.js','grammar-n5.js','grammar-n4.js','grammar-n3.js','grammar-n2.js','grammar-n1.js'].map(loadScript));
    learnData=extractLearn();
    learnLoading=false;
    document.getElementById('lpTabs').style.display='flex';
    renderLearn();
  }
  function extractLearn(){
    const big=lines.map(l=>l.ja).join('\n');
    const lineOf=(t)=>{ for(let i=0;i<lines.length;i++){ if(lines[i].ja.includes(t)) return i; } return -1; };
    // 單字:站上字庫裡有、且出現在字幕的詞(2 字以上;低級數優先)
    const words=[], seen=new Set();
    ['N5','N4','N3','N2','N1'].forEach(lv=>{
      const arr=window['VOCAB_'+lv]||[];
      arr.forEach(w=>{
        if(!w||!w.w||w.w.length<2||seen.has(w.w)) return;
        if(!big.includes(w.w)) return;
        seen.add(w.w);
        words.push({ w:w.w, r:w.r||'', m:w.m||'', c:w.c||'', lv, li:lineOf(w.w) });
      });
    });
    // 文法:把「～ています（進行）」這種標題拆出可比對的表面形
    const grams=[], gseen=new Set();
    [['N5',window.N5||(typeof N5!=='undefined'?N5:[])],['N4',window.N4||(typeof N4!=='undefined'?N4:[])],
     ['N3',typeof N3!=='undefined'?N3:[]],['N2',typeof N2!=='undefined'?N2:[]],['N1',typeof N1!=='undefined'?N1:[]]].forEach(([lv,arr])=>{
      (arr||[]).forEach(g=>{
        if(!g||!g.t||gseen.has(g.t)) return;
        const forms=String(g.t).split(/[・／\/]/).map(x=>x.replace(/[（(].*?[）)]/g,'').replace(/[～〜]/g,'').trim()).filter(x=>x.length>=2);
        const hit=forms.find(f=>big.includes(f));
        if(!hit) return;
        gseen.add(g.t);
        grams.push({ t:g.t, p:g.p||'', ex:g.ex||'', lv, li:lineOf(hit) });
      });
    });
    words.sort((a,b)=>b.w.length-a.w.length);
    return { words:words.slice(0,60), grams:grams.slice(0,30) };
  }
  function learnTab(k){
    learnTabCur=k;
    document.getElementById('lpTabW').classList.toggle('on',k==='w');
    document.getElementById('lpTabG').classList.toggle('on',k==='g');
    renderLearn();
  }
  function inNotebook(w){
    try{ return (JSON.parse(localStorage.getItem('word_notebook'))||[]).some(x=>x.w===w); }catch(e){ return false; }
  }
  function saveWord(btn,w,r,m,lv){
    try{
      const nb=JSON.parse(localStorage.getItem('word_notebook'))||[];
      if(!nb.some(x=>x.w===w)){ nb.push({ w, r, m, lv:lv.toLowerCase(), added:new Date().toISOString() }); localStorage.setItem('word_notebook',JSON.stringify(nb)); }
      btn.classList.add('saved'); btn.textContent='✓';
    }catch(e){}

  function renderLearn(){
    const body=document.getElementById('lpBody'); if(!body||!learnData) return;
    if(learnTabCur==='w'){
      if(!learnData.words.length){ body.innerHTML='<div class="lp-empty">'+enOr('這支影片沒對到站上字庫的單字。','No words from our dictionary appear in this video.')+'</div>'; return; }
      body.innerHTML=learnData.words.map(w=>{
        const saved=inNotebook(w.w);
        const line=w.li>=0?('<div class="lwl">'+fmtT(lines[w.li].t)+'　'+esc(lines[w.li].ja)+'</div>'):'';
        return '<div class="lw"><span class="lvb">'+w.lv+'</span><div class="lwx">'
          + '<div class="lww">'+esc(w.w)+(w.r&&w.r!==w.w?'<span class="lwr">'+esc(w.r)+'</span>':'')+'</div>'
          + '<div class="lwm">'+esc(typeof cvt==='function'?cvt(w.m):w.m)+(w.c?' ['+esc(w.c)+']':'')+'</div>'+line
          + '</div><div class="lwa">'
          + '<button onclick="YTS.speakWord(\''+esc(w.r||w.w).replace(/'/g,"\\'")+'\')"><i data-ic=volume></i></button>'
          + (w.li>=0?'<button onclick="YTS.jumpPlay('+w.li+')">▶</button>':'')
          + '<button class="'+(saved?'saved':'')+'" onclick="YTS.saveWord(this,\''+esc(w.w).replace(/'/g,"\\'")+'\',\''+esc(w.r).replace(/'/g,"\\'")+'\',\''+esc(w.m).replace(/'/g,"\\'")+'\',\''+w.lv+'\')">'+(saved?'✓':'☆')+'</button>'
          + '</div></div>';
      }).join('');
    } else {
      if(!learnData.grams.length){ body.innerHTML='<div class="lp-empty">'+enOr('這支影片沒對到站上的文法句型。','No grammar patterns from our library appear in this video.')+'</div>'; return; }
      body.innerHTML=learnData.grams.map(g=>
        '<div class="lg"><div class="lgt"><span class="lvb">'+g.lv+'</span> '+esc(g.t)+'</div>'
        + (g.p?'<div class="lgp">'+esc(g.p)+'</div>':'')
        + (g.ex?'<div class="lgx">'+esc(typeof cvt==='function'?cvt(g.ex):g.ex)+'</div>':'')
        + (g.li>=0?'<div class="lgl">'+fmtT(lines[g.li].t)+'　'+esc(lines[g.li].ja)+' <button style="border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:8px;padding:3px 8px;font:inherit;font-size:11.5px;cursor:pointer" onclick="YTS.jumpPlay('+g.li+')">▶</button></div>':'')
        + '</div>').join('');
    }
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}
  }
  function speakWord(t){ try{ window.speak&&window.speak(t); }catch(e){} }

  // ── 影片測驗:從字幕自動出題(聽句選句 / 克漏字),每題附詳解 ──
  let qz = { list:[], i:0, picked:null, score:0, log:[] };
  const shuf = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
  // 從句子挑一個「詞」當空格:優先含漢字的詞塊,其次片假名詞,再其次連續假名
  function pickChunk(t){
    const cands = [];
    (t.match(/[一-龥々]{1,4}[ぁ-ん]{0,3}/g)||[]).forEach(x=>{ if(x.length>=2) cands.push(x); });
    if(!cands.length) (t.match(/[ァ-ヴー]{2,8}/g)||[]).forEach(x=>cands.push(x));
    if(!cands.length) { const k=t.replace(/[\s、。,．.!！?？「」『』()（）・〜~…–—-]/g,''); if(k.length>=4) cands.push(k.slice(1,4)); }
    return cands.length ? cands[Math.floor(Math.random()*cands.length)] : '';
  }
  function buildQuiz(){
    const pool = lines.map((l,i)=>({l,i})).filter(x=>norm(x.l.ja).length>=6);
    if(pool.length<4) return [];
    const picks = shuf(pool).slice(0, Math.min(8, pool.length));
    const out=[];
    picks.forEach((p,n)=>{
      const others = shuf(pool.filter(x=>x.i!==p.i));
      if(n%2===0 || !pickChunk(p.l.ja)){
        // A. 聽句選句:播那一段,從四句裡選出聽到的
        const opts = shuf([p.l.ja, ...others.slice(0,3).map(x=>x.l.ja)]);
        out.push({ kind:'listen', idx:p.i, ans:p.l.ja, opts });
      } else {
        // B. 克漏字:挖掉一個詞,從四個詞裡選
        const chunk = pickChunk(p.l.ja);
        const distract = [];
        for(const o of others){ const c=pickChunk(o.l.ja); if(c && c!==chunk && !distract.includes(c)) distract.push(c); if(distract.length>=3) break; }
        if(distract.length<3){ const opts=shuf([p.l.ja, ...others.slice(0,3).map(x=>x.l.ja)]); out.push({ kind:'listen', idx:p.i, ans:p.l.ja, opts }); return; }
        out.push({ kind:'blank', idx:p.i, ans:chunk, opts:shuf([chunk,...distract]) });
      }
    });
    return out;
  }
  function startQuiz(){
    qz = { list:buildQuiz(), i:0, picked:null, score:0, log:[] };
    const box=document.getElementById('quizBox');
    box.style.display='block';
    if(!qz.list.length){ box.innerHTML='<div class="qz-sub">'+enOr('這支影片句子太少,出不了題——換一支再試。','Not enough lines in this video for a quiz — try another.')+'</div>'; return; }
    // 先給開始畫面:不要一點開就冒出聲音(用戶回饋)
    box.innerHTML='<div class="qz-res" style="padding:18px 0">'
      + '<div style="font-size:15px;font-weight:800;margin-bottom:4px">'+enOr('影片測驗','Video quiz')+'</div>'
      + '<div style="font-size:13px;color:var(--tx2);line-height:1.9">'+enOr('共 '+qz.list.length+' 題:聽句選句 + 克漏字。<br>每題會播放那一段影片,記得開聲音。', qz.list.length+' questions: listening and cloze.<br>Each one plays a clip — turn your sound on.')+'</div>'
      + '<button class="btn pri" style="margin-top:14px;padding:13px 28px;font-size:15px" onclick="YTS.qzBegin()"><i data-ic=volume></i> '+enOr('開始測驗','Start quiz')+'</button></div>';
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}
  }
  function qzBegin(){ renderQuiz(); }
  function renderQuiz(){
    const q=qz.list[qz.i], box=document.getElementById('quizBox');
    const l=lines[q.idx];
    const head='<div class="qz-head"><span>'+enOr('第 ','Q')+(qz.i+1)+' / '+qz.list.length+enOr(' 題','')+'</span><span>'+enOr('答對 ','Correct ')+qz.score+'</span></div>'
      + '<div class="qz-bar"><i style="width:'+(qz.i/qz.list.length*100)+'%"></i></div>';
    let body='';
    if(q.kind==='listen'){
      body = '<div class="qz-q">'+enOr('聽聽看,這句是哪一句?','Which line did you hear?')+'</div>'
        + '<div class="qz-sub">'+fmtT(l.t)+'　<button class="btn" style="padding:5px 12px;font-size:13px" onclick="YTS.qzPlay()"><i data-ic=volume></i> '+enOr('播放','Play')+'</button></div>';
    } else {
      const masked = esc(l.ja).replace(esc(q.ans), '<span class="bk">?</span>');
      body = '<div class="qz-q">'+enOr('空格該填哪個詞?','Which word fills the blank?')+'</div>'
        + '<div class="qz-blank">'+masked+'</div>'
        + '<div class="qz-sub">'+fmtT(l.t)+'　<button class="btn" style="padding:5px 12px;font-size:13px" onclick="YTS.qzPlay()"><i data-ic=volume></i> '+enOr('播放這句','Play line')+'</button></div>';
    }
    body += '<div class="qz-opts">'+q.opts.map((o,k)=>'<button class="qz-opt" data-k="'+k+'" onclick="YTS.qzAnswer(this,'+k+')">'+esc(o)+'</button>').join('')+'</div>';
    box.innerHTML = head+body+'<div id="qzEx"></div>';
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}
    qz.picked=null;
    qzPlay();
  }
  function qzPlay(){
    const q=qz.list[qz.i]; if(!q||!player) return;
    const l=lines[q.idx];
    clearInterval(watchT); stopKtv();
    try{ player.seekTo(l.t/1000,true); player.playVideo(); }catch(e){}
    const end=(l.t+effD(q.idx))/1000;
    watchT=setInterval(()=>{ try{ if(player.getCurrentTime()>=end-0.05){ player.pauseVideo(); clearInterval(watchT); } }catch(e){} },100);
  }
  function qzAnswer(btn,k){
    if(qz.picked!==null) return;
    const q=qz.list[qz.i], l=lines[q.idx];
    qz.picked=k;
    const okIdx=q.opts.indexOf(q.ans);
    document.querySelectorAll('#quizBox .qz-opt').forEach((b,n)=>{
      b.disabled=true;
      if(n===okIdx) b.classList.add('ok');
      else if(n===k) b.classList.add('ng');
    });
    const correct = k===okIdx;
    if(correct) qz.score++;
    qz.log.push({ kind:q.kind, idx:q.idx, mine:q.opts[k], ans:q.ans, correct });
    // 詳解:整句(注音)+中文+這句的時間點,附重播
    const zhLine = (l.zh&&hasZh) ? '<div class="exz">'+esc(l.zh)+'</div>' : '';
    const why = q.kind==='listen'
      ? enOr('其他選項都是這支影片裡的其他句子,回頭聽會發現音節長度和語尾不一樣。','The other options are different lines from this video — listen again and compare the rhythm and endings.')
      : enOr('把整句唸一次,注意這個詞在句中的位置和前後接續。','Read the whole line aloud and note how this word connects to what comes before and after.');
    document.getElementById('qzEx').innerHTML =
      '<div class="qz-ex"><b>'+(correct?enOr('答對了!','Correct!'):enOr('正解:','Answer: '))+'</b>'+esc(q.ans)
      + '<div class="exj">'+fr(l.ja)+'</div>'+zhLine
      + '<div style="color:var(--tx2);font-size:12.5px;margin-top:4px">'+why+'</div>'
      + '<div class="qz-actions"><button class="btn" onclick="YTS.qzPlay()"><i data-ic=volume></i> '+enOr('再聽一次','Replay')+'</button>'
      + '<button class="btn pri" onclick="YTS.qzNext()">'+(qz.i+1>=qz.list.length?enOr('看結果 →','Results →'):enOr('下一題 →','Next →'))+'</button></div></div>';
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}
  }
  function qzNext(){
    if(qz.i+1>=qz.list.length){ qzResult(); return; }
    qz.i++; renderQuiz();
  }
  function qzResult(){
    const pct=Math.round(qz.score/qz.list.length*100);
    let h='<div class="qz-res"><div class="qz-score">'+qz.score+' / '+qz.list.length+'</div>'
      + '<div style="color:var(--tx2);font-size:13px">'+(pct>=80?enOr('聽力很穩!','Sharp ears!'):pct>=50?enOr('抓到一半,再聽一輪會更好','Halfway there — one more round helps'):enOr('先用跟播多聽幾次再回來','Try Follow mode a few times first'))+'</div></div>'
      + '<div class="qz-rv">';
    qz.log.forEach((r,n)=>{
      const l=lines[r.idx];
      h += '<div class="qz-rv-item"><div class="rq">'+(n+1)+'. '+(r.kind==='listen'?enOr('聽句','Listening'):enOr('克漏字','Cloze'))+'　'+fmtT(l.t)+'</div>'
        + (r.correct?'':'<div class="mine">✗ '+esc(r.mine)+'</div>')
        + '<div class="corr">✓ '+esc(r.ans)+'</div>'
        + '<div style="margin-top:4px;line-height:2">'+fr(l.ja)+'</div>'
        + ((l.zh&&hasZh)?'<div class="exz" style="color:var(--tx2);font-size:12.5px">'+esc(l.zh)+'</div>':'')
        + '<button class="btn" style="margin-top:6px;padding:5px 12px;font-size:12.5px" onclick="YTS.jumpPlay('+r.idx+')"><i data-ic=volume></i> '+enOr('聽這句','Play')+'</button></div>';
    });
    h += '</div><div class="qz-actions"><button class="btn pri" onclick="YTS.startQuiz()">'+enOr('再測一次','Again')+'</button>'
      + '<button class="btn" onclick="YTS.setMode(\'ktv\')">'+enOr('回跟播','Back to Follow')+'</button></div>';
    document.getElementById('quizBox').innerHTML=h;
    try{ if(window.Icons&&Icons.hydrate)Icons.hydrate(); }catch(e){}
  }
  function jumpPlay(i){
    const l=lines[i]; if(!l||!player) return;
    clearInterval(watchT);
    try{ player.seekTo(l.t/1000,true); player.playVideo(); }catch(e){}
    const end=(l.t+effD(i))/1000;
    watchT=setInterval(()=>{ try{ if(player.getCurrentTime()>=end-0.05){ player.pauseVideo(); clearInterval(watchT); } }catch(e){} },100);
  }

  // ── 句子總覽(跳句) ──
  function toggleZh(btn){
    zhOn=!zhOn;
    try{ localStorage.setItem('yts_zh', zhOn?'1':'0'); }catch(e){}
    applyZh();
  }
  function applyZh(){
    const show = hasZh && zhOn;
    const pcZh=document.getElementById('pcZh'); if(pcZh) pcZh.style.visibility=show?'visible':'hidden';
    const kZh=document.getElementById('ktvZh'); if(kZh) kZh.style.visibility=show?'visible':'hidden';
    const b=document.getElementById('zhBtn');
    if(b){ b.style.display=hasZh?'':'none';   // 這支沒中文:按鈕直接不出現
      b.textContent=enOr('中文:','ZH: ')+(zhOn?enOr('開','on'):enOr('關','off')); }
  }
  function toggleList(){
    listOpen=!listOpen;
    document.getElementById('allLines').style.display=listOpen?'block':'none';
    if(listOpen) renderList();
  }
  function renderList(){
    if(!listOpen) return;
    document.getElementById('allLines').innerHTML=lines.map((l,i)=>
      `<div class="jl ${i===cur?'cur':''}" onclick="YTS.jump(${i})"><span class="t">${fmtT(l.t)}</span><span>${esc(l.ja.slice(0,22))}${l.ja.length>22?'…':''}</span>${done[i]?'<span class="ok">✓</span>':''}</div>`).join('');
  }

  // ── 模式/換影片/範例 ──
  function setMode(m){
    stopRec(); mode=m;
    ['ktv','shadow','dict','quiz'].forEach(x=>{ const b=document.getElementById('m'+x.charAt(0).toUpperCase()+x.slice(1)); if(b) b.classList.toggle('on',m===x); });
    lines.forEach(l=>{ l._rev=false; });
    const qb=document.getElementById('quizBox');
    if(m==='quiz'){
      stopKtv();
      // 測驗:只留題目卡(藏掉跟播/跟讀那組元件)
      ['ktvBox','pcJp','pcZh','pcAct','pcRes','pcNext'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
      document.getElementById('pcIdx').textContent='';
      document.querySelector('.pc-ctr').style.display='none';
      startQuiz();
      return;
    }
    if(qb){ qb.style.display='none'; qb.innerHTML=''; }
    ['pcJp','pcAct'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display=''; });
    document.querySelector('.pc-ctr').style.display='';
    if(m==='ktv'){ renderCard(true); }
    else { stopKtv(); try{ player&&player.pauseVideo(); }catch(e){} renderCard(false); }
  }
  function loadSample(v){ document.getElementById('urlIn').value=v; load(); }
  // 縮圖後備:部分影片沒有 maxresdefault(404) → 依序退 sddefault、hqdefault
  const THUMB_STEPS=['sddefault','hqdefault','mqdefault'];
  function thumbFallback(img){
    const n=parseInt(img.dataset.step||'0',10);
    if(n>=THUMB_STEPS.length){ img.onerror=null; return; }
    img.dataset.step=String(n+1);
    img.src='https://i.ytimg.com/vi/'+img.dataset.v+'/'+THUMB_STEPS[n]+'.jpg';
  }
  function renderGallery(){
    const g=document.getElementById('gal'); if(!g) return;
    const cats=['全部',...new Set(SAMPLES.map(x=>x.cat))];
    document.getElementById('galCats').innerHTML=cats.map(c=>`<button class="${c===galCat?'on':''}" onclick="YTS.setCat('${c}')">${esc(c)}</button>`).join('');
    g.innerHTML=SAMPLES.filter(x=>galCat==='全部'||x.cat===galCat).map(x=>`<button class="gal-c" onclick="YTS.loadSample('${x.v}')">
      <img src="https://i.ytimg.com/vi/${x.v}/maxresdefault.jpg" alt="" loading="lazy" data-v="${x.v}" data-step="0" onerror="YTS.thumbFallback(this)">
      <div class="gt">${esc(x.t)}</div><span class="gtag">${esc(x.tag)}</span>
    </button>`).join('');
  }
  function setCat(c){ galCat=c; renderGallery(); }
  function theater(){
    const c=document.querySelector('.cols'); if(!c) return;
    const on=c.classList.toggle('theater');
    const b=document.getElementById('thBtn'); if(b) b.textContent=on?enOr('縮小','Shrink'):('⛶ '+enOr('劇院模式','Theater'));
  }
  function backToPractice(){
    if(!lines.length) return;
    document.getElementById('inputCard').style.display='none';
    document.getElementById('practice').style.display='block';
    renderCard(false);
  }
  function openTranscript(){ try{ window.open('https://www.youtube.com/watch?v='+vid,'_blank'); }catch(e){} }
  function swap(){
    stopRec(); clearInterval(watchT); stopKtv();
    try{ player&&player.pauseVideo(); }catch(e){}
    document.getElementById('practice').style.display='none';
    document.getElementById('inputCard').style.display='block';
    document.getElementById('backPr').style.display=lines.length?'block':'none';   // 只是點點看?一鍵回去,不會弄丟
    document.getElementById('urlIn').value='';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ── 教學 ──
  function tutHtml(){
    const en=I18n.getLang()==='en';
    const S=(n,zhT,enT,zhP,enP)=>`<div class="tut-step"><span class="tut-n">${n}</span><div><b>${en?enT:cvt(zhT)}</b><p>${en?enP:cvt(zhP)}</p></div></div>`;
    return S(1,'挑一支影片','Pick a video',
        '首頁的片庫全部可以直接練——用上面的分類挑(入門、會話、故事、Vlog、動漫、歌、新聞),點縮圖就開始,不用設定任何東西。',
        'Every video in the gallery is ready to go — filter by category (Beginner, Conversation, Stories, Vlog, Anime, Songs, News) and just tap a thumbnail.')
      + S(2,'四種練法,由淺入深','Four ways to practice',
        '<em>跟播</em>=影片一直播,字幕自動跳、當前句像 KTV 一樣刷色;<em>跟讀</em>=開麥跟著唸,唸到的字亮綠給分;<em>聽寫</em>=句子先遮住,聽完打出來對答案;<em>測驗</em>=聽句選句和克漏字,每題都有詳解。',
        '<em>Follow</em>: captions auto-advance with a karaoke highlight. <em>Shadow</em>: speak along and matched words light up with a score. <em>Dictation</em>: the line is hidden until you type it. <em>Quiz</em>: listening and cloze questions, each with an explanation.')
      + S(3,'邊看邊查、順手收單字','Look things up as you go',
        '句子裡的漢字點一下就查(有讀音和意思);「<em>這支影片的單字・文法</em>」會列出這支片用到的 JLPT 單字和句型,標級數、可跳去那一句聽,☆ 收進生詞本就會進複習系統。速度可切 0.5x、循環單句、中文翻譯也能開關。',
        'Tap any kanji in a line to look it up. The <em>Words &amp; grammar in this video</em> panel lists the JLPT vocabulary and patterns it uses — with levels, jump-to-line playback, and ☆ to save into your review deck. You can also slow to 0.5x, loop a line, and toggle the Chinese translation.');
  }
  function tut(show){
    const m=document.getElementById('tutMask');
    if(show){ document.getElementById('tutBody').innerHTML=tutHtml();
      document.getElementById('tutT').textContent=enOr('30 秒學會 YouTube 跟讀','YouTube shadowing in 30 seconds');
      document.getElementById('tutGo').textContent=enOr('開始用','Got it');
      m.classList.add('show');
    } else { m.classList.remove('show'); try{ localStorage.setItem('yts_tut_seen','1'); }catch(e){} }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    _retext(); renderGallery();
    // 點字查詢時把影片暫停:查詢彈窗的發音才不會跟影片疊音
    document.addEventListener('click',e=>{ if(e.target&&e.target.closest&&e.target.closest('.jlk')){ try{ player&&player.pauseVideo(); }catch(e2){} clearInterval(watchT); } },true);
    const ta=document.getElementById('pasteTa');
    if(ta) ta.addEventListener('paste',()=>{ setTimeout(()=>{ if((ta.value||'').trim()) parsePaste(); },80); });   // 貼上即解析
    try{ if(!localStorage.getItem('yts_tut_seen')) tut(true); }catch(e){}
  });
  return { load, parsePaste, nav, jump, replay, cycleSpeed, toggleLoop, setMode, toggleRec, checkDict, toggleList, toggleZh, tut, loadSample, setCat, backToPractice, openTranscript, swap, theater, startQuiz, qzBegin, qzPlay, qzAnswer, qzNext, jumpPlay, openLearn, learnTab, saveWord, speakWord, thumbFallback, _retext };
})();
</script>
