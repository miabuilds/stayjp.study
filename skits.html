<style>

  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){ --bg:#161615;--bg2:#211F1D;--bg3:#2A2724;--tx:#EDEBE7;--tx2:#A7A29B;--tx3:#6E6A64;--ac:#E8734A;--ac2:#E8734A;--bd:#332F2B;--soft:#E8734A1c; }}

  .ep:active{transform:scale(.98)}
  .ep-img{position:relative;aspect-ratio:4/5;background:var(--bg3);overflow:hidden}

  .ln{width:100%;max-width:420px;background:#1c1b1a;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px 12px;margin-top:10px}

  .ln-ctl{display:flex;gap:8px;margin-top:10px}
  .ln-ctl button{flex:1;min-height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .ln-ctl button svg{width:15px;height:15px}
  .ln-ctl button:disabled{opacity:.35}
  .ln-opt{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ln-spd{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
  .ln-spd button{border:none;background:transparent;color:rgba(255,255,255,.7);font:inherit;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer}
  .ln-spd button.on{background:#fff;color:#111}
  .ln-stop{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:rgba(255,255,255,.8);cursor:pointer;user-select:none}
  .ln-stop input{width:16px;height:16px;accent-color:var(--ac)}
  .ln-say{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--ac);color:#fff;text-decoration:none;font-size:13.5px;font-weight:800;border-radius:10px;padding:7px 12px}
  .ln-say svg{width:15px;height:15px}
  .pl-say{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:var(--soft);color:var(--ac);text-decoration:none;font-size:13.5px;font-weight:800;border-radius:10px;padding:7px 12px}
  .pl-say svg{width:15px;height:15px}
</style>

<script>
// 繁→簡:跟其他頁一樣用 OpenCC 即時轉;英文走 L(中,英)
let _tw2cn = null;
function ensureOpenCC(){
  if(_tw2cn) return Promise.resolve();
  return new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js';
    s.onload=()=>{ try{ _tw2cn=OpenCC.Converter({from:'tw',to:'cn'}); }catch(e){} res(); }; s.onerror=()=>res(); document.head.appendChild(s); });
}
function lang(){ try{ return I18n.getLang(); }catch(e){ return 'zh-TW'; } }
function cvt(x){ return (!x||lang()!=='zh-CN'||!_tw2cn)?x:_tw2cn(x); }
function L(zh,en){ return lang()==='en'?en:cvt(zh); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 看過哪幾集:localStorage skit_seen {"3":1};已加進 app.html SYNC_KEYS,登入後回到面板就會跟帳號同步(聯集合併)
function seen(){ try{ return JSON.parse(localStorage.getItem('skit_seen')||'{}')||{}; }catch(e){ return {}; } }
function markSeen(n){ try{ const s=seen(); s[n]=1; localStorage.setItem('skit_seen',JSON.stringify(s)); }catch(e){} }

const EPS = window.SKITS || [];

function render(){
  document.documentElement.lang = lang()==='en'?'en':(lang()==='zh-CN'?'zh-Hans':'zh-Hant');
  document.getElementById('langBtn').textContent = lang()==='en'?'中':'EN';
  document.getElementById('bkTx').textContent = L('返回','Back');
  document.getElementById('hT').textContent = L('小狸的日本生活','Tanuki in Japan');
  document.getElementById('hL').textContent = L('每集 20 秒,看小狸在日本出包,順便學一句馬上用得到的日文。','20-second skits: Tanuki messes up in Japan — and you learn one phrase you can use right away.');
  document.getElementById('who').innerHTML =
    '<span><b>'+esc(L('小狸','Tanuki'))+'</b> · '+esc(L('剛到日本、一直出包','new in Japan, always in trouble'))+'</span>'+
    '<span><b>コン</b> · '+esc(L('日本在地的狐狸朋友','a local fox friend'))+'</span>'+
    '<span><b>'+esc(L('柴犬店員','Shiba clerk'))+'</b> · '+esc(L('哪家店都有牠','works at every shop'))+'</span>';
  // 還沒看的排上面,看過的收到下面「看過的」區,找新集數不用一直往下滑
  const s = seen();
  const card = e =>
    '<button class="ep" data-n="'+e.n+'">'+
      '<div class="ep-img"><img src="'+skitFile(e.n,'jpg')+'" alt="" loading="lazy" decoding="async">'+
      '<span class="ep-no">#'+e.n+'</span>'+
      (s[e.n] ? '<span class="ep-seen">'+icon('check')+esc(L('看過','Seen'))+'</span>' : '')+
      '<span class="ep-play">'+icon('play')+'</span></div>'+
      '<div class="ep-b"><div class="ep-t">'+esc(L(e.t,e.en))+'</div>'+
      '<div class="ep-p" lang="ja">'+esc(e.p)+'</div>'+
      '<div class="ep-m">'+esc(L(e.m,e.men))+'</div></div>'+
    '</button>';
  const fresh = EPS.filter(e=>!s[e.n]), done = EPS.filter(e=>s[e.n]);
  document.getElementById('grid').innerHTML =
    (done.length && fresh.length ? '<div class="sec-h">'+esc(L('還沒看','New for you'))+' <span class="cnt">'+fresh.length+'</span></div>' : '')+
    (fresh.length ? '<div class="grid">'+fresh.map(card).join('')+'</div>' : '')+
    (done.length ? '<div class="sec-h">'+esc(L('看過的','Watched'))+' <span class="cnt">'+done.length+'</span></div><div class="grid seen-grid">'+done.map(card).join('')+'</div>' : '');
  document.getElementById('note').innerHTML = L(
    '<b>怎麼用:</b>先看一次笑一下,再用影片下面的「下一句」一句一句聽(可以調慢速度、勾「每句停」)。最後按「跟讀這句」,AI 會幫你的發音打分。',
    '<b>How to use:</b> watch once for fun, then go line by line with “Next” (slow it down or pause after each line). Finally tap “Shadow” and AI scores your pronunciation.');
  document.getElementById('ft').innerHTML = 'StayJP 日本再留計劃 · <a href="app.html" style="color:var(--tx3)">'+esc(L('學習工具','Study tools'))+'</a><br>'+
    esc(L('配音','Voices'))+':VOICEVOX(ずんだもん・猫使アル ほか)';
  if(!_cur) return;
  fillPlayer(_cur, false);
}

// ── 播放層:開啟時 pushState,手機/App 按返回鍵就是關掉播放而不是離開頁面 ──
const pl=document.getElementById('pl'), V=document.getElementById('plV');
let _cur=null, _pushed=false;   // _pushed:播放層是自己 pushState 開的(關閉時 back);從 ?ep= 直接進來的就不能 back,不然會離開頁面
function fillPlayer(n, load){
  const i=EPS.findIndex(e=>e.n===n); const e=EPS[i]; if(!e) return;
  document.getElementById('plT').textContent = '#'+e.n+' '+L(e.t,e.en);
  document.getElementById('plLbl').textContent = L('這集學到','Phrase of the episode');
  document.getElementById('plP').textContent = e.p;
  document.getElementById('plR').textContent = e.r!==e.p ? e.r : '';
  document.getElementById('plM').textContent = L(e.m,e.men);
  const ps=document.getElementById('plSay'); ps.innerHTML = icon('mic')+esc(L('跟讀這句，AI 幫你打分','Shadow it — AI scores you')); ps.href = sayUrl(e.p, e.r, e.m);
  const pv=document.getElementById('plPrev'), nx=document.getElementById('plNext');
  pv.textContent = '‹ '+L('上一集','Previous'); pv.disabled = i<=0;
  nx.textContent = i<EPS.length-1 ? L('下一集','Next')+' ›' : L('看完了!','All done!'); nx.disabled = i>=EPS.length-1;
  if(load){
    V.poster = skitFile(e.n,'jpg'); V.src = skitFile(e.n,'mp4'); V.defaultPlaybackRate = V.playbackRate = rate; showLine(-1);
    const p=V.play(); if(p&&p.catch) p.catch(()=>{});
  }
}
function openEp(n, push){
  if(push) _pushed=true;
  _cur=n; fillPlayer(n,true); pl.classList.add('on'); document.body.classList.add('lock');
  try{ const u=new URL(location.href); u.searchParams.set('ep',n); history[push?'pushState':'replaceState']({skit:n},'',u); }catch(e){}
}
function closePl(){
  _cur=null; _pushed=false; V.pause(); V.removeAttribute('src'); V.load(); pl.classList.remove('on'); document.body.classList.remove('lock'); render();
}
// ── 逐句播放:時間軸在 videos/skit/lines.json(~/stayjp-video 的 export-lines.ts 產) ──
let LINES = null, li = -1, stopAt = null, rate = 1;
try{ rate = +localStorage.getItem('skit_rate') || 1; }catch(e){}
fetch('videos/skit/lines.json').then(r=>r.json()).then(d=>{ LINES=d; if(_cur) showLine(lineAt(V.currentTime||0)); }).catch(()=>{});
const $ = id => document.getElementById(id);
function curLines(){ return (LINES && LINES[_cur]) || []; }
function lineAt(t){ const ls=curLines(); let k=-1; for(let i=0;i<ls.length;i++){ if(ls[i].t0 <= t+0.15) k=i; else break; } return k; }   // 0.15 要大於 jump 往前退的 0.08,不然會判回上一句
function sayUrl(ja, kana, zh){ return 'speak.html?say='+encodeURIComponent(ja)+'&kana='+encodeURIComponent(kana||ja)+'&zh='+encodeURIComponent(zh||''); }
const plain = x => String(x||'').replace(/[、。！？!?…〜ー\s]/g,'');
function showLine(k){
  li = k; const ls = curLines(), l = ls[k];
  $('lnPos').textContent = ls.length ? (Math.max(k,0)+1)+' / '+ls.length : '';
  $('lnPrev').disabled = k<=0; $('lnNext').disabled = k>=ls.length-1;
  if(!l){
    $('lnWho').textContent = L('逐句','Line by line'); $('lnWho').classList.remove('t');
    $('lnJa').textContent = ls.length ? L('按「下一句」一句一句聽','Tap “Next” to go line by line') : '';
    $('lnKana').textContent = ''; $('lnZh').textContent = ''; $('lnSay').style.visibility='hidden'; return;
  }
  $('lnWho').textContent = l.teach ? L('教學','Lesson') : l.who; $('lnWho').classList.toggle('t', !!l.teach);
  $('lnJa').textContent = l.ja;
  $('lnKana').textContent = plain(l.kana)!==plain(l.ja) ? l.kana : '';
  $('lnZh').textContent = L(l.zh, '');
  $('lnSay').style.visibility='visible'; $('lnSay').href = sayUrl(l.ja, l.kana, l.zh);
}
function jump(k){
  const l = curLines()[k]; if(!l) return;
  V.currentTime = Math.max(0, l.t0 - 0.08); showLine(k);
  stopAt = $('lnStop').checked ? l.t1 + 0.25 : null;
  const p=V.play(); if(p&&p.catch) p.catch(()=>{});
}
// 播放中用 rAF 盯時間:換句就更新字幕;勾「每句停」就在這句講完時暫停(timeupdate 一秒才 4 次,會停太晚)
function tick(){
  if(!V.paused && _cur){
    const k = lineAt(V.currentTime);
    if(k !== li){ showLine(k); const l=curLines()[k]; if(l && $('lnStop').checked) stopAt = l.t1 + 0.25; }
    if(stopAt != null && V.currentTime >= stopAt){ V.pause(); stopAt = null; }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
V.addEventListener('seeked', ()=>{ if(V.paused) showLine(lineAt(V.currentTime)); });
$('lnPrev').onclick = ()=> jump(Math.max(0, li-1));
$('lnNext').onclick = ()=> jump(Math.min(curLines().length-1, li+1));
$('lnRe').onclick = ()=> jump(Math.max(0, li));
$('lnJa').onclick = ()=> jump(Math.max(0, li));
function setRate(r){ rate=r; V.defaultPlaybackRate = V.playbackRate = r; try{ localStorage.setItem('skit_rate', r); }catch(e){} [...$('lnSpd').children].forEach(b=>b.classList.toggle('on', +b.dataset.r===r)); }
$('lnSpd').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(b) setRate(+b.dataset.r); });
try{ $('lnStop').checked = localStorage.getItem('skit_stop')==='1'; }catch(e){}
$('lnStop').onchange = ()=>{ try{ localStorage.setItem('skit_stop', $('lnStop').checked?'1':'0'); }catch(e){} if(!$('lnStop').checked) stopAt=null; };
// 去跟讀頁前先暫停影片
['lnSay','plSay'].forEach(id=>$(id).addEventListener('click', ()=>V.pause()));
function lineLabels(){
  $('lnPrev').innerHTML = '‹ '+esc(L('上一句','Prev'));
  $('lnRe').innerHTML = icon('refresh')+esc(L('重播','Replay'));
  $('lnNext').innerHTML = esc(L('下一句','Next'))+' ›';
  $('lnStopTx').textContent = L('每句停','Pause each line');
  $('lnSay').innerHTML = icon('mic')+esc(L('跟讀這句','Shadow'));
  setRate(rate);
}
lineLabels();

function step(d){ const i=EPS.findIndex(e=>e.n===_cur); const e=EPS[i+d]; if(e) openEp(e.n,false); }
V.addEventListener('ended',()=>{ if(_cur) markSeen(_cur); });
V.addEventListener('timeupdate',()=>{ if(_cur && V.duration && V.currentTime/V.duration>.8) markSeen(_cur); });
document.getElementById('plX').onclick=()=>{ if(_pushed) history.back(); else { closePl(); try{ const u=new URL(location.href); u.searchParams.delete('ep'); history.replaceState(null,'',u); }catch(e){} } };
document.getElementById('plPrev').onclick=()=>step(-1);
document.getElementById('plNext').onclick=()=>step(1);
window.addEventListener('popstate',()=>{ const n=history.state&&history.state.skit; if(n) openEp(n,false); else if(_cur) closePl(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&_cur) document.getElementById('plX').click(); });
document.getElementById('grid').addEventListener('click',ev=>{ const b=ev.target.closest('.ep'); if(b) openEp(+b.dataset.n,true); });

function cycleLang(){
  const next = lang()==='en' ? 'zh-TW' : 'en';
  try{ I18n.setLang ? I18n.setLang(next) : localStorage.setItem('ui_lang',next); }catch(e){ try{ localStorage.setItem('ui_lang',next); }catch(_){} }
  render(); lineLabels(); if(_cur) showLine(li);
}

render();
if(lang()==='zh-CN') ensureOpenCC().then(render);
// 分享連結 skits.html?ep=3 直接開那集
try{ const q=+new URLSearchParams(location.search).get('ep'); if(q && EPS.some(e=>e.n===q)) openEp(q,false); }catch(e){}
</script>
<script src="font-scale.js"></script>
<script src="back-to-top.js"></script>
<script defer src="promo-banner.js"></script>
</body>
</html>
