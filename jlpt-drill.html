<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT 刷題特區 — 漢字・語彙・文法 逐題詳解｜StayJP 日本再留計劃</title>
<meta name="description" content="JLPT N5–N1 專業刷題:漢字讀音、文脈規定、文法形式,照真題題型出題,每題附完整詳解(為什麼對、錯的選項錯在哪)。含錯題本重刷。">
<link rel="canonical" href="https://stayjp.study/jlpt-drill.html">
<style>
  :root{ --bg:#F6F4EF;--bg2:#FFFFFF;--bg3:#EFECE5;--tx:#2C2C2C;--tx2:#6B6B6B;--tx3:#9A9A9A;--ac:#C6553B;--ac2:#D4654A;--bd:#E7E3DC;--ok:#15803d;--bad:#c2410c;--soft:#C6553B14;--serif:"Noto Serif TC","Songti TC",serif; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#161615;--bg2:#211F1D;--bg3:#2A2724;--tx:#EDEBE7;--tx2:#A7A29B;--tx3:#6E6A64;--ac:#E8734A;--ac2:#E8734A;--bd:#332F2B;--ok:#4ade80;--bad:#fb923c;--soft:#E8734A1c; }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 60px}
  header{display:flex;align-items:center;gap:10px;padding:14px 0}
  header .back{color:var(--tx2);text-decoration:none;font-size:14px;flex-shrink:0}
  header .logo{font-family:var(--serif);font-weight:700;font-size:17px}
  header .sp{flex:1}
  .hero{padding:18px 0 6px}
  h1{font-family:var(--serif);font-size:clamp(24px,5vw,32px);line-height:1.25;margin:6px 0 8px;text-wrap:balance}
  .lead{color:var(--tx2);font-size:14.5px}
  .lvtabs{display:flex;gap:6px;margin:18px 0 10px}
  .lvtab{flex:1;text-align:center;font-size:14px;font-weight:700;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:10px;padding:9px 0;cursor:pointer}
  .lvtab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:8px}
  .type{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 15px;cursor:pointer;transition:border-color .12s}
  .type:hover{border-color:var(--ac)}
  .type .tt{font-weight:700;font-size:15px}
  .type .tj{color:var(--ac);font-size:12px;font-weight:600}
  .type .td{color:var(--tx2);font-size:12.5px;margin-top:3px;line-height:1.5}
  .type .tc{color:var(--tx3);font-size:11.5px;margin-top:6px}
  .wrongbtn{margin-top:14px;width:100%;background:var(--bg2);border:1.5px dashed var(--bd);border-radius:14px;padding:13px;font:inherit;font-size:14.5px;font-weight:600;color:var(--tx2);cursor:pointer}
  .wrongbtn:hover{border-color:var(--ac);color:var(--ac)}

  /* 刷題 */
  .qbar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5}
  .qbar .qt{font-weight:700;font-size:14.5px;flex:1}
  .qbar button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:9px;padding:6px 12px;cursor:pointer}
  .qnum{color:var(--tx3);font-size:13px}
  .qcard{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qstem{font-size:18px;line-height:1.9}
  .qstem u{text-decoration-color:var(--ac);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
  .qhint{color:var(--tx3);font-size:12.5px;margin-top:4px}
  .opts{display:grid;gap:9px;margin-top:16px}
  .opt{font:inherit;text-align:left;font-size:16px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--tx);display:flex;gap:10px;align-items:baseline}
  .opt .no{color:var(--tx3);font-size:13px;font-weight:700;flex-shrink:0}
  .opt:hover{border-color:var(--ac)}
  .opt.correct{border-color:var(--ok);background:rgba(21,128,61,.08)}
  .opt.wrong{border-color:var(--bad);background:rgba(194,65,12,.08)}
  .opt.dim{opacity:.55}
  .opt:disabled{cursor:default}
  .explain{margin-top:16px;border-top:1px solid var(--bd);padding-top:14px;display:none}
  .explain .verdict{font-weight:800;font-size:15px;margin-bottom:6px}
  .explain .verdict.ok{color:var(--ok)} .explain .verdict.ng{color:var(--bad)}
  .explain .xp{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.8}
  .explain .xp b{color:var(--ac)}
  .nextbtn{margin-top:14px;width:100%;background:var(--ac);border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;display:none}
  .nextbtn:hover{background:var(--ac2)}

  /* 結果 */
  .rcard{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;text-align:center}
  .rscore{font-size:44px;font-weight:800;font-family:var(--serif)}
  .rsub{color:var(--tx2);font-size:14px;margin-top:4px}
  .rbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .rbtns button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:10px;padding:10px 18px;cursor:pointer}
  .rbtns .pri{background:var(--ac);color:#fff;border-color:var(--ac)}
  .muted{color:var(--tx3);font-size:12.5px}
  .playbtn{display:block;font:inherit;font-size:15px;font-weight:700;background:var(--soft);color:var(--ac);border:1.5px solid var(--ac);border-radius:12px;padding:10px 18px;cursor:pointer;margin-bottom:12px}
  .playbtn:hover{background:var(--ac);color:#fff}
  .exambtn{margin-top:14px;width:100%;background:var(--ac);border:0;border-radius:14px;padding:15px;font:inherit;font-size:15.5px;font-weight:700;color:#fff;cursor:pointer}
  .exambtn:hover{background:var(--ac2)}
  .exam-set{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:10px;display:none}
  .exam-set.show{display:block}
  .exam-set .row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14.5px}
  .tgl{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  .tgl button{font:inherit;font-size:13.5px;padding:7px 16px;border:0;background:var(--bg);color:var(--tx2);cursor:pointer}
  .tgl button.on{background:var(--ac);color:#fff}
  .timerbar{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--ac)}
  .timerbar.warn{color:var(--bad)}
  .exam-sec{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:6px}
  .rv-q{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
  .rv-q .st{font-size:15.5px;line-height:1.8;margin-bottom:8px}
  .rv-q .st u{text-decoration-color:var(--ac);font-weight:700}
  .rv-q .yours{font-size:13.5px;margin:4px 0}
  .rv-q .yours.ok{color:var(--ok)} .rv-q .yours.ng{color:var(--bad)}
  .rv-q .xp2{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7;margin-top:8px}
  .secline{display:flex;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-top:1px solid var(--bd)}
  .secline .sn{flex:1} .secline .ss{font-weight:700;font-variant-numeric:tabular-nums}
  .tc .tbar{display:block;height:4px;background:var(--bg3);border-radius:4px;margin-top:5px;overflow:hidden}
  .tc .tbar i{display:block;height:100%;background:var(--ac);border-radius:4px}
  .rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .rec-cell{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
  .rec-cell b{font-size:16px;color:var(--ac)} .rec-cell span{font-size:12.5px;color:var(--tx2)}
  .hist-row{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;margin-bottom:7px;font-size:13.5px}
  .hist-row .hd2{color:var(--tx3);font-size:12px;width:74px;flex-shrink:0}
  .hist-row .hl{font-weight:800;color:var(--ac);width:34px;flex-shrink:0}
  .hist-row .ht{flex:1;color:var(--tx2)}
  .hist-row .hs{font-weight:700;font-variant-numeric:tabular-nums}
  footer{padding:30px 0;text-align:center;color:var(--tx3);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="app.html">‹ 返回</a>
    <span class="logo">日本再留計劃</span>
    <span class="sp"></span>
  </header>

  <!-- 選單畫面 -->
  <div id="home">
    <div class="hero">
      <h1>🎯 JLPT 刷題特區</h1>
      <p class="lead">照 JLPT 真題題型出題,每一題都有完整詳解——不只告訴你對錯,還講清楚錯的選項錯在哪。答錯自動進錯題本。</p>
    </div>
    <div class="lvtabs" id="lvtabs" style="min-height:42px"></div>
    <div class="types" id="types"><div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 0;color:var(--tx3)">
      <div style="width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:jdspin .8s linear infinite"></div>
      <div style="font-size:13px">題庫載入中…</div>
    </div></div>
    <style>@keyframes jdspin{to{transform:rotate(360deg)}}</style>
    <button class="wrongbtn" id="wrongBtn" onclick="startWrong()">📕 錯題本 — 重刷答錯的題(<span id="wrongCount">0</span>)</button>
    <button class="wrongbtn" id="recBtn" onclick="showRecords()" style="display:none">📊 刷題紀錄 — 做過哪些題、正答率、場次歷史</button>
    <button class="exambtn" onclick="toggleExamSet()">📝 模擬試験 — 各題型組一份完整考卷</button>
    <div class="exam-set" id="examSet">
      <div class="row"><span>計時模式</span>
        <span class="tgl"><button id="tgOn" class="on" onclick="setTimed(true)">⏱ 計時</button><button id="tgOff" onclick="setTimed(false)">不計時</button></span>
        <span class="muted" id="examTimeNote"></span>
      </div>
      <div class="row muted" id="examCompNote" style="margin-bottom:12px"></div>
      <button class="exambtn" style="margin-top:0" onclick="startExam()">開始 <span id="examLvLabel"></span> 模擬試験</button>
    </div>
    <p class="muted" style="margin-top:14px">題庫持續增加中。發現任何題目有疑義,請用<a href="contact.html" style="color:var(--ac)">意見回饋</a>告訴我們,查證後立即修正。</p>
  </div>

  <!-- 刷題畫面 -->
  <div id="drill" style="display:none">
    <div class="qbar">
      <span class="qt" id="drillTitle"></span>
      <span class="qnum" id="qnum"></span>
      <button onclick="quitDrill()">結束</button>
    </div>
    <div class="qcard">
      <div class="qstem" id="qstem"></div>
      <div class="qhint" id="qhint"></div>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain">
        <div class="verdict" id="verdict"></div>
        <div class="xp" id="xp"></div>
      </div>
    </div>
    <button class="nextbtn" id="nextBtn" onclick="nextQ()">下一題 →</button>
  </div>

  <!-- 模擬考畫面 -->
  <div id="exam" style="display:none">
    <div class="qbar">
      <span class="qt" id="examTitle"></span>
      <span class="timerbar" id="examTimer"></span>
      <span class="qnum" id="examNum"></span>
      <button onclick="confirmQuitExam()">交卷</button>
    </div>
    <div class="qcard">
      <div class="exam-sec" id="examSec"></div>
      <div class="qstem" id="examStem"></div>
      <div class="qhint" id="examHint"></div>
      <div class="opts" id="examOpts"></div>
    </div>
  </div>

  <!-- 模擬考成績畫面 -->
  <div id="examResult" style="display:none">
    <div class="qbar">
      <span class="qt">📝 模擬試験 結果</span>
      <button onclick="backHome()">回選單</button>
    </div>
    <div class="rcard" style="margin-bottom:16px">
      <div class="rscore" id="exScore"></div>
      <div class="rsub" id="exSub"></div>
      <div id="exSecs" style="margin-top:14px;text-align:left"></div>
    </div>
    <h3 style="font-size:15px;margin:0 0 10px">逐題回顧(含詳解)</h3>
    <div id="exReview"></div>
  </div>

  <!-- 刷題紀錄畫面 -->
  <div id="records" style="display:none">
    <div class="qbar">
      <span class="qt">📊 刷題紀錄</span>
      <button onclick="backHome()">返回</button>
    </div>
    <div id="recBody"></div>
  </div>

  <!-- 結果畫面 -->
  <div id="result" style="display:none">
    <div class="rcard">
      <div class="rscore" id="rscore"></div>
      <div class="rsub" id="rsub"></div>
      <div class="rbtns">
        <button class="pri" onclick="retrySame()">再刷一輪</button>
        <button onclick="backHome()">回題型選單</button>
      </div>
    </div>
  </div>

  <footer>日本再留計劃 (StayJP) · <a href="jlpt.html" style="color:var(--tx2)">JLPT 指南</a> · <a href="app.html" style="color:var(--tx2)">學習工具</a></footer>
</div>

<script src="jlpt-questions.js"></script>
<script src="jlpt-questions-gen.js"></script>
<script src="audio/tts/manifest.js" async></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ========== JLPT 刷題特區 ==========
// 題庫在 jlpt-questions.js(window.JLPT_Q):精編靜態題,每題附詳解。

// ── 付費牆(2026-08 定案):免費=刷題每日 1 輪+模擬考總共 2 次;Premium/買斷=無限 ──
// 題庫零成本,牆是為了轉換 → 前端 localStorage 計數即可(被清掉繞過可接受)。
// Premium 判斷同 tool-quota.js:users/{uid}.subscription + App 原生 STAYJP_NATIVE.isPremium。
const JD_ADMIN = ['stayjpplan@gmail.com','abc83327@gmail.com'];
let jdPremium = false, jdAdmin = false;
(function initAuth(){
  try{
    const cfg = { apiKey:"AIzaSyDnmg2XOuvwgE8m8xCF5sS4o0nQYoUplPI", authDomain:"jpnote-1bdd6.firebaseapp.com", projectId:"jpnote-1bdd6" };
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(u=>{
      jdAdmin = !!(u && JD_ADMIN.includes((u.email||'').toLowerCase()));
      if(!u){ jdPremium=false; return; }
      firebase.firestore().doc('users/'+u.uid).get().then(s=>{
        const sub=(s.data()||{}).subscription;
        jdPremium = !!(sub && (sub.status==='active'||sub.status==='trialing'||sub.status==='cancelled') && (sub.expiresAt||0)>Date.now());
      }).catch(()=>{});
    });
  }catch(e){}
})();
function jdUnlimited(){
  if(jdPremium || jdAdmin) return true;
  if(window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp && window.STAYJP_NATIVE.isPremium) return true;
  return false;
}
function jdGateDrill(){   // 免費:每日 1 輪(錯題本不算)
  if(jdUnlimited()) return false;
  const k='jd_day_'+today();
  const n=parseInt(localStorage.getItem(k)||'0',10);
  if(n>=1){ showGateCard('今天的免費刷題(1 輪 20 題)用完了','升級 Premium 無限刷題,錯題本、模擬試験也全部解鎖。'); return true; }
  localStorage.setItem(k, String(n+1));
  return false;
}
function jdGateExam(){    // 免費:模擬試験總共 2 次
  if(jdUnlimited()) return false;
  const n=parseInt(localStorage.getItem('jd_exam_used')||'0',10);
  if(n>=2){ showGateCard('免費體驗的 2 次模擬試験用完了','升級 Premium 無限次模擬考,每次都有 180 分制分析與弱點報告。'); return true; }
  localStorage.setItem('jd_exam_used', String(n+1));
  return false;
}
function showGateCard(title, body){
  const el=document.createElement('div');
  el.id='gateCard';
  el.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900" onclick="document.getElementById(\'gateCard\').remove()"></div>'+
    '<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:901;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:340px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">'+
    '<div style="font-size:34px;margin-bottom:8px">🔒</div>'+
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px">'+title+'</div>'+
    '<div style="font-size:13.5px;color:var(--tx2);line-height:1.7;margin-bottom:16px">'+body+'</div>'+
    '<a href="pricing.html" style="display:block;background:var(--ac);color:#fff;border-radius:12px;padding:12px;font-weight:700;text-decoration:none">看訂閱方案 →</a>'+
    '<button onclick="document.getElementById(\'gateCard\').remove()" style="font:inherit;background:none;border:0;color:var(--tx3);margin-top:10px;cursor:pointer;font-size:13px">先不用</button></div>';
  document.body.appendChild(el);
}
const TYPES = [
  { k:'kanji',   tt:'漢字讀音', tj:'漢字読み',   td:'選出底線漢字的正確讀音' },
  { k:'hyoki',   tt:'漢字表記', tj:'表記',       td:'選出假名對應的正確漢字' },
  { k:'context', tt:'語彙填空', tj:'文脈規定',   td:'選出最適合放進(　)的詞' },
  { k:'para',    tt:'近義替換', tj:'言い換え類義', td:'選出意思最接近的說法' },
  { k:'grammar', tt:'文法形式', tj:'文法形式の判断', td:'選出文法上正確的說法' },
  { k:'order',   tt:'句子重組', tj:'文の組み立て', td:'選出放在 ★ 位置的詞' },
  { k:'reading', tt:'読解・短文', tj:'内容理解', td:'讀短文,選出正確答案' },
  { k:'listening', tt:'聴解', tj:'聴解', td:'聽音檔,選出正確答案' },
];
const LEVELS = ['n5','n4','n3','n2','n1'];
let lv = localStorage.getItem('jd_lv') || 'n5';
let queue = [], qi = 0, score = 0, curType = null, isWrongMode = false;
const WKEY = 'jd_wrong';   // 錯題本:{id:true}

function bank(){ return (window.JLPT_Q||[]).concat(window.JLPT_Q_GEN||[]); }
function getWrong(){ try{ return JSON.parse(localStorage.getItem(WKEY))||{}; }catch(e){ return {}; } }
function saveWrong(w){ localStorage.setItem(WKEY, JSON.stringify(w)); }
// ── 刷題紀錄:每題做過幾次/對幾次 + 場次歷史 ──
const RKEY='jd_rec', HKEY='jd_hist';
function getRec(){ try{ return JSON.parse(localStorage.getItem(RKEY))||{}; }catch(e){ return {}; } }
function saveRec(r){ localStorage.setItem(RKEY, JSON.stringify(r)); }
function getHist(){ try{ return JSON.parse(localStorage.getItem(HKEY))||[]; }catch(e){ return []; } }
function pushHist(h){ const a=getHist(); a.unshift(h); localStorage.setItem(HKEY, JSON.stringify(a.slice(0,100))); }
function today(){ const d=new Date(); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// 題幹裡用【】標的目標詞 → 底線強調
function stem(q){ return esc(q.q).replace(/【(.+?)】/g,'<u>$1</u>').replace(/\(\s*\)/g,'(　　)').replace(/\n/g,'<br>'); }
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

function show(id){ ['home','drill','result','records','exam','examResult'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none'); window.scrollTo(0,0); }

function renderHome(){
  document.getElementById('lvtabs').innerHTML = LEVELS.map(l=>
    `<div class="lvtab${l===lv?' on':''}" onclick="pickLv('${l}')">${l.toUpperCase()}</div>`).join('');
  const rec = getRec();
  const counts = {}, doneC = {};
  bank().forEach(q=>{ if(q.lv===lv){ counts[q.t]=(counts[q.t]||0)+1; if(rec[q.id]) doneC[q.t]=(doneC[q.t]||0)+1; } });
  document.getElementById('types').innerHTML = TYPES.map(t=>{
    const n = counts[t.k]||0;
    if(!n) return '';
    const d = doneC[t.k]||0;
    return `<div class="type" onclick="startDrill('${t.k}')"><div class="tj">${t.tj}</div><div class="tt">${t.tt}</div><div class="td">${t.td}</div><div class="tc">已做 ${d} / ${n} 題${d?`<span class="tbar"><i style="width:${Math.round(d/n*100)}%"></i></span>`:''}</div></div>`;
  }).join('');
  const w = Object.keys(getWrong()).length;
  document.getElementById('wrongCount').textContent = w;
  document.getElementById('wrongBtn').style.display = w? 'block':'none';
  document.getElementById('recBtn').style.display = Object.keys(rec).length? 'block':'none';
}
// ── 刷題紀錄畫面 ──
function showRecords(){
  const rec = getRec(); const hist = getHist();
  // 各級統計:已做 / 總題 / 正答率
  const per = {};
  bank().forEach(q=>{ per[q.lv]=per[q.lv]||{tot:0,done:0,n:0,c:0}; per[q.lv].tot++;
    const e=rec[q.id]; if(e){ per[q.lv].done++; per[q.lv].n+=e.n; per[q.lv].c+=e.c; } });
  let html = '<div class="rec-grid">'+LEVELS.map(l=>{
    const p=per[l]||{tot:0,done:0,n:0,c:0};
    const acc = p.n? Math.round(p.c/p.n*100):0;
    return `<div class="rec-cell"><b>${l.toUpperCase()}</b><span>${p.done} / ${p.tot} 題</span><span>${p.n?('正答率 '+acc+'%'):'—'}</span></div>`;
  }).join('')+'</div>';
  html += '<h3 style="font-size:15px;margin:18px 0 8px">最近場次</h3>';
  html += hist.length? hist.slice(0,30).map(h=>
    `<div class="hist-row"><span class="hd2">${h.d}</span><span class="hl">${h.lv==='wrong'?'📕':h.lv.toUpperCase()}</span><span class="ht">${esc(h.t)}</span><span class="hs">${h.s} / ${h.tot}</span></div>`).join('')
    : '<div class="muted">還沒有紀錄,先刷一輪吧!</div>';
  document.getElementById('recBody').innerHTML = html;
  show('records');
}
function pickLv(l){ lv=l; localStorage.setItem('jd_lv',l); renderHome(); updateExamNotes(); }

function startDrill(tk){
  if(jdGateDrill()) return;
  curType = TYPES.find(t=>t.k===tk); isWrongMode=false;
  // 沒做過的優先出,做過的排後面(各自組內亂序);一輪 20 題,刷得動也記得住
  const rec = getRec();
  const all = bank().filter(q=>q.lv===lv && q.t===tk);
  const fresh = shuffle(all.filter(q=>!rec[q.id]));
  const done  = shuffle(all.filter(q=>rec[q.id]));
  queue = fresh.concat(done).slice(0, 20);
  if(!queue.length) return;
  qi=0; score=0;
  document.getElementById('drillTitle').textContent = lv.toUpperCase()+' · '+curType.tt;
  show('drill'); renderQ();
}
function startWrong(){
  if(!jdUnlimited()){ showGateCard('錯題本重刷是 Premium 功能','你答錯的 '+Object.keys(getWrong()).length+' 題都幫你收好了——升級後一鍵重刷,補到全對。'); return; }
  const w = getWrong(); isWrongMode=true; curType=null;
  queue = shuffle(bank().filter(q=>w[q.id]));
  if(!queue.length) return;
  qi=0; score=0;
  document.getElementById('drillTitle').textContent = '📕 錯題本';
  show('drill'); renderQ();
}
// 聴解播放:__TTS[at] → mp3;新題自動停掉上一題的聲音
let _au=null;
function playAu(){
  const q = queue[qi]; if(!q || !q.at) return;
  try{ if(_au){ _au.pause(); _au=null; } }catch(e){}
  const hash = window.__TTS && window.__TTS[q.at];
  if(hash){ _au = new Audio('audio/tts/'+hash+'.mp3'); _au.play().catch(()=>{}); }
}
function stopAu(){ try{ if(_au){ _au.pause(); _au=null; } }catch(e){} }
function renderQ(){
  const q = queue[qi];
  stopAu();
  document.getElementById('qnum').textContent = (qi+1)+' / '+queue.length;
  // 聴解:題面只有問題+播放鈕,不顯示原文(答完才在詳解看 script)
  document.getElementById('qstem').innerHTML =
    (q.t==='listening' ? '<button class="playbtn" onclick="playAu()">▶ 音声を聞く</button>' : '') + stem(q);
  document.getElementById('qhint').textContent = q.h || (q.t==='listening' ? '可以重複播放' : '');
  // 選項固定亂序,但記住正確答案文字
  const opts = shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
  document.getElementById('opts').innerHTML = opts.map((o,i)=>
    `<button class="opt" data-ok="${o.ok?1:0}" onclick="answer(this,${o.ok?1:0})"><span class="no">${i+1}</span><span>${esc(o.t)}</span></button>`).join('');
  document.getElementById('explain').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  if(q.t==='listening') playAu();   // 進題自動播一次
}
// 漢字題答完自動播單詞讀音(對錯都播,字+聲加深印象)。
// 漢字読み:正解選項就是讀音;表記:讀音在題幹【】裡。manifest 有 mp3 才播(單字庫讀音幾乎全涵蓋)。
function sayWordAudio(q){
  let kana = null;
  if(q.t==='kanji') kana = q.o[q.a];
  else if(q.t==='hyoki'){ const m = q.q.match(/【(.+?)】/); kana = m && m[1]; }
  if(!kana) return;
  const hash = window.__TTS && window.__TTS[kana];
  if(!hash) return;
  try{ if(_au){ _au.pause(); _au=null; } }catch(e){}
  _au = new Audio('audio/tts/'+hash+'.mp3'); _au.play().catch(()=>{});
}
function answer(el, ok){
  const q = queue[qi];
  sayWordAudio(q);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.getAttribute('data-ok')==='1') b.classList.add('correct'); else b.classList.add('dim');
  });
  if(!ok){ el.classList.remove('dim'); el.classList.add('wrong'); }
  const w = getWrong();
  if(ok){ score++; if(isWrongMode){ delete w[q.id]; saveWrong(w);} }
  else { w[q.id]=true; saveWrong(w); }
  // 每題紀錄:做過幾次 n、對幾次 c、最後日期
  const rec = getRec(); const e = rec[q.id]||{n:0,c:0};
  e.n++; if(ok) e.c++; e.last=today(); rec[q.id]=e; saveRec(rec);
  const v = document.getElementById('verdict');
  v.textContent = ok? '✅ 答對了!':'❌ 答錯了';
  v.className = 'verdict '+(ok?'ok':'ng');
  // 詳解(題庫內含 <b> 標記,自行控管內容安全);聴解附上音檔原文
  document.getElementById('xp').innerHTML =
    (q.au ? '<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bd)"><b>スクリプト:</b>'+esc(q.au)+'</div>' : '') + q.x;
  document.getElementById('explain').style.display='block';
  document.getElementById('nextBtn').style.display='block';
  document.getElementById('nextBtn').textContent = qi<queue.length-1? '下一題 →':'看結果';
}
function nextQ(){
  if(qi<queue.length-1){ qi++; renderQ(); window.scrollTo(0,0); }
  else finish();
}
function finish(){
  const pct = Math.round(score/queue.length*100);
  document.getElementById('rscore').textContent = score+' / '+queue.length;
  document.getElementById('rsub').textContent = pct>=80? '很穩!繼續保持 💪':(pct>=60? '不錯,錯題本再刷一輪就熟了':'先看詳解弄懂,錯題本等你 📕');
  pushHist({ d:today(), lv:isWrongMode?'wrong':lv, t:isWrongMode?'錯題本':(curType?curType.tt:''), s:score, tot:queue.length });
  show('result');
}
function retrySame(){ if(isWrongMode) startWrong(); else if(curType) startDrill(curType.k); }
function quitDrill(){ backHome(); }
function backHome(){ stopExamTimer(); stopAu(); renderHome(); show('home'); }

// ═══════════ 模擬試験 ═══════════
// 組卷公式:照真題比例每題型抽 N 題;每題配秒算總時限。狀態全集中在 EX,結束必清 timer。
// 照真題結構分四部;比例仿真題(文字語彙最多題、文法次之、読解聴解受題庫限)
const EXAM_COMP = [ ['kanji',6],['hyoki',5],['context',5],['para',4],['grammar',5],['order',3],['reading',4],['listening',4] ];
const SEC_TIME = { kanji:45, hyoki:45, context:45, para:45, grammar:60, order:60, reading:150, listening:60 };
// 真題分部(過場卡用);計分歸科:LK=言語知識、RD=読解、LS=聴解
const EXAM_PARTS = [
  { name:'第1部 言語知識(文字・語彙)', types:['kanji','hyoki','context','para'] },
  { name:'第2部 言語知識(文法)',       types:['grammar','order'] },
  { name:'第3部 読解',                  types:['reading'] },
  { name:'第4部 聴解',                  types:['listening'] },
];
const SCORE_CAT = { kanji:'LK',hyoki:'LK',context:'LK',para:'LK',grammar:'LK',order:'LK',reading:'RD',listening:'LS' };
// 官方合格線:總分(180 滿分)+各科最低門檻。N5/N4 官方是「言語知識・読解」合併 120 分制。
const PASS = { n5:{total:80},n4:{total:90},n3:{total:95},n2:{total:90},n1:{total:100} };
let EX = null;          // {qs:[{q,pick(亂序後選項),ans(使用者選的索引|null)}], idx, timed, endAt, timer}
let examTimed = true;

function examComp(){  // 依當前級別實際庫存夾住抽題數
  const byType = {};
  bank().forEach(q=>{ if(q.lv===lv){ (byType[q.t]=byType[q.t]||[]).push(q); } });
  return EXAM_COMP.map(([t,n])=>[t, Math.min(n, (byType[t]||[]).length)]).filter(([,n])=>n>0);
}
function examSeconds(comp){ return comp.reduce((s,[t,n])=>s+n*(SEC_TIME[t]||60),0); }
function toggleExamSet(){
  const el=document.getElementById('examSet'); el.classList.toggle('show');
  updateExamNotes();
}
function setTimed(b){ examTimed=b;
  document.getElementById('tgOn').classList.toggle('on',b);
  document.getElementById('tgOff').classList.toggle('on',!b);
  updateExamNotes();
}
function updateExamNotes(){
  const comp = examComp();
  const total = comp.reduce((s,[,n])=>s+n,0);
  const mins = Math.ceil(examSeconds(comp)/60);
  document.getElementById('examLvLabel').textContent = lv.toUpperCase();
  document.getElementById('examTimeNote').textContent = examTimed? '時限 '+mins+' 分,時間到自動交卷':'不限時';
  document.getElementById('examCompNote').textContent = '共 '+total+' 題:'+comp.map(([t,n])=>TYPES.find(x=>x.k===t).tt+'×'+n).join('、');
}
function startExam(){
  if(jdGateExam()) return;
  stopExamTimer(); stopAu();
  const byType = {};
  bank().forEach(q=>{ if(q.lv===lv){ (byType[q.t]=byType[q.t]||[]).push(q); } });
  const rec = getRec();
  const picked = {};   // type -> [{q,pick,ans}]
  for(const [t,n] of examComp()){
    // 沒做過的優先,再抽做過的補滿
    const fresh = shuffle((byType[t]||[]).filter(q=>!rec[q.id]));
    const done  = shuffle((byType[t]||[]).filter(q=>rec[q.id]));
    picked[t] = fresh.concat(done).slice(0,n).map(q=>({ q, pick: shuffle(q.o.map((txt,i)=>({txt,ok:i===q.a}))), ans:null }));
  }
  // 照真題分部排:每部開頭插過場卡(不算題),部內題目照題型順序
  const qs = []; const flow = [];
  for(const part of EXAM_PARTS){
    const items = part.types.flatMap(t=>picked[t]||[]);
    if(!items.length) continue;
    flow.push({ part: part.name, count: items.length });
    for(const it of items){ flow.push(it); qs.push(it); }
  }
  if(!qs.length) return;
  const secs = examSeconds(examComp());
  EX = { qs, flow, idx:0, timed:examTimed, endAt: examTimed? Date.now()+secs*1000 : 0, timer:null };
  if(examTimed){
    EX.timer = setInterval(tickExam, 500);
  }
  document.getElementById('examTitle').textContent = lv.toUpperCase()+' 模擬試験';
  show('exam'); renderExamQ(); tickExam();
}
function tickExam(){
  if(!EX) return;
  const el = document.getElementById('examTimer');
  if(!EX.timed){ el.textContent='∞'; el.classList.remove('warn'); return; }
  const left = Math.max(0, EX.endAt - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.textContent = m+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn', left < 60000);
  if(left <= 0){ finishExam(true); }
}
function stopExamTimer(){ if(EX && EX.timer){ clearInterval(EX.timer); EX.timer=null; } }
function renderExamQ(){
  if(!EX) return;
  stopAu();
  const node = EX.flow[EX.idx];
  // 過場卡:第◯部開頭(不算題)
  if(node.part){
    document.getElementById('examNum').textContent = '';
    document.getElementById('examSec').textContent = '';
    document.getElementById('examStem').innerHTML =
      '<div style="text-align:center;padding:14px 0"><div style="font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:6px">'+esc(node.part)+'</div>'+
      '<div class="muted">'+node.count+' 題'+(node.part.includes('聴解')?' · 真題聽力只播一次,盡量一次聽懂':'')+'</div></div>';
    document.getElementById('examHint').textContent = '';
    document.getElementById('examOpts').innerHTML = '<button class="opt" onclick="examNext()" style="justify-content:center;font-weight:700;color:var(--ac)">開始 →</button>';
    return;
  }
  const item = node, q = item.q;
  const ty = TYPES.find(t=>t.k===q.t);
  const qNo = EX.qs.indexOf(item)+1;
  document.getElementById('examNum').textContent = qNo+' / '+EX.qs.length;
  document.getElementById('examSec').textContent = ty? (ty.tj+' · '+ty.tt):'';
  document.getElementById('examStem').innerHTML =
    (q.t==='listening' ? '<button class="playbtn" onclick="playExamAu()">▶ もう一度聞く(真題只播一次)</button>' : '') + stem(q);
  document.getElementById('examHint').textContent = q.h || '';
  document.getElementById('examOpts').innerHTML = item.pick.map((o,i)=>
    `<button class="opt" onclick="examAnswer(${i})"><span class="no">${i+1}</span><span>${esc(o.txt)}</span></button>`).join('');
  if(q.t==='listening') playExamAu();
}
function examNext(){
  if(!EX) return;
  if(EX.idx < EX.flow.length-1){ EX.idx++; renderExamQ(); window.scrollTo(0,0); }
  else finishExam(false);
}
function playExamAu(){
  if(!EX) return;
  const node = EX.flow[EX.idx]; if(node.part || !node.q.at) return;
  try{ if(_au){ _au.pause(); _au=null; } }catch(e){}
  const hash = window.__TTS && window.__TTS[node.q.at];
  if(hash){ _au = new Audio('audio/tts/'+hash+'.mp3'); _au.play().catch(()=>{}); }
}
function examAnswer(i){
  if(!EX) return;
  const node = EX.flow[EX.idx];
  if(node.part || node.ans!==null) return;   // 過場卡不作答;防重複作答
  node.ans = i;
  examNext();   // 依 flow 前進(最後一題→交卷)
}
function confirmQuitExam(){
  if(!EX) return;
  const un = EX.qs.filter(x=>x.ans===null).length;
  if(un>0 && !confirm('還有 '+un+' 題未作答,未答以 0 分計。確定交卷?')) return;
  finishExam(false);
}
function finishExam(timeout){
  if(!EX) return;
  stopExamTimer(); stopAu();
  const qs = EX.qs; EX = null;   // 先斷狀態,絕不重入
  // 計分 + 寫入每題紀錄/錯題本
  const rec = getRec(), w = getWrong();
  let score = 0; const secStat = {};
  for(const item of qs){
    const ok = item.ans!==null && item.pick[item.ans].ok;
    if(ok) score++;
    const t = item.q.t;
    secStat[t] = secStat[t]||{c:0,n:0}; secStat[t].n++; if(ok) secStat[t].c++;
    const e = rec[item.q.id]||{n:0,c:0}; e.n++; if(ok)e.c++; e.last=today(); rec[item.q.id]=e;
    if(!ok) w[item.q.id]=true; else if(w[item.q.id]) { /* 模擬考答對不移出錯題本,留給錯題本模式清 */ }
  }
  saveRec(rec); saveWrong(w);
  pushHist({ d:today(), lv, t:'📝 模擬試験'+(timeout?'(時間到)':''), s:score, tot:qs.length });
  // ── JLPT 換算分析 ──────────────────────────
  // 依官方計分結構換算 180 分制:N3–N1 三科各 60(言語知識/読解/聴解,科別門檻 19);
  // N5/N4 官方是「言語知識・読解」合併 120(門檻 38)+ 聴解 60(門檻 19)。
  const cat = { LK:{c:0,n:0}, RD:{c:0,n:0}, LS:{c:0,n:0} };
  for(const [t,s] of Object.entries(secStat)){ const c=SCORE_CAT[t]; cat[c].c+=s.c; cat[c].n+=s.n; }
  const rate = x=> x.n? x.c/x.n : 0;
  const twoSection = (lv==='n5'||lv==='n4');
  let scaled=[], total=0;
  if(twoSection){
    const lkrd = { c:cat.LK.c+cat.RD.c, n:cat.LK.n+cat.RD.n };
    scaled = [
      { name:'言語知識・読解', got: Math.round(rate(lkrd)*120), max:120, min:38 },
      { name:'聴解',           got: Math.round(rate(cat.LS)*60), max:60,  min:19 },
    ];
  } else {
    scaled = [
      { name:'言語知識(文字・語彙・文法)', got: Math.round(rate(cat.LK)*60), max:60, min:19 },
      { name:'読解', got: Math.round(rate(cat.RD)*60), max:60, min:19 },
      { name:'聴解', got: Math.round(rate(cat.LS)*60), max:60, min:19 },
    ];
  }
  total = scaled.reduce((s,x)=>s+x.got,0);
  const passLine = PASS[lv].total;
  const allSecOk = scaled.every(x=>x.got>=x.min);
  const passed = total>=passLine && allSecOk;
  const verdict = passed? '🎉 合格圏!照官方標準這個成績會過'
    : (total>=passLine? '⚠️ 總分過線,但有科目低於最低門檻(官方規定單科不到門檻就不合格)'
    : '還差 '+(passLine-total)+' 分到合格線,看下面的弱點各個擊破');
  // 弱點題型(正答率最低的前兩個)+ 對應工具建議
  const ADVICE = { kanji:['多刷「漢字讀音」+單字卡','jlpt-drill.html'], hyoki:['多刷「漢字表記」+單字卡','jlpt-drill.html'],
    context:['刷「語彙填空」+讀單字卡例句','jlpt-drill.html'], para:['刷「近義替換」+易混淆詞比較','compare/index.html'],
    grammar:['刷「文法形式」+文法練習','app.html'], order:['刷「句子重組」抓語順感','jlpt-drill.html'],
    reading:['刷「読解」+每天讀一篇文章閱讀','app.html'], listening:['刷「聴解」+聽力練習跟讀','app.html'] };
  const weak = Object.entries(secStat).map(([t,s])=>({t, r:s.n?s.c/s.n:1, n:s.n}))
    .filter(x=>x.n>0 && x.r<1).sort((a,b)=>a.r-b.r).slice(0,2);
  // ── 畫面 ──
  document.getElementById('exScore').textContent = total+' / 180';
  document.getElementById('exSub').innerHTML =
    (timeout?'⏰ 時間到,自動交卷。<br>':'')+
    '<b>'+verdict+'</b><br><span class="muted">答對 '+score+' / '+qs.length+' 題 · '+lv.toUpperCase()+' 合格線 '+passLine+' 分(依官方比例換算,樣本數少僅供參考)</span>';
  // 免費版:三科分析+弱點打碼(總分照給)——「差幾分、弱哪科」是升級最強理由
  if (!jdUnlimited()) {
    document.getElementById('exSecs').innerHTML =
      '<div style="position:relative">' +
        '<div style="filter:blur(7px);pointer-events:none;user-select:none">' +
          scaled.map(x=>'<div class="secline"><span class="sn">'+x.name+'</span><span class="ss">'+x.got+' / '+x.max+'</span></div>').join('') +
          '<div style="padding:10px 0"><b>📌 弱點分析</b><div class="secline"><span class="sn">●●●●(正答率 ●●%)</span></div><div class="secline"><span class="sn">●●●●(正答率 ●●%)</span></div></div>' +
        '</div>' +
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center">' +
          '<div style="font-weight:800;font-size:15px">你距離合格線還差幾分、弱在哪一科?</div>' +
          '<div style="font-size:13px;color:var(--tx2)">升級 Premium 看三科得分、門檻判定與弱點補強路線</div>' +
          '<a href="pricing.html" style="background:var(--ac);color:#fff;border-radius:12px;padding:11px 22px;font-weight:700;text-decoration:none">解鎖完整分析 →</a>' +
        '</div>' +
      '</div>';
    document.getElementById('exReview').innerHTML = qs.map((item,i)=>{
      const ok = item.ans!==null && item.pick[item.ans].ok;
      const yours = item.ans===null? '(未作答)': item.pick[item.ans].txt;
      const correct = item.q.o[item.q.a];
      return `<div class="rv-q">
        <div class="exam-sec">${i+1}. ${(TYPES.find(x=>x.k===item.q.t)||{}).tt||''}</div>
        <div class="st">${stem(item.q)}</div>
        <div class="yours ${ok?'ok':'ng'}">${ok?'✅':'❌'} 你的答案:${esc(yours)}</div>
        ${ok?'':'<div class="yours ok">⭕ 正解:'+esc(correct)+'</div>'}
        <div class="xp2">${item.q.au?'<b>スクリプト:</b>'+esc(item.q.au)+'<br>':''}${item.q.x}</div>
      </div>`;
    }).join('');
    show('examResult');
    return;
  }
  document.getElementById('exSecs').innerHTML =
    scaled.map(x=>{
      const pc = Math.round(x.got/x.max*100);
      const ok = x.got>=x.min;
      return `<div class="secline"><span class="sn">${x.name} <span class="muted">(門檻 ${x.min})</span></span><span class="ss" style="color:${ok?'var(--ok)':'var(--bad)'}">${x.got} / ${x.max}</span></div>
        <div class="tbar" style="height:6px;margin:2px 0 6px"><i style="width:${pc}%;background:${ok?'var(--ac)':'var(--bad)'}"></i></div>`;
    }).join('')
    + '<div style="margin-top:12px;border-top:1px solid var(--bd);padding-top:10px"><b style="font-size:14px">📌 弱點分析</b>'
    + (weak.length? weak.map(x=>{
        const ty=TYPES.find(y=>y.k===x.t); const ad=ADVICE[x.t];
        return `<div class="secline" style="border:0;padding:5px 0"><span class="sn">${ty?ty.tt:x.t}(正答率 ${Math.round(x.r*100)}%)</span><a href="${ad[1]}" style="color:var(--ac);font-size:13px">${ad[0]} →</a></div>`;
      }).join('') : '<div class="muted" style="padding:5px 0">全部題型都全對,沒有弱點,超穩 💪</div>')
    + '</div>'
    + Object.entries(secStat).map(([t,s])=>{
        const ty=TYPES.find(x=>x.k===t);
        return `<div class="secline"><span class="sn muted">${ty?ty.tt:t}</span><span class="ss muted">${s.c} / ${s.n}</span></div>`;
      }).join('');
  document.getElementById('exReview').innerHTML = qs.map((item,i)=>{
    const ok = item.ans!==null && item.pick[item.ans].ok;
    const yours = item.ans===null? '(未作答)': item.pick[item.ans].txt;
    const correct = item.q.o[item.q.a];
    return `<div class="rv-q">
      <div class="exam-sec">${i+1}. ${(TYPES.find(x=>x.k===item.q.t)||{}).tt||''}</div>
      <div class="st">${stem(item.q)}</div>
      <div class="yours ${ok?'ok':'ng'}">${ok?'✅':'❌'} 你的答案:${esc(yours)}</div>
      ${ok?'':'<div class="yours ok">⭕ 正解:'+esc(correct)+'</div>'}
      <div class="xp2">${item.q.au?'<b>スクリプト:</b>'+esc(item.q.au)+'<br>':''}${item.q.x}</div>
    </div>`;
  }).join('');
  show('examResult');
}

renderHome();
</script>
