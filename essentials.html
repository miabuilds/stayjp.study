  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){ --bg:#161615;--bg2:#211F1D;--bg3:#2A2724;--tx:#EDEBE7;--tx2:#A7A29B;--tx3:#6E6A64;--ac:#E8734A;--ac2:#E8734A;--nav:#8FB0D6;--bd:#332F2B;--ok:#4ade80;--bad:#fb923c;--soft:#E8734A1c; }}

  body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}

  header{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--bd)}   /* 細線分隔 */
  header .back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px 8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);text-decoration:none;font-size:14.5px;font-weight:600;line-height:1;flex-shrink:0}

<script>
// ── i18n shim(照 speak.html):簡中 OpenCC 即時轉換 + 英文 enOr() ──
let _tw2cn=null;
function ensureOpenCC(){ return new Promise(function(res){ if(_tw2cn)return res(_tw2cn); if(window.OpenCC){ _tw2cn=OpenCC.Converter({from:'tw',to:'cn'}); if(I18n.setConverter)I18n.setConverter(_tw2cn); return res(_tw2cn);} var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js'; s.onload=function(){ _tw2cn=OpenCC.Converter({from:'tw',to:'cn'}); if(I18n.setConverter)I18n.setConverter(_tw2cn); res(_tw2cn); }; s.onerror=function(){res(null)}; document.head.appendChild(s); }); }
function cvt(x){ return (!x||I18n.getLang()!=='zh-CN'||!_tw2cn)?x:_tw2cn(x); }
function enOr(zh,en){ return I18n.getLang()==='en'?en:cvt(zh); }
// 本頁翻譯:T(繁中) → EN 查表 / 簡中 cvt / 繁中原樣。日文字串一律不進 T(查不到表就原樣,cvt 只動中文)。
const EN_T = window.ESS.EN_T;
function T(zh){ return I18n.getLang()==='en' ? (EN_T[zh]||zh) : cvt(zh); }
if(I18n.getLang()==='zh-CN') ensureOpenCC();
</script>

<script>
// ── 播放:優先 VOICEVOX(__TTS),否則瀏覽器 TTS ──
let _audio=null;
function speak(t){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(_audio){ try{_audio.pause();}catch(e){} _audio=null; }
  const hash = window.__TTS && window.__TTS[t];
  if(hash){ _audio=new Audio(window.ttsUrl?window.ttsUrl(hash):'audio/tts/'+hash+'.mp3'); _audio.play().catch(()=>browserSpeak(t)); }
  else browserSpeak(t);
}
function browserSpeak(t){
  if(!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.92;
  const jp=speechSynthesis.getVoices().find(v=>/ja|Japanese/i.test(v.lang)); if(jp) u.voice=jp;
  speechSynthesis.speak(u);
}
// 例句資料裡用 <b> 標出要看的助詞 → 必須走 Rich 版(白名單放行 <b>),
// 普通版會把標籤轉義,畫面上就出現字面的 <b>(2026-09-20 使用者截圖回報)。
function fr(t){ try{ return window.furiganaHTMLRich ? window.furiganaHTMLRich(t) : (window.furiganaHTML ? window.furiganaHTML(t) : t); }catch(e){ return t; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 詞格:form=顯示、yomi=假名(也是發音文本);irr=是否標紅
function cell(form, yomi, irr, en){
  // 有替讀(如「よん / し」)只念第一個,避免把斜線也念出來
  const say = esc(String(yomi).split('/')[0].trim());
  // 寫法=讀音(いつ/どこ等疑問詞)就不重複顯示讀音欄
  const showYomi = String(form)!==String(yomi);
  return `<div class="cell" onclick="speak('${say}')"><span class="form">${esc(form)}</span>${showYomi?`<span class="yomi ${irr?'irr':''}">${esc(yomi)}</span>`:''}${en?`<span class="en">${esc(en)}</span>`:''}</div>`;
}

// 資料在 essentials-data.js(window.ESS),總表/小課/音檔收集共用同一份
const { NUM, NUM_CH, COUNTERS, JI, FUN, YOUBI, GATSU, NICHI, KAZOKU, GIMON, JOSHI } = window.ESS;

// ══════════ icon ══════════
function ico(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
const CATS = [
  { k:'num', ic:ico('<path d="M6 8h3v9M14 8h2a2 2 0 0 1 0 4h-2a2 2 0 0 1 2 4h1"/>'), tt:'數字與量詞', en:'Numbers & Counters' },
  { k:'time', ic:ico('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), tt:'時間・日期・曜日', en:'Time / Date / Weekday' },
  { k:'fam', ic:ico('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M15 20a4 4 0 0 1 6 0"/>'), tt:'家族稱謂', en:'Family Terms' },
  { k:'qp', ic:ico('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.6 2.3c-.9.4-1.2.9-1.2 1.8"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor" stroke="none"/>'), tt:'疑問詞・基本助詞', en:'Question Words & Particles' },
];

// ── 同色系扁平插畫(單色赭紅,主題感知;各大類 banner 用)──
const ILLUS = {
  // 算盤:數字與量詞
  num: `<svg viewBox="0 0 124 84" fill="none">
    <rect x="16" y="12" width="92" height="60" rx="9" fill="var(--soft)" stroke="var(--ac)" stroke-width="3"/>
    <line x1="16" y1="30" x2="108" y2="30" stroke="var(--ac)" stroke-width="1.6" opacity=".35"/>
    <line x1="16" y1="45" x2="108" y2="45" stroke="var(--ac)" stroke-width="1.6" opacity=".35"/>
    <line x1="16" y1="60" x2="108" y2="60" stroke="var(--ac)" stroke-width="1.6" opacity=".35"/>
    <circle cx="32" cy="30" r="6.5" fill="var(--ac)"/><circle cx="48" cy="30" r="6.5" fill="var(--ac)" opacity=".55"/><circle cx="90" cy="30" r="6.5" fill="var(--ac)" opacity=".3"/>
    <circle cx="30" cy="45" r="6.5" fill="var(--ac)" opacity=".3"/><circle cx="72" cy="45" r="6.5" fill="var(--ac)"/><circle cx="88" cy="45" r="6.5" fill="var(--ac)" opacity=".55"/>
    <circle cx="36" cy="60" r="6.5" fill="var(--ac)" opacity=".55"/><circle cx="52" cy="60" r="6.5" fill="var(--ac)"/><circle cx="92" cy="60" r="6.5" fill="var(--ac)" opacity=".3"/>
  </svg>`,
  // 時鐘+日曆:時間日期曜日
  time: `<svg viewBox="0 0 124 84" fill="none">
    <rect x="14" y="16" width="48" height="48" rx="8" fill="var(--soft)" stroke="var(--ac)" stroke-width="3"/>
    <line x1="14" y1="30" x2="62" y2="30" stroke="var(--ac)" stroke-width="3"/>
    <line x1="26" y1="12" x2="26" y2="22" stroke="var(--ac)" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="50" y1="12" x2="50" y2="22" stroke="var(--ac)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="30" cy="46" r="2.4" fill="var(--ac)"/><circle cx="42" cy="46" r="2.4" fill="var(--ac)" opacity=".5"/><circle cx="30" cy="56" r="2.4" fill="var(--ac)" opacity=".5"/>
    <circle cx="86" cy="52" r="25" fill="var(--bg2)" stroke="var(--ac)" stroke-width="3.4"/>
    <line x1="86" y1="52" x2="86" y2="37" stroke="var(--ac)" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="86" y1="52" x2="98" y2="57" stroke="var(--ac)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="86" cy="52" r="3" fill="var(--ac)"/>
  </svg>`,
  // 三個人形:家族
  fam: `<svg viewBox="0 0 124 84" fill="none">
    <circle cx="40" cy="30" r="12" fill="var(--ac)"/>
    <path d="M22 72a18 18 0 0 1 36 0z" fill="var(--ac)"/>
    <circle cx="86" cy="32" r="11" fill="var(--ac)" opacity=".55"/>
    <path d="M70 72a16 16 0 0 1 32 0z" fill="var(--ac)" opacity=".55"/>
    <circle cx="63" cy="48" r="8.5" fill="var(--ac)" opacity=".8"/>
    <path d="M51 72a12 12 0 0 1 24 0z" fill="var(--ac)" opacity=".8"/>
  </svg>`,
  // 對話泡泡+問號:疑問詞・助詞
  qp: `<svg viewBox="0 0 124 84" fill="none">
    <path d="M20 14h48a11 11 0 0 1 11 11v16a11 11 0 0 1-11 11H42l-13 11 3-11a11 11 0 0 1-12-11V25a11 11 0 0 1 11-11z" fill="var(--soft)" stroke="var(--ac)" stroke-width="3"/>
    <text x="45" y="42" font-size="26" font-weight="800" fill="var(--ac)" text-anchor="middle" font-family="serif">?</text>
    <path d="M78 40h26a9 9 0 0 1 9 9v11a9 9 0 0 1-9 9h-4l3 10-11-10H78a9 9 0 0 1-9-9V49a9 9 0 0 1 9-9z" fill="var(--ac)"/>
    <circle cx="83" cy="55" r="2.6" fill="#fff"/><circle cx="93" cy="55" r="2.6" fill="#fff"/><circle cx="103" cy="55" r="2.6" fill="#fff"/>
  </svg>`,
};
function catBanner(c, illus){
  const en = I18n.getLang()==='en';
  return `<div class="cat-banner"><div class="cb-txt"><div class="cat-tt">${en?c.en:cvt(c.tt)}<small>${en?'':c.en}</small></div></div><div class="cb-illus">${illus}</div></div>`;
}

function grid(rows, cls){ return `<div class="grid ${cls||'g5'}">`+rows.map(r=>cell(r[0], r[1], r[2], r[3] ? T(r[3]) : r[3])).join('')+`</div>`; }

function render(){
  document.getElementById('toc').innerHTML = CATS.map(c=>`<a href="#${c.k}">${I18n.getLang()==='en'?c.en:cvt(c.tt)}</a>`).join('');
  let h='';
  // 1) 數字與量詞
  h+=`<section class="cat" id="num">`+catBanner(CATS[0], ILLUS.num);
  h+=`<div class="sub">${T('基本數字')} <small>${T('0〜億')}</small></div><div class="tip">${T('<b>4・7・9</b> 各有兩種念法(4時よじ、4月しがつ、4個よんこ)。')}</div>`+grid(NUM);
  h+=`<div class="sub">${T('百・千 的變音')} <small>${T('要特別記')}</small></div>`+grid(NUM_CH);
  COUNTERS.forEach(c=>{ h+=`<div class="sub">${esc(T(c.t))} <small>${esc(T(c.d))}</small></div>`+grid(c.rows); });
  h+=`</section>`;
  // 2) 時間日期曜日
  h+=`<section class="cat" id="time">`+catBanner(CATS[1], ILLUS.time);
  h+=`<div class="sub">〜時 <small>${T('幾點')}</small></div><div class="tip">${T('注意 <b>4時よじ・7時しちじ・9時くじ</b>。')}</div>`+grid(JI);
  h+=`<div class="sub">〜分 <small>${T('幾分')}</small></div><div class="tip">${T('ぷん / ふん 交替,半 = 30分。')}</div>`+grid(FUN);
  h+=`<div class="sub">曜日 <small>${T('星期')}</small></div>`+grid(YOUBI);
  h+=`<div class="sub">〜月 <small>${T('月份')}</small></div><div class="tip">${T('<b>4月しがつ・7月しちがつ・9月くがつ</b>(和「時」的念法不同!)。')}</div>`+grid(GATSU);
  h+=`<div class="sub">〜日 <small>${T('日期')}</small></div><div class="tip">${T('1〜10 日、14/20/24 日 全是<b>不規則</b>和語念法,直接背。')}</div>`+grid(NICHI);
  h+=`</section>`;
  // 3) 家族
  h+=`<section class="cat" id="fam">`+catBanner(CATS[2], ILLUS.fam);
  h+=`<div class="tip">${T('左=<b>講自己家人</b>(謙稱)、右=<b>稱呼別人家人</b>(敬稱)。點任一邊聽發音。')}</div>`;
  h+=`<div class="grid g2">`+KAZOKU.map(k=>`<div class="row2">
      <div class="a" onclick="speak('${esc(k[1])}')"><span class="f">${esc(k[0])}</span><span class="y">${esc(k[1])}</span></div>
      <span class="arrow">→</span>
      <div class="a" onclick="speak('${esc(k[3])}')"><span class="f">${esc(k[2])}</span><span class="y">${esc(k[3])}</span></div>
      <span class="z">${esc(T(k[4]))}</span></div>`).join('')+`</div>`;
  h+=`</section>`;
  // 4) 疑問詞・助詞
  h+=`<section class="cat" id="qp">`+catBanner(CATS[3], ILLUS.qp);
  h+=`<div class="sub">${T('疑問詞')} <small>${T('問句必備')}</small></div>`+grid(GIMON, 'g3');
  h+=`<div class="sub">${T('基本助詞')} <small>${T('句子的關節')}</small></div><div class="tip">${T('<b>は</b>讀「わ」、<b>へ</b>讀「え」、<b>を</b>讀「お」——寫法和讀音不同,先記住。')}</div>`;
  h+=JOSHI.map(j=>`<div class="ptc" onclick="speak('${esc(j[4])}')">
      <div class="ph"><span class="p">${esc(j[0])}</span><span class="pu">${T('讀')} ${esc(j[1])}</span></div>
      <div class="pd">${T(j[2])}</div>
      <div class="pe">${fr(j[3])}<div class="z">${esc(T(j[5]))}</div></div></div>`).join('');
  h+=`</section>`;
  document.getElementById('list').innerHTML = h;
}
render();
// ── 靜態區塊 i18n:hero/說明/測驗鈕/底部備註(日文/假名節點不動) ──
function staticI18n(){
  const lang = I18n.getLang();
  if (lang === 'en') {
    const set=(sel,html)=>{ const el=document.querySelector(sel); if(el) el.innerHTML=html; };
    set('.eyebrow','The must-know basics');
    set('.hero h1','Essential Basics');
    set('.lead','The most useful basics from chapter one of any textbook: <b style="color:var(--ac)">numbers & counters, time & dates, family terms, question words & particles</b>. Nail these and drills and conversation get much smoother — tap any word to hear it.');
    set('.howto','<b>How to use:</b> ① tap through once to hear the readings → ② cover the kana and recall → ③ test yourself with the <b>mini quiz</b> below. <b>Red</b> items (4/7/9, sound changes, dates) are the classic traps.');
    set('.quizbtn','Mini quiz · random 10');
    set('.note','<b>Red</b> marks the readings everyone gets wrong: <b>4 (yon/shi) · 7 (nana/shichi) · 9 (kyū/ku)</b>, counter sound changes (<b>hon → bon → pon</b>), and dates like <b>tsuitachi / hatsuka</b>. No rule predicts these — memorizing is fastest.');
    const bk=document.querySelector('.backbtn'); if(bk){ const w=document.createTreeWalker(bk,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(n.nodeValue.includes('返回')) n.nodeValue=n.nodeValue.replace('返回','Back'); } }
  } else if (lang === 'zh-CN' && _tw2cn) {
    // 只轉中文文字節點;含假名的節點(日文說明例)不碰
    const kana=/[ぁ-ゖァ-ヺー]/;
    ['.hero','.note','footer','.backbtn'].forEach(sel=>{
      const el=document.querySelector(sel); if(!el) return;
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const list=[]; let n;
      while((n=w.nextNode()))list.push(n);
      list.forEach(node=>{ if(kana.test(node.nodeValue))return; const c=_tw2cn(node.nodeValue); if(c!==node.nodeValue)node.nodeValue=c; });
    });
  }
}
staticI18n();
if(I18n.getLang()==='zh-CN') ensureOpenCC().then(()=>{ render(); staticI18n(); });
