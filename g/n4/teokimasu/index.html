<h1>～ておきます（事前準備）</h1>
<div class="cat">JLPT N4・アスペクト</div>
<section><h2>意思・解說</h2><p>「事先做好」或「維持原狀」。</p></section>
<section><h2>句型・接續</h2><p>て形＋おきます</p></section>
<section><h2>例句</h2><ul class="eg"><li>出張の前に切符を買っ<em>ておきます</em>。<span class="t"> 出差前先買好票。</span></li><li>食器は流しに置い<em>ておいてください</em>。<span class="t"> 餐具請放在流理台。</span></li></ul></section>
