<h1>～がります（第三人稱慾望）</h1>
<div class="cat">JLPT N4・引用・思考</div>
<section><h2>意思・解說</h2><p>描述第三人稱的慾望或情感。</p></section>
<section><h2>句型・接續</h2><p>い形（去い）＋がります</p></section>
<section><h2>例句</h2><ul class="eg"><li>弟が新しいゲーム機を<em>欲しがっています</em>。<span class="t"> 弟弟想要新遊戲機。</span></li><li>姪は海外で働き<em>たがっています</em>。<span class="t"> 姪女想在國外工作。</span></li></ul></section>
