<h1>～らしいです</h1>
<div class="cat">JLPT N4・推量・様態</div>
<section><h2>意思・解說</h2><p>①「聽說～」（傳聞推測） ②「很有～風格」（典型）。</p></section>
<section><h2>句型・接續</h2><p>普通形＋らしいです</p></section>
<section><h2>例句</h2><ul class="eg"><li>中村さんは転職する<em>らしいです</em>。<span class="t"> 聽說中村要換工作。</span></li><li>彼女は本当に芸術家<em>らしい</em>人です。<span class="t"> 她真是個很有藝術家風格的人。</span></li></ul></section>
