<div class="cat">JLPT N4・敬語</div>
<section><h2>意思・解說</h2><p>抬高對方行為。特別尊敬語：いらっしゃいます、おっしゃいます、ご覧になります等。</p></section>
<section><h2>句型・接續</h2><p>お＋ます形＋になります／特別尊敬語</p></section>
