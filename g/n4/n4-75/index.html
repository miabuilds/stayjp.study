<h1>動詞變化順序</h1>
<div class="cat">JLPT N4・動詞活用</div>
<section><h2>意思・解說</h2><p>動詞的變化都從「辞書形」出發。理解分類（五段/一段/不規則）是關鍵。</p></section>
<section><h2>句型・接續</h2><p>ます形→て形→可能形→受身形→使役形等</p></section>
<section><h2>例句</h2><ul class="eg"><li>飲む：飲みます/飲んで/飲める/飲まれる/飲ませる<span class="t"> 喝：各種變化一覽</span></li><li>見る：見ます/見て/見られる/見させる<span class="t"> 看：各種變化一覽</span></li></ul></section>
