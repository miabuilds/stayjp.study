<h1>条件形（ば形）</h1>
<div class="cat">JLPT N4・動詞活用</div>
<section><h2>意思・解說</h2><p>「如果～的話」。假定條件。</p></section>
<section><h2>句型・接續</h2><p>五段：う段→え段＋ば／一段：去る＋れば</p></section>
<section><h2>例句</h2><ul class="eg"><li>予定が合え<em>ば</em>、お茶でも飲みましょう。<span class="t"> 如果時間配合就一起喝個茶吧。</span></li><li>安けれ<em>ば</em>買います。<span class="t"> 如果便宜就買。</span></li></ul></section>
