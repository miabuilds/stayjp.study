<h1>～たら（條件）</h1>
<div class="cat">JLPT N4・條件表現</div>
<section><h2>意思・解說</h2><p>「如果～了的話」。最通用的條件句。也可表示意外發現。</p></section>
<section><h2>句型・接續</h2><p>た形＋ら</p></section>
<section><h2>例句</h2><ul class="eg"><li>電車が来<em>たら</em>、すぐ乗ってください。<span class="t"> 電車來了就馬上上車。</span></li><li>ドアを開け<em>たら</em>、手紙が落ちていました。<span class="t"> 開門一看，有封信掉在地上。</span></li></ul></section>
