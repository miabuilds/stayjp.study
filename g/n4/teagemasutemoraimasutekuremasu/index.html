<h1>～てあげます・てもらいます・てくれます</h1>
<div class="cat">JLPT N4・授受表現</div>
<section><h2>意思・解說</h2><p>行為的授受。表示「做某事」的施予和接受。</p></section>
<section><h2>句型・接續</h2><p>て形＋あげる（幫人做）／もらう（請人做）／くれる（人幫我做）</p></section>
<section><h2>例句</h2><ul class="eg"><li>後輩にアドバイスし<em>てあげました</em>。<span class="t"> 給後輩建議了。</span></li><li>同僚に書類を直し<em>てもらいました</em>。<span class="t"> 請同事幫忙改了文件。</span></li><li>姉がマフラーを編ん<em>でくれました</em>。<span class="t"> 姐姐織了圍巾給我。</span></li></ul></section>
