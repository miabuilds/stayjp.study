<h1>～つもりです（打算）</h1>
<div class="cat">JLPT N4・表現・文型</div>
<section><h2>意思・解說</h2><p>表示預定的意志或計畫。</p></section>
<section><h2>句型・接續</h2><p>辞書形／ない形＋つもりです</p></section>
<section><h2>例句</h2><ul class="eg"><li>夏休みに北海道を一周する<em>つもりです</em>。<span class="t"> 打算暑假環北海道一圈。</span></li><li>今後は甘い物を控える<em>つもりです</em>。<span class="t"> 打算之後少吃甜食。</span></li></ul></section>
