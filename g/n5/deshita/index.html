<h1>～でした（名詞過去）</h1>
<div class="cat">JLPT N5・基本句型</div>
<section><h2>意思・解說</h2><p>名詞的過去式。</p></section>
<section><h2>句型・接續</h2><p>名詞＋でした／じゃありませんでした</p></section>
<section><h2>例句</h2><ul class="eg"><li>先週の月曜日は<em>祝日でした</em>。<span class="t"> 上週一是國定假日。</span></li><li>昔の校舎は図書館<em>じゃありませんでした</em>。<span class="t"> 舊校舍以前不是圖書館。</span></li></ul></section>
