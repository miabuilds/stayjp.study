<h1>疑問詞</h1>
<div class="cat">JLPT N5・詞彙・其他</div>
<section><h2>意思・解說</h2><p>常用疑問詞。疑問詞＋も＋否定＝全面否定。疑問詞＋か＝不確定。</p></section>
<section><h2>句型・接續</h2><p>何・誰・どこ・いつ・どれ・いくら・どう</p></section>
<section><h2>例句</h2><ul class="eg"><li><em>何も</em>飲みませんでした。<span class="t"> 什麼都沒喝。</span></li><li><em>どこか</em>静かな場所へ行きたいです。<span class="t"> 想去某個安靜的地方。</span></li></ul></section>
