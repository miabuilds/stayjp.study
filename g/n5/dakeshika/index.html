<h1>限定助詞「だけ」「しか」</h1>
<div class="cat">JLPT N5・助詞</div>
<section><h2>意思・解說</h2><p>「だけ」中性，「しか＋否定」帶遺憾語氣。</p></section>
<section><h2>句型・接續</h2><p>だけ（中性限定）／しか＋否定（不足感）</p></section>
<section><h2>例句</h2><ul class="eg"><li>サラダ<em>だけ</em>注文します。<span class="t"> 只點沙拉。</span></li><li>10分<em>しか</em>残っていません。<span class="t"> 只剩 10 分鐘（不夠）。</span></li></ul></section>
