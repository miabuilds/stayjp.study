<h1>～ことがある（経験）</h1>
<div class="cat">JLPT N3・その他</div>
<section><h2>意思・解說</h2><p>「有過～的經驗」。表示過去的經歷。</p></section>
<section><h2>句型・接續</h2><p>た形＋ことがある</p></section>
<section><h2>例句</h2><ul class="eg"><li>パラグライダーに挑戦し<em>たことがある</em>。<span class="t"> 挑戰過滑翔傘。</span></li><li>宮崎の青島に行っ<em>たことがありますか</em>。<span class="t"> 你去過宮崎的青島嗎？</span></li><li>海外で一人暮らしし<em>たことがある</em>。<span class="t"> 在國外獨自住過。</span></li></ul></section>
