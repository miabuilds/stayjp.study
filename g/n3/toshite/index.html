<h1>～として</h1>
<div class="cat">JLPT N3・接続・原因</div>
<section><h2>意思・解說</h2><p>「作為～」。表示身份、立場、資格。</p></section>
<section><h2>句型・接續</h2><p>名詞＋として</p></section>
<section><h2>例句</h2><ul class="eg"><li>交換留学生<em>として</em>この大学に来ました。<span class="t"> 作為交換留學生來到這所大學。</span></li><li>奈良は古都<em>として</em>世界に知られている。<span class="t"> 奈良作為古都舉世聞名。</span></li><li>ボランティア<em>として</em>被災地に向かった。<span class="t"> 作為志工前往災區。</span></li></ul></section>
