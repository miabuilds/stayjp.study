<h1>～気味</h1>
<div class="cat">JLPT N3・様態・傾向</div>
<section><h2>意思・解說</h2><p>「有點～」「稍微～」。表示輕微的傾向，多負面。</p></section>
<section><h2>句型・接續</h2><p>動詞ます形＋気味／名詞＋気味</p></section>
<section><h2>例句</h2><ul class="eg"><li>最近、太り<em>気味</em>だ。<span class="t"> 最近有點變胖。</span></li><li>風邪<em>気味</em>なので、今日は早く寝ます。<span class="t"> 有點感冒，今天早點睡。</span></li><li>疲れ<em>気味</em>だから、今週末はゆっくり休もう。<span class="t"> 有點累，這個週末好好休息吧。</span></li></ul></section>
