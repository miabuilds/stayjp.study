<h1>～っぽい</h1>
<div class="cat">JLPT N3・様態・傾向</div>
<section><h2>意思・解說</h2><p>「感覺像～」「容易～」。口語化的傾向表達。</p></section>
<section><h2>句型・接續</h2><p>名詞／い形語幹／動詞ます形＋っぽい</p></section>
<section><h2>例句</h2><ul class="eg"><li>最近<em>忘れっぽく</em>なった。<span class="t"> 最近變得容易忘記。</span></li><li>この色はちょっと<em>子供っぽい</em>。<span class="t"> 這個顏色有點孩子氣。</span></li><li>弟は<em>飽きっぽい</em>性格で、趣味が続かない。<span class="t"> 弟弟個性容易膩，興趣都持續不下去。</span></li></ul></section>
