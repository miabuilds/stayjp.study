<h1>～に応じて</h1>
<div class="cat">JLPT N2・範囲・限定</div>
<section><h2>意思・解說</h2><p>「根據～、配合～」。表示隨情況調整。</p></section>
<section><h2>句型・接續</h2><p>名詞＋に応じて</p></section>
<section><h2>例句</h2><ul class="eg"><li>成果<em>に応じて</em>、ボーナスが決まる。<span class="t"> 根據成果決定獎金。</span></li><li>状況<em>に応じて</em>、柔軟に対応する。<span class="t"> 配合狀況靈活應對。</span></li><li>季節<em>に応じて</em>、メニューを入れ替えている。<span class="t"> 根據季節更換菜單。</span></li></ul></section>
