<h1>～ものなら</h1>
<div class="cat">JLPT N2・条件・仮定</div>
<section><h2>意思・解說</h2><p>「如果能～的話（其實辦不到）」。帶有挑戰或不可能的語氣。</p></section>
<section><h2>句型・接續</h2><p>可能動詞辞書形＋ものなら</p></section>
<section><h2>例句</h2><ul class="eg"><li>できる<em>ものなら</em>、一度やってみろ。<span class="t"> 你要是做得到就試試看啊。</span></li><li>戻れる<em>ものなら</em>、高校時代に戻りたい。<span class="t"> 要是能回去的話，真想回到高中時代。</span></li><li>代われる<em>ものなら</em>、その痛みを代わりたい。<span class="t"> 如果能代替的話，真想替你承受那份痛。</span></li></ul></section>
