<h1>～上に</h1>
<div class="cat">JLPT N2・話題・評価</div>
<section><h2>意思・解說</h2><p>「不僅～而且～」。在已有基礎上再加。</p></section>
<section><h2>句型・接續</h2><p>普通形＋上に</p></section>
<section><h2>例句</h2><ul class="eg"><li>この店は価格が手頃な<em>上に</em>、料理の質も高い。<span class="t"> 這家店價格親民而且料理品質高。</span></li><li>彼は頭脳明晰な<em>上に</em>、運動神経も抜群だ。<span class="t"> 他頭腦清晰而且運動神經也出眾。</span></li><li>このカフェは駅に近い<em>上に</em>、Wi-Fi も高速だ。<span class="t"> 這家咖啡店離車站近而且 Wi-Fi 也很快。</span></li></ul></section>
