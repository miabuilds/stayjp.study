<h1>～ときたら</h1>
<div class="cat">JLPT N1・話題・評価</div>
<section><h2>意思・解說</h2><p>「說到～（真是令人失望）」。提起某話題，帶有負面評價。</p></section>
<section><h2>句型・接續</h2><p>名詞＋ときたら</p></section>
<section><h2>例句</h2><ul class="eg"><li>最近の若手<em>ときたら</em>、挨拶もろくにできない。<span class="t"> 說到最近的年輕人，連招呼都不會打。</span></li><li>うちの上司<em>ときたら</em>、出張のたびにお土産の約束を忘れる。<span class="t"> 說到我們上司，每次出差都忘記帶伴手禮的承諾。</span></li></ul></section>
