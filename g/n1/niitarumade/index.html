<h1>～に至るまで</h1>
<div class="cat">JLPT N1・時間・変化</div>
<section><h2>意思・解說</h2><p>「直到～為止（全部）」。強調範圍之廣，從頭到尾。</p></section>
<section><h2>句型・接續</h2><p>名詞＋に至るまで</p></section>
<section><h2>例句</h2><ul class="eg"><li>子供から高齢者<em>に至るまで</em>、誰もが楽しめるイベントだ。<span class="t"> 從小孩到老人都能享受的活動。</span></li><li>企画の立案から実行<em>に至るまで</em>、彼女が一人で担当した。<span class="t"> 從企劃立案到執行為止，她一個人包辦。</span></li></ul></section>
