<h1>～まで（のこと）だ</h1>
<div class="cat">JLPT N1・限定・強調</div>
<section><h2>意思・解說</h2><p>「大不了就～」「只不過是～罷了」。表示最壞也不過如此，沒什麼大不了。</p></section>
<section><h2>句型・接續</h2><p>辞書形＋まで（のこと）だ</p></section>
<section><h2>例句</h2><ul class="eg"><li>うまくいかなければ、もう一度やり直す<em>までだ</em>。<span class="t"> 不順利的話，大不了重做一次。</span></li><li>電車が動かなければ、徒歩で帰る<em>までのことだ</em>。<span class="t"> 電車若停駛，大不了走路回去。</span></li></ul></section>
