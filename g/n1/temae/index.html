<h1>～手前</h1>
<div class="cat">JLPT N1・原因・理由</div>
<section><h2>意思・解說</h2><p>「因為（面子上）已經～了」。考慮到面子或立場，不得不這樣做。</p></section>
<section><h2>句型・接續</h2><p>た形／名詞の＋手前</p></section>
<section><h2>例句</h2><ul class="eg"><li>既に約束した<em>手前</em>、今さら断れない。<span class="t"> 既然已經答應了，面子上不能拒絕。</span></li><li>後輩の<em>手前</em>、弱音を吐くわけにはいかない。<span class="t"> 在後輩面前，不能示弱。</span></li></ul></section>
