<h1>～まじき</h1>
<div class="cat">JLPT N1・文末・書き言葉</div>
<section><h2>意思・解說</h2><p>「不該做的」「不可饒恕的」。表示不應該有的行為。書面語。</p></section>
<section><h2>句型・接續</h2><p>辞書形＋まじき＋名詞</p></section>
<section><h2>例句</h2><ul class="eg"><li>教育者にある<em>まじき</em>発言だ。<span class="t"> 那是身為教育者不該有的發言。</span></li><li>公人として許す<em>まじき</em>暴言が議会で飛び出した。<span class="t"> 議會中爆出了身為公眾人物不可饒恕的暴言。</span></li></ul></section>
