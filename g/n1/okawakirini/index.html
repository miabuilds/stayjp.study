<h1>～を皮切りに</h1>
<div class="cat">JLPT N1・その他</div>
<section><h2>意思・解說</h2><p>「以～為開端」「從～開始」。以某事為起點展開一系列活動。</p></section>
<section><h2>句型・接續</h2><p>名詞＋を皮切りに（して）</p></section>
<section><h2>例句</h2><ul class="eg"><li>東京公演<em>を皮切りに</em>、全国ツアーが始まった。<span class="t"> 以東京公演為開端，全國巡迴開始了。</span></li><li>新商品の発売<em>を皮切りに</em>、一連のマーケティング施策が展開された。<span class="t"> 以新商品開賣為開端，展開了一系列行銷活動。</span></li></ul></section>
