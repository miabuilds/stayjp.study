<h1>～を限りに</h1>
<div class="cat">JLPT N1・時間・変化</div>
<section><h2>意思・解說</h2><p>「以～為最後」「到～為止」。表示期限或截止。</p></section>
<section><h2>句型・接續</h2><p>名詞＋を限りに</p></section>
<section><h2>例句</h2><ul class="eg"><li>今日<em>を限りに</em>、タバコを完全にやめる。<span class="t"> 以今日為限，完全戒菸。</span></li><li>今月<em>を限りに</em>、老舗のうどん店が幕を下ろす。<span class="t"> 以本月為限，老牌烏龍麵店將落幕。</span></li></ul></section>
