<h1>～んがため（に）</h1>
<div class="cat">JLPT N1・原因・理由</div>
<section><h2>意思・解說</h2><p>「為了～」。古風、書面的目的表現。</p></section>
<section><h2>句型・接續</h2><p>ない形（去ない）＋んがため（に）</p></section>
<section><h2>例句</h2><ul class="eg"><li>大会で優勝せ<em>んがため</em>、彼は毎日厳しい練習に耐えた。<span class="t"> 為了在大會奪冠，他每天忍受嚴格的訓練。</span></li><li>家族を守ら<em>んがため</em>、彼は危険な仕事も引き受けた。<span class="t"> 為了保護家人，他也承接了危險的工作。</span></li></ul></section>
