<h1>～ようが／～ようと</h1>
<div class="cat">JLPT N1・逆接・譲歩</div>
<section><h2>意思・解說</h2><p>「不管怎麼～都…」。無論做什麼，結論都不變。</p></section>
<section><h2>句型・接續</h2><p>意向形＋が／と</p></section>
<section><h2>例句</h2><ul class="eg"><li>周囲が何と言お<em>うが</em>、自分の信念は曲げない。<span class="t"> 不管周圍怎麼說，我都不會屈服自己的信念。</span></li><li>どんなに暑かろ<em>うと</em>、毎朝のランニングは欠かさない。<span class="t"> 不管多熱，每天早上的跑步都不間斷。</span></li></ul></section>
