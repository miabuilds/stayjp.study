<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI 情境對話｜StayJP 日本再留計劃</title>
<style>
  :root{ --bg:#f3f5f2;--panel:#fff;--ink:#1b2320;--ink2:#5f6b67;--ink3:#93a09a;--line:#e3e8e2;--accent:#0f766e;--accent2:#0b5850;--soft:#0f766e12;--me:#0f766e;--ai:#eef1ee;--ok:#15803d;--bad:#c2410c;--warn:#b45309;--sh:0 1px 2px rgba(20,40,30,.05),0 8px 24px rgba(20,40,30,.06); }
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111512;--panel:#191e1b;--ink:#e9eeea;--ink2:#9aa7a0;--ink3:#70807a;--line:#28302b;--accent:#2dd4bf;--accent2:#5eead4;--soft:#2dd4bf18;--me:#0f766e;--ai:#20261f;--ok:#4ade80;--bad:#fb923c;--warn:#fbbf24;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 40px}
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .banner{background:var(--warn);color:#fff;font-size:12px;text-align:center;padding:6px}
  .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer}
  .btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.pri:hover{background:var(--accent2)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:6px 11px;font-size:13px}
  h1{font-size:18px;margin-bottom:2px} .sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
  a.back{color:var(--ink2);text-decoration:none;font-size:13px}

  /* 選主題畫面 */
  .lvtabs{display:flex;gap:6px;margin:12px 0}
  .lvtab{flex:1;text-align:center;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:10px;padding:8px 0;cursor:pointer}
  .lvtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lvtab small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:1px}
  .scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
  .scene{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px;cursor:pointer;transition:border-color .12s}
  .scene:hover{border-color:var(--accent)}
  .scene .ic{font-size:26px} .scene .t{font-weight:700;margin-top:6px} .scene .d{color:var(--ink2);font-size:12px;margin-top:2px;line-height:1.5}

  /* 對話畫面 */
  .chatbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .chatbar .ttl{font-weight:700;font-size:15px;flex:1;display:flex;align-items:center;gap:7px}
  .msgs{display:flex;flex-direction:column;gap:12px;min-height:40px}
  .msg{display:flex;flex-direction:column;max-width:86%}
  .msg.ai{align-self:flex-start;align-items:flex-start}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .bubble{border-radius:16px;padding:11px 14px;line-height:1.5;position:relative}
  .bubble.ai{background:var(--ai);border-bottom-left-radius:5px}
  .bubble.me{background:var(--me);color:#fff;border-bottom-right-radius:5px}
  .bjp{font-size:17px;font-weight:600}
  .bubble.ai .bjp{display:flex;align-items:flex-start;gap:8px}
  .spk{flex-shrink:0;cursor:pointer;border:0;background:none;color:var(--accent);font-size:15px;padding:0;line-height:1.4}
  .bkana{color:var(--accent2);font-size:12.5px;margin-top:3px}
  .bzh{color:var(--ink2);font-size:12.5px;margin-top:3px}
  .msg.me .bkana,.msg.me .bzh{color:#ffffffcc}
  .coach{align-self:flex-start;max-width:86%;background:var(--soft);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink)}
  .coach b{color:var(--accent)}
  .typing{color:var(--ink3);font-size:13px;padding:4px 2px;animation:tpulse 1.2s ease-in-out infinite}
  @keyframes tpulse{0%,100%{opacity:.35}50%{opacity:1}}

  .inbar{position:sticky;bottom:0;background:var(--bg);padding-top:12px;margin-top:14px}
  .inrow{display:flex;gap:8px;align-items:flex-end}
  .say{flex:1;min-height:44px;max-height:120px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);color:var(--ink);resize:none}
  .rec{font-size:16px;flex-shrink:0}
  .rec.on{background:var(--bad);color:#fff;border-color:var(--bad)}
  .muted{color:var(--ink3);font-size:12px;margin-top:6px}
  .err{color:var(--bad);font-size:13px;margin-top:6px}
  .hints{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .hint-toggle{font:inherit;font-size:13px;color:var(--ink2);background:none;border:1px dashed var(--line);border-radius:14px;padding:7px 14px;cursor:pointer}
  .hint-toggle:hover{color:var(--accent);border-color:var(--accent)}
  .hints-lb{width:100%;font-size:12px;color:var(--ink3);margin-bottom:-2px}
  .hint-chip{background:var(--soft);border:1px solid var(--accent);color:var(--ink);border-radius:14px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left;line-height:1.45;font-family:inherit}
  .hint-chip:hover{background:var(--accent);color:#fff}
  .hint-chip .hz{display:block;font-size:11px;opacity:.72;margin-top:1px}
  .hint-chip:hover .hz{color:#fff;opacity:.9}
  .cnbtn.off{opacity:.5;text-decoration:line-through}
  .wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .wchip{font:inherit;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 9px;cursor:pointer;color:var(--ink);display:inline-flex;gap:5px;align-items:baseline}
  .wchip:hover{border-color:var(--accent)}
  .wchip b{font-size:13px}
  .wchip .wr{color:var(--accent2)}
  .wchip .wz{color:var(--ink2)}
  .hint-wrap{display:inline-flex;align-items:stretch;gap:4px}
  .hint-spk{font:inherit;border:1px dashed var(--line);background:none;border-radius:12px;padding:0 9px;cursor:pointer;font-size:13px}
  .hint-spk:hover{border-color:var(--accent)}

  /* 點評 */
  .review{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px;margin-top:8px}
  .rv-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .ring{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
  .rv-line{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .rv-line .lb{font-weight:700;color:var(--accent);margin-right:6px}
</style>
</head>
<body>
<div id="boot" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink3)"><div style="width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:bspin .8s linear infinite"></div><div style="font-size:14px">載入中…</div></div>
<style>@keyframes bspin{to{transform:rotate(360deg)}}</style>

</div>

<div id="app" class="wrap" style="display:none">

  <!-- 選主題 -->
  <div id="pick">
    <div style="margin-bottom:8px"><a href="#" onclick="if(history.length>1){history.back()}else{location.href='app.html'};return false" style="color:var(--ink3);text-decoration:none;font-size:14px">‹ 返回</a></div>
    <h1>🗣 情境對話 <span class="muted" style="font-weight:400">Beta</span></h1>
    <div class="sub">選一個情境和難度,AI 會扮演對方跟你一來一往練對話。可以用說的(語音辨識)或打字。免費體驗 1 場,Premium 每天 3 場。</div>
    <div class="lvtabs" id="lvtabs"></div>
    <div class="scenes" id="scenes"></div>
    <div class="muted" style="margin-top:14px">💡 這是「對話」練習;想練單句跟讀請到 <a href="speak.html" style="color:var(--accent)">口說練習</a>。</div>
  </div>

  <!-- 對話 -->
  <div id="chat" style="display:none">
    <div class="chatbar">
      <span class="ttl" id="chatTtl"></span>
      <button class="btn sm cnbtn" id="cnBtn" onclick="toggleZh()" title="關掉中文,只靠日文和語音理解,練聽力">中文</button>
      <button class="btn sm" id="endBtn" onclick="endChat()">結束・看點評</button>
      <button class="btn sm" id="topicBtn" onclick="backToPick()">換主題</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inbar">
      <div class="hints" id="hints"></div>
      <div class="inrow">
        <button id="recBtn" class="btn rec" onclick="toggleRec()">🎤</button>
        <textarea id="say" class="say" rows="1" placeholder="用說的或打字…"></textarea>
        <button class="btn pri" id="sendBtn" onclick="sendMine()">送出</button>
      </div>
      <div class="muted" id="inNote">🎤 用瀏覽器語音辨識(Chrome 較準);不準可直接改字再送。</div>
    </div>
  </div>

  <!-- 點評 -->
  <div id="review" style="display:none">
    <div class="chatbar">
      <span class="ttl" id="rvTtl">📋 對話點評</span>
      <button class="btn sm" id="resumeBtn" onclick="resumeChat()">回到對話</button>
      <button class="btn sm" id="topicBtn2" onclick="backToPick()">換主題</button>
    </div>
    <div class="review" id="reviewCard"></div>
  </div>

</div>

<script src="i18n.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script>
// ── 三語 shim:cvt(OpenCC 繁→簡)+ enOr(en 用英文,否則 cvt)──
let _tw2cn=null;
function ensureOpenCC(){ return new Promise(function(res){ if(_tw2cn)return res(_tw2cn); if(window.OpenCC){ _tw2cn=OpenCC.Converter({from:'tw',to:'cn'}); if(I18n.setConverter)I18n.setConverter(_tw2cn); return res(_tw2cn);} var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js'; s.onload=function(){ _tw2cn=OpenCC.Converter({from:'tw',to:'cn'}); if(I18n.setConverter)I18n.setConverter(_tw2cn); res(_tw2cn); }; s.onerror=function(){res(null)}; document.head.appendChild(s); }); }
function cvt(x){ return (!x||I18n.getLang()!=='zh-CN'||!_tw2cn)?x:_tw2cn(x); }
function enOr(zh,en){ return I18n.getLang()==='en'?en:cvt(zh); }
function cvtStaticUI(root){ if(I18n.getLang()!=='zh-CN')return; var el=typeof root==='string'?document.getElementById(root):root; if(!el)return; if(!_tw2cn){ ensureOpenCC().then(function(){cvtStaticUI(el)}); return; } var kana=/[ぁ-ゖァ-ヺー]/; var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); var list=[],n; while((n=w.nextNode()))list.push(n); list.forEach(function(node){ if(kana.test(node.nodeValue))return; var c=_tw2cn(node.nodeValue); if(c!==node.nodeValue)node.nodeValue=c; }); }
if(I18n.getLang()==='zh-CN') ensureOpenCC();

if(!firebase.apps.length) firebase.initializeApp(fbConfig);
const auth = firebase.auth();

const ADMIN_EMAILS = ['stayjpplan@gmail.com','abc83327@gmail.com'];
const FN_CHAT = 'https://asia-east1-jpnote-1bdd6.cloudfunctions.net/speakChat';
const FN_TTS  = 'https://asia-east1-jpnote-1bdd6.cloudfunctions.net/ttsSpeak';

// desc 是給 AI 的角色設定(不翻譯);voice 決定雲端語音性別。tE/dE 是英文顯示用。
const SCENES = [
  { k:'conbini', ic:'🏪', t:'便利商店', d:'結帳、加熱便當、集點', tE:'Convenience store', dE:'Checkout, heating food, points', voice:'f',
    desc:'你是日本便利商店(コンビニ)的店員,正在幫這位客人結帳。你會問要不要加熱、要不要袋子、有沒有集點卡等,並完成結帳。' },
  { k:'resto', ic:'🍜', t:'餐廳點餐', d:'帶位、點餐、結帳', tE:'Restaurant', dE:'Seating, ordering, paying', voice:'m',
    desc:'你是日本餐廳的店員,從帶位、遞菜單、幫客人點餐、送餐到結帳都由你負責,自然地推進用餐流程。' },
  { k:'station', ic:'🚉', t:'車站問路', d:'問路、買票、轉乘', tE:'At the station', dE:'Directions, tickets, transfers', voice:'m',
    desc:'你是車站站務員或熱心的路人,客人向你問路、問怎麼買票或轉乘。你親切地指路、說明路線。' },
  { k:'clinic', ic:'🏥', t:'看診拿藥', d:'掛號、說症狀、拿藥', tE:'Clinic visit', dE:'Check-in, symptoms, medicine', voice:'f',
    desc:'你是診所的櫃檯與護理人員,患者來看病。你會問哪裡不舒服、有沒有發燒、帶你保險證了嗎,並引導看診與拿藥。' },
  { k:'shop', ic:'🛍️', t:'買衣服', d:'試穿、尺寸、退換', tE:'Clothes shopping', dE:'Fitting, sizes, returns', voice:'f',

  { k:'interview', ic:'💼', t:'工作面試', d:'自我介紹、問答', tE:'Job interview', dE:'Self-intro, Q&A', voice:'m',
    desc:'你是日本公司的面試官,正在面試這位求職者。你會請對方自我介紹、問動機與經歷、聊工作條件,語氣禮貌正式。' },
  { k:'house', ic:'🏠', t:'租屋看房', d:'租金、條件、簽約', tE:'Apartment hunting', dE:'Rent, terms, contract', voice:'f',
    desc:'你是不動產仲介,帶客人看房。你會介紹房子、說明租金與條件、回答問題、聊簽約流程。' },
  { k:'coworker', ic:'☕', t:'同事閒聊', d:'職場寒暄、約午餐', tE:'Coworker chat', dE:'Small talk, lunch plans', voice:'m',
    desc:'你是對方公司的同事,午休時間隨意閒聊,話題像天氣、工作近況、要不要一起吃午餐等,輕鬆自然。' },

    desc:'你是美容院的設計師,客人來剪頭髮。你會問今天想怎麼剪、長度、髮型偏好,過程中閒聊幾句,結束確認滿不滿意。' },
  { k:'izakaya', ic:'🍶', t:'居酒屋聚會', d:'點酒、聊天、乾杯', tE:'Izakaya night', dE:'Drinks, chatting, kanpai', voice:'m',
    desc:'你是一起來居酒屋的日本朋友,大家下班聚會。你會招呼點酒點菜、乾杯、聊工作與生活,口語輕鬆、氣氛熱絡。' },
  { k:'delivery', ic:'📦', t:'宅配・退換貨', d:'重新配送、客服', tE:'Delivery & returns', dE:'Redelivery, support', voice:'f',
    desc:'你是宅配公司或網購客服人員,對方要處理包裹問題(改配送時間、不在配達、退貨換貨)。你會確認單號、說明手續。' },
  { k:'smalltalk', ic:'🌸', t:'鄰居寒暄', d:'垃圾日、天氣、近況', tE:'Neighbor chat', dE:'Trash day, weather, life', voice:'f',
    desc:'你是對方的日本鄰居,在公寓門口或垃圾集中處碰到面。你會寒暄天氣、聊垃圾分類日、社區的事、隨意近況,親切自然。' },
  { k:'custom', ic:'✏️', t:'自訂主題', d:'想聊什麼自己定', tE:'Custom topic', dE:'You decide what to chat about', voice:'f', custom:true },
];
const LEVELS = ['N5','N4','N3','N2','N1'];
let activeLv = 'N4';
let scene = null;
let history = [];      // {role:'ai'|'me', text, kana, zh, coach}
let busy = false;
let showZh = true;     // 對話中是否顯示中文翻譯;關掉 → 只靠日文+語音理解,練聽力
function toggleZh(){ showZh=!showZh; const b=document.getElementById('cnBtn'); if(b) b.classList.toggle('off',!showZh); renderMsgs(); }

// ── 畫面切換 ──
function show(id){ ['pick','chat','review'].forEach(x=>document.getElementById(x).style.display = x===id?'block':'none'); }
function renderLvTabs(){
  const D={N5:enOr('最基本','Basics'),N4:enOr('日常','Daily'),N3:enOr('中級','Intermediate'),N2:enOr('中上','Upper-int'),N1:enOr('高階','Advanced')};
  document.getElementById('lvtabs').innerHTML = LEVELS.map(lv=>
    `<div class="lvtab${lv===activeLv?' on':''}" onclick="pickLv('${lv}')">${lv}<small>${D[lv]}</small></div>`).join('');
}
function pickLv(lv){ activeLv=lv; renderLvTabs(); }
function sceneTitle(s){ return s.tE ? enOr(s.t, s.tE) : s.t; }   // custom 主題的 t 是使用者輸入,不翻
function renderScenes(){
  document.getElementById('scenes').innerHTML = SCENES.map(s=>
    `<div class="scene" onclick="startChat('${s.k}')"><div class="ic">${s.ic}</div><div class="t">${esc(sceneTitle(s))}</div><div class="d">${esc(s.dE?enOr(s.d,s.dE):s.d)}</div></div>`).join('');
}
function backToPick(){ hardStopRec(); scene=null; history=[]; show('pick'); }

// ── 開始 / 進行對話 ──
// 站上標準雙登入(照 auth-header.js)
let _signingIn=false;
function loginWith(p){
  if(_signingIn) return; _signingIn=true;
  var provider;
  if(p==='apple'){ provider=new firebase.auth.OAuthProvider('apple.com'); provider.addScope('email'); provider.addScope('name'); }
  else { provider=new firebase.auth.GoogleAuthProvider(); }
  auth.signInWithPopup(provider).then(function(){ var g=document.getElementById('loginCard'); if(g)g.remove(); })
    .catch(function(e){ var c=e&&e.code;
      if(c==='auth/cancelled-popup-request'||c==='auth/popup-closed-by-user')return;
      if(c==='auth/operation-not-allowed'){ alert(enOr('Apple 登入還在設定中,請先用 Google 登入。','Apple sign-in is still being set up — please use Google for now.')); return; }
      alert(enOr('登入失敗:','Sign-in failed: ')+(e&&e.message||e));
    }).finally(function(){ _signingIn=false; });
}
function showLoginCard(){
  if(document.getElementById('loginCard')) return;
  const el=document.createElement('div'); el.id='loginCard';

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderMsgs(streamingAi){

function aiBubble(m){

// 解析逐行輕結構
function parseTurn(text){
  const o={jp:'',kana:'',zh:'',coach:'',hints:[]};
  for(const line of String(text).split('\n')){
    let m=line.match(/^(JP|KANA|ZH|COACH):\s?(.*)$/);
    if(m){ const v=(m[2]||'').trim(); if(m[1]==='JP'){ if(v) o.jp=v; } else o[m[1].toLowerCase()]=v; continue; }   // JP 只收非空行:模型偶爾多吐一行空 JP,別把正文蓋掉
    m=line.match(/^HINT:\s?(.*)$/);
    if(m){ const v=(m[1]||'').trim(); if(v) o.hints.push(v); continue; }
    m=line.match(/^WORDS:\s?(.*)$/);
    if(m){ o.words=(m[1]||'').trim(); }
  }
  // COACH 有時會吐 <blank>/空白/無 之類佔位字 → 當作沒有提點
  if(/^<?\s*(blank|空白?|無|なし|null|none|n\/a|[-—―])\s*>?$/i.test(o.coach)) o.coach='';
  // 防呆:模型格式跑掉沒給 JP 行時,拿假名行當主行(至少看得到、也播得出來),別讓泡泡剩「…」卡死
  if(!o.jp && o.kana){ o.jp=o.kana; o._jpFromKana=true; }   // 代打標記:串流中假名是半句,不能拿去提前播
  return o;
}
// 「你可以這樣回」建議;點了填進輸入框讓你可再改
// 提示預設收合:先自己想,想不出來再點「💡 提示」展開——直接亮答案就沒練到了。
let _hints=[];
function renderHints(hints){
  _hints = hints||[];
  const box=document.getElementById('hints'); if(!box) return;
  if(!_hints.length){ box.innerHTML=''; return; }
  box.innerHTML = '<button class="hint-toggle" onclick="expandHints()">'+enOr('💡 不知道怎麼接?看提示','💡 Stuck? See hints')+'</button>';
}
function expandHints(){
  const box=document.getElementById('hints'); if(!box || !_hints.length) return;
  box.innerHTML = '<div class="hints-lb">'+enOr('💬 可以這樣回(點了會填入,可再改):','💬 You could say (tap to fill in, then edit):')+'</div>' +
    _hints.slice(0,3).map(h=>{
      const parts=String(h).split(/[｜|]/); const jp=(parts[0]||'').trim(); const zh=(parts[1]||'').trim();
      if(!jp) return '';
      return '<span class="hint-wrap"><button class="hint-chip" onclick="useHint('+JSON.stringify(jp).replace(/"/g,'&quot;')+')">'+esc(jp)+(zh?'<span class="hz">'+esc(cvt(zh))+'</span>':'')+'</button>'
        +'<button class="hint-spk" title="'+enOr('唸給我聽','Hear it')+'" onclick="event.stopPropagation();playTTS('+JSON.stringify(jp).replace(/"/g,'&quot;')+')">🔊</button></span>';
    }).join('');
}
// AI 回答的關鍵單字卡:単語|よみ|意思;分號隔開。點卡片唸該單字(雲端 TTS)
function wordChips(words){
  const items=String(words).split(/[;;﹔]/).map(function(x){return x.trim();}).filter(Boolean);
  if(!items.length) return '';
  return '<div class="wchips">'+items.map(function(it){
    const p=it.split(/[|｜]/); const w=(p[0]||'').trim(), r=(p[1]||'').trim();
    let zh=(p[2]||'').trim();
    zh=zh.split(/[;;﹔]/)[0].trim();   // 模型偶爾把下一個字擠進意思欄(「結帳金額;円」)→ 只留第一段
    if(!w) return '';
    return '<button class="wchip" onclick="event.stopPropagation();playTTS('+JSON.stringify(w).replace(/"/g,'&quot;')+')">'
      +'<b>'+esc(w)+'</b>'+(r&&r!==w?'<span class="wr">'+esc(r)+'</span>':'')+(zh?'<span class="wz">'+esc(cvt(zh))+'</span>':'')+'</button>';
  }).join('')+'</div>';
}
function useHint(jp){ const el=document.getElementById('say'); el.value=jp; autoGrow(); el.focus(); }

async function turn(){
  if(busy) return; busy=true; setBusy(true);
  renderMsgs({jp:'',kana:'',zh:''});   // 立刻顯示「對方正在輸入…」,冷啟動/慢網路不空白
  try{
    const t = await auth.currentUser.getIdToken();
    const r = await fetch(FN_CHAT,{ method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
      body:JSON.stringify({ mode:'chat', scene:scene.desc, level:activeLv, lang:I18n.getLang(), history:history.map(h=>({role:h.role,text:h.role==='ai'?(h.jp||h.text):h.text})) }) });
    if(!r.ok){
      let d={}; try{d=await r.json();}catch(e){}
      renderMsgs();
      if(d.error==='turns'){ appendErr(cvt(d.message)||enOr('這場聊得夠深了','That was a good, long chat!')); setTimeout(endChat, 800); return; }   // 輪數到頂 → 自動進點評
      if(d.error==='quota'){ appendErr((cvt(d.message)||enOr('額度用完了','Daily quota used up'))+enOr(' → 到「訂閱方案」升級',' → upgrade under "Plans"')); return; }
      appendErr(d.error||('HTTP '+r.status)); return;
    }
    const reader=r.body.getReader(); const dec=new TextDecoder(); let full=''; let spokenJp='';
    while(true){ const {done,value}=await reader.read(); if(done)break; full+=dec.decode(value,{stream:true}); const p=parseTurn(full); renderMsgs(p);
      // JP 一講完(後面 KANA/ZH 開始出現代表那行結束)就立刻播,不等 HINT 生完
      if(!spokenJp && p.jp && !p._jpFromKana && (p.kana||p.zh)){ spokenJp=p.jp; playTTS(p.jp, scene.voice); } }
    const ai=parseTurn(full); ai.role='ai';
    history.push(ai);
    renderMsgs();
    renderHints(ai.hints);                    // 給「你可以這樣回」的建議
    // 沒提前播到就補播;提前播的跟最終顯示不同(模型偶爾多吐一行 JP,後蓋前)→ 以畫面為準重播正確的
    if(ai.jp && ai.jp!==spokenJp) playTTS(ai.jp, scene.voice);
  }catch(e){ renderMsgs(); appendErr(e.message); }
  finally{ busy=false; setBusy(false); }
}
function appendErr(msg){ const box=document.getElementById('msgs'); box.insertAdjacentHTML('beforeend',`<div class="err">${enOr('出錯了:','Error: ')}${esc(msg)}</div>`); }
function setBusy(b){ document.getElementById('sendBtn').disabled=b; }

function sendMine(){
  const el=document.getElementById('say'); const txt=(el.value||'').trim();
  if(!txt || busy) return;
  // 每場 12 輪封頂(成本天花板):到頂自動進點評收尾
  if(history.filter(h=>h.role==='me').length >= 12){
    appendErr(enOr('這場聊得很充實了!幫你整理點評 🙌','Great session! Putting together your review 🙌')); setTimeout(endChat, 800); return;
  }
  hardStopRec();
  history.push({ role:'me', text:txt });
  el.value=''; autoGrow();
  renderHints([]);   // 你已經回了 → 清掉上一輪建議
  renderMsgs();
  turn();
}

// ── 結束 → 點評 ──
async function endChat(){
  if(busy) return;
  const mine = history.filter(h=>h.role==='me').length;
  if(mine===0){ show('review'); document.getElementById('reviewCard').innerHTML='<div class="muted">'+enOr('還沒開始對話,先聊幾句再看點評 🙂','No conversation yet — chat a little first 🙂')+'</div>'; return; }
  show('review');
  const card=document.getElementById('reviewCard'); card.innerHTML='<div class="muted">'+enOr('整理你的表現中…','Reviewing your performance…')+'</div>';

    const t=await auth.currentUser.getIdToken();
    const r=await fetch(FN_CHAT,{ method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
      body:JSON.stringify({ mode:'review', lang:I18n.getLang(), history:history.map(h=>({role:h.role,text:h.role==='ai'?(h.jp||h.text):h.text})) }) });
    if(!r.ok){ let d={}; try{d=await r.json();}catch(e){} card.innerHTML='<div class="err">'+enOr('失敗:','Failed: ')+esc(d.error||r.status)+'</div>'; return; }
    const reader=r.body.getReader(); const dec=new TextDecoder(); let full='';
    while(true){ const {done,value}=await reader.read(); if(done)break; full+=dec.decode(value,{stream:true}); renderReview(full,false); }
    renderReview(full,true);
  }catch(e){ card.innerHTML='<div class="err">'+enOr('錯誤:','Error: ')+esc(e.message)+'</div>'; }

function parseReview(text){
  const o={};
  for(const line of String(text).split('\n')){
    const m=line.match(/^(SCORE|GOOD|IMPROVE|TIP|ENCOURAGE):\s?(.*)$/);
    if(m) o[m[1].toLowerCase()]=(m[2]||'').trim();
  }
  return o;
}
function renderReview(text, done){
  const d=parseReview(text); const sc=Number(d.score)||0;
  const col=sc>=85?'var(--ok)':sc>=60?'var(--warn)':'var(--bad)';
  const head = d.score!=null
    ? `<div class="rv-head"><div class="ring" style="background:${col}">${sc}</div><div style="font-weight:700">${enOr('這次對話的表現','How this chat went')}</div></div>`
    : '<div class="muted">'+enOr('整理你的表現中…','Reviewing your performance…')+'</div>';
  document.getElementById('reviewCard').innerHTML = head
    + (d.good?`<div class="rv-line"><span class="lb">${enOr('做得好','Well done')}</span>${esc(cvt(d.good))}</div>`:'')
    + (d.improve?`<div class="rv-line"><span class="lb">${enOr('可加強','To improve')}</span>${esc(cvt(d.improve))}</div>`:'')
    + (d.tip?`<div class="rv-line"><span class="lb">${enOr('小建議','Tip')}</span>${esc(cvt(d.tip))}</div>`:'')
    + (d.encourage?`<div class="rv-line" style="color:var(--ok);font-weight:600;border:0">${esc(cvt(d.encourage))}</div>`:'')
    + (!done && d.score!=null?'<div class="muted" style="margin-top:6px">…</div>':'');
}
function resumeChat(){ show('chat'); renderMsgs(); }

// ── 雲端語音 TTS ──
// 防重複疊播:每次呼叫拿一個序號,先停掉正在播的;fetch 回來後若期間又有新的播放請求就放棄自己。
let _audio=null, _ttsCache={}, _ttsSeq=0;
async function playTTS(text, voice){
  const seq=++_ttsSeq;
  // 播音跟收音互斥:錄音中點單字卡/提示喇叭,手機的麥克風會被播放中斷,但狀態還掛在「錄音中」
  // → 之後看起來在錄其實沒錄。播之前先把錄音停乾淨(按鈕熄掉),使用者聽完再按麥克風。
  if(recording||_wantRec) stopRec();
  _postRestore();   // 播之前保險再還原一次(舊版 App session 可能還卡在錄音模式)
  if(window.STAYJP_NATIVE && window.STAYJP_NATIVE.canPlayB64) _nPost({type:'STOP_PLAY'});   // 原生播放中就先停
  try{ if(_audio){ _audio.pause(); _audio.currentTime=0; _audio=null; } }catch(e){}
  const key=(voice||'f')+'|'+text;
  try{
    let b64=_ttsCache[key];
    if(!b64){
      const t=await auth.currentUser.getIdToken();
      const r=await fetch(FN_TTS,{ method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}, body:JSON.stringify({ text, voice:voice||'f' }) });
      const d=await r.json();
      if(!r.ok || !d.audio) return;   // 靜默失敗,不打斷對話
      b64=d.audio; _ttsCache[key]=b64;
    }
    if(seq!==_ttsSeq) return;         // 期間又有人按/自動播 → 放棄,只留最新那次
    // App 內(有 OTA 的版本)交給原生 AVPlayer 播:WKWebView 錄過音後頁內播放會被 iOS 悶掉
    if(window.STAYJP_NATIVE && window.STAYJP_NATIVE.canPlayB64){ _nPost({type:'PLAY_B64', b64:b64}); return; }
    _audio=new Audio('data:audio/mp3;base64,'+b64); _audio.play().catch(()=>{});
  }catch(e){}
}

// ── 語音辨識 STT(瀏覽器) ──
// ── 語音辨識(重寫版,修「第三輪就收不了音」)──
// 三個舊坑:①舊實例沒 abort 釋放,幾輪後 Chrome 辨識服務卡死 → 每次 start 前先 abort 舊的
// ②AI 語音還在播就開麥,部分裝置直接中斷 → 開麥前先停播音 ③錯誤靜默 → 顯示原因
// 加碼補上先前的回饋:辨識「接續不覆蓋」(保留已輸入)、停頓自動續錄(按停或送出才真的停)
let rec=null, recording=false, _wantRec=false, _recBase='', _sessFin='';
// App 內改走「原生 SFSpeechRecognizer」橋(app.html 發音檢查同一條):
// WKWebView 的瀏覽器辨識不可靠(會亮著卻收不到音),而且 WebView 麥克風授權每次開 App 都重問;
// 原生辨識穩定、權限是系統級只問一次。橋:postMessage SPEECH_START/STOP ← → stayjpSpeechResult/End。
const NATIVE_STT = !!(window.STAYJP_NATIVE && window.STAYJP_NATIVE.canSpeech && window.ReactNativeWebView);
const _IN_APP0 = !!(window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp && window.ReactNativeWebView);
// App 內在提示列尾端帶 OTA 版次前 6 碼(⚙xxxxxx),一眼確認熱更新裝上了沒
// 改成函式:語言轉換(OpenCC)是非同步載入,取值時才算才能拿到正確語言版本
function noteIdle(){
  return (NATIVE_STT ? enOr('🎤 講完按停或直接送出;不準可直接改字再送。','🎤 Tap stop or just send when done; edit the text if it misheard.')
                     : enOr('🎤 用瀏覽器語音辨識(Chrome 較準);不準可直接改字再送。','🎤 Uses browser speech recognition (Chrome is most accurate); edit the text if it misheard.'))
    + (_IN_APP0 ? ' ⚙'+String(window.STAYJP_NATIVE.updateId||'embedded').slice(-6) : '');   // 取尾 6 碼:updateId 開頭是時間序,尾碼才分得出版本
}
function _nPost(o){ try{ window.ReactNativeWebView.postMessage(JSON.stringify(o)); }catch(e){} }
if(NATIVE_STT){ var _n0=document.getElementById('inNote'); if(_n0) _n0.textContent=noteIdle(); }
// 舊版 App(1.0.5,無原生辨識模組)在 App 內走 WKWebView 瀏覽器辨識:錄完 iOS session 卡在錄音模式
// → 之後 TTS 沒聲音。錄音一結束就通知原生把 session 還原成播放(新版 App 的 OTA 有對應 handler)。
const IN_APP = _IN_APP0;
function _postRestore(){ if(IN_APP && !NATIVE_STT) _nPost({type:'AUDIO_RESTORE'}); }
if(IN_APP){ var _nv0=document.getElementById('inNote'); if(_nv0) _nv0.textContent=noteIdle(); }
function _nStart(){
  // 原生辨識從按下到真的收音有半秒延遲,太早講開頭會被吃掉。新版 App 會回報 audiostart:
  // 先顯示「準備中」,收到事件才切「開講」;舊版沒事件就照舊直接顯示錄音中。
  if(window.STAYJP_NATIVE.hasSpeechStartEvt){
    document.getElementById('inNote').textContent=enOr('🎤 準備中…等一下再開口。','🎤 Getting ready… wait a moment before speaking.');
    window.stayjpSpeechStarted=function(){ if(_wantRec) document.getElementById('inNote').textContent=enOr('🎤 開講!講完按停或直接按送出。','🎤 Go ahead! Tap stop or just send when done.'); };
  }
  window.stayjpSpeechResult=function(t,fin){
    if(t==null) return;
    const el=document.getElementById('say');
    el.value=_recBase+t; autoGrow();          // 原生 transcript 是這一段的累積全文,直接接在 base 後
    if(fin && t) _sessFin=t;
  };
  window.stayjpSpeechEnd=function(err){
    recording=false;
    if(_sessFin){ _recBase+=_sessFin; _sessFin=''; }
    if(err==='not-allowed'){ _wantRec=false; updateRecBtn(); document.getElementById('inNote').textContent=enOr('🎤 麥克風權限被關了:請到 iPhone 設定 → StayJP 允許麥克風。','🎤 Microphone access is off: allow it in iPhone Settings → StayJP.'); return; }
    if(err){ _wantRec=false; updateRecBtn(); document.getElementById('inNote').textContent=enOr('🎤 辨識中斷('+err+'),再按一次麥克風重試。','🎤 Recognition stopped ('+err+') — tap the mic to retry.'); return; }
    if(_wantRec){ setTimeout(function(){ if(_wantRec){ _sessFin=''; recording=true; _nPost({type:'SPEECH_START',lang:'ja-JP'}); } },200); return; }   // 停頓自動續錄
    updateRecBtn();
  };
  _sessFin=''; recording=true; updateRecBtn();
  _nPost({type:'SPEECH_START',lang:'ja-JP'});
}
function toggleRec(){ recording||_wantRec ? stopRec() : startRec(); }
function _newRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('inNote').textContent=enOr('這個瀏覽器不支援語音辨識,請直接打字(手機 Chrome / Safari 支援)。','Speech recognition is not supported in this browser — please type instead (mobile Chrome / Safari work).'); return null; }
  try{ if(rec){ rec.onend=null; rec.onerror=null; rec.onresult=null; rec.abort(); } }catch(e){}   // 釋放舊實例,防服務卡死
  const r=new SR(); r.lang='ja-JP'; r.interimResults=true; r.continuous=true;
  r.onresult=e=>{
    let fin='', interim='';
    for(let i=0;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t; else interim+=t; }
    const el=document.getElementById('say');
    // fin 是「這個實例至今全部」的確定段落(每次事件整批重算),所以只暫存、不累加進 base——
    // 之前邊播邊累加會讓同一段被算兩次(base 已含 + fin 再含一次 → 文字出現兩次)
    _sessFin=fin;
    el.value=_recBase+fin+interim;   // 接在已輸入內容後面,不覆蓋
    autoGrow();
  };
  r.onerror=e=>{
    const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed'){ _wantRec=false; document.getElementById('inNote').textContent=enOr('🎤 麥克風權限被擋了:請允許此網站使用麥克風後再試。','🎤 Microphone blocked: allow mic access for this site and try again.'); }
    else if(c==='no-speech'){ /* 沒聽到聲音:交給 onend 自動續錄 */ }
    else if(c&&c!=='aborted'){ document.getElementById('inNote').textContent=enOr('🎤 辨識中斷('+c+'),再按一次麥克風重試。','🎤 Recognition stopped ('+c+') — tap the mic to retry.'); _wantRec=false; }
  };
  r.onend=()=>{
    recording=false;
    if(_sessFin){ _recBase+=_sessFin; _sessFin=''; }   // 實例結束才併入 base(新實例的 results 會歸零重來)
    if(_wantRec){ setTimeout(()=>{ if(_wantRec) _startInstance(); },150); return; }   // 停頓自動續錄
    updateRecBtn();
    _postRestore();   // 錄音真的結束了 → 舊版 App 要還原音訊 session,不然接下來 TTS 沒聲音
  };
  return r;
}
function _startInstance(){
  _sessFin='';
  rec=_newRec(); if(!rec) return;
  try{ rec.start(); recording=true; updateRecBtn(); }
  catch(e){ setTimeout(()=>{ try{ rec.start(); recording=true; updateRecBtn(); }catch(e2){ _wantRec=false; recording=false; updateRecBtn(); } },200); }
}
function startRec(){
  try{ if(_audio){ _audio.pause(); _audio=null; } }catch(e){}   // 要講話先閉嘴:停掉正在播的 AI 語音,避免開麥被中斷
  if(window.STAYJP_NATIVE && window.STAYJP_NATIVE.canPlayB64) _nPost({type:'STOP_PLAY'});   // 原生播放也要停
  _wantRec=true;
  _recBase=(document.getElementById('say').value||'');
  if(_recBase && !/[\s、。]$/.test(_recBase)) _recBase+='';   // 接續原文
  document.getElementById('inNote').textContent=enOr('🎤 錄音中…講完按停或直接按送出。','🎤 Recording… tap stop or just send when done.');
  if(NATIVE_STT){ _nStart(); return; }
  _startInstance();
}
function stopRec(){
  _wantRec=false;
  if(NATIVE_STT){ _nPost({type:'SPEECH_STOP'}); }   // 原生端 end 事件會回 stayjpSpeechEnd 併入 final
  else { try{ rec&&rec.stop(); }catch(e){} }
  recording=false; updateRecBtn();
  const n=document.getElementById('inNote'); if(n) n.textContent=noteIdle();
}
// 送出訊息時用的「硬停」:輸入框已清空,引擎遲到的 onresult flush 絕不能再寫回舊文字
// (之前用 stopRec 軟停,stop() 之後還會補一個 final 結果 → 送出後欄位又冒出剛講的話)
function hardStopRec(){
  _wantRec=false;
  if(NATIVE_STT){ window.stayjpSpeechResult=function(){}; window.stayjpSpeechEnd=function(){}; _nPost({type:'SPEECH_STOP'}); }   // 掐掉回呼,遲到結果不寫回
  try{ if(rec){ rec.onend=null; rec.onerror=null; rec.onresult=null; rec.abort(); } }catch(e){}
  rec=null; recording=false; _recBase=''; _sessFin='';
  updateRecBtn();
  _postRestore();   // abort 掉不會走 onend → 這裡直接還原
  const n=document.getElementById('inNote'); if(n) n.textContent=noteIdle();
}
function updateRecBtn(){ const b=document.getElementById('recBtn'); if(b) b.classList.toggle('on',recording||_wantRec); }

function autoGrow(){ const el=document.getElementById('say'); if(!el)return; el.style.height='auto'; el.style.height=Math.min(120,el.scrollHeight)+'px'; }
document.addEventListener('input',e=>{ if(e.target && e.target.id==='say') autoGrow(); });
document.addEventListener('keydown',e=>{ if(e.target && e.target.id==='say' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMine(); } });

// ── 靜態 UI 三語:en 逐項換字、zh-CN 走 OpenCC 整頁轉(非同步,自帶重試)──
(function initStaticI18n(){
  const L=I18n.getLang();
  if(L==='zh-CN'){ document.title='AI 情境对话｜StayJP 日本再留计划'; cvtStaticUI(document.body); return; }
  if(L!=='en') return;
  document.title='AI Conversation | StayJP';
  const q=s=>document.querySelector(s);
  const set=(el,txt)=>{ if(el) el.textContent=txt; };
  set(q('#boot div:nth-child(2)'),'Loading…');
  set(q('#pick a'),'‹ Back');
  const h1=q('#pick h1'); if(h1) h1.innerHTML='🗣 Scenario Chat <span class="muted" style="font-weight:400">Beta</span>';
  set(q('#pick .sub'),'Pick a scene and level — the AI plays the other person and chats with you turn by turn. Speak (speech recognition) or type. 1 free session; Premium gets 3 per day.');
  const note=q('#pick > .muted'); if(note) note.innerHTML='💡 This is conversation practice — for single-sentence shadowing, go to <a href="speak.html" style="color:var(--accent)">Speaking practice</a>.';
  const cn=q('#cnBtn'); if(cn){ cn.textContent='ZH'; cn.title='Hide Chinese translations and rely on Japanese + audio to train listening'; }
  set(q('#endBtn'),'End & review');
  set(q('#topicBtn'),'Change topic');
  set(q('#topicBtn2'),'Change topic');
  set(q('#resumeBtn'),'Back to chat');
  set(q('#rvTtl'),'📋 Chat review');
  const say=q('#say'); if(say) say.placeholder='Speak or type…';
  set(q('#sendBtn'),'Send');
  set(q('#inNote'),noteIdle());
})();

// ── auth ──
auth.onAuthStateChanged(u=>{
  try{var _b=document.getElementById("boot"); if(_b)_b.remove();}catch(e){}
  document.getElementById('app').style.display='block';
  renderLvTabs(); renderScenes(); show('pick');
  if(I18n.getLang()==='zh-CN') cvtStaticUI(document.body);   // 初次渲染可能早於 OpenCC 載完 → 再掃一次(自帶重試)
});
</script>
