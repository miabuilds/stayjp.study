<style>
  :root{--bg:#F3EEE6;--card:#FCFAF6;--ink:#26221E;--ink2:#6E675F;--ink3:#A79F94;--ac:#C05539;--ac-deep:#9E4028;--ac-soft:#F6E3DB;--line:#E6DFD3;--jp:#1F3A5F;--jp-soft:#E9EFF6;--zh:#6E675F;--en:#2E5E44;--en-soft:#E7F1EA;--warn:#B4791C;--warn-soft:#FBF1DC;--hi:#C0392B;--hi-soft:#FBE6E3;--ok:#2E8B57;--ok-soft:#E3F3EA;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--jpf:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",var(--sans);}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:64px}
  em{font-style:normal;color:var(--ac-deep);font-weight:700;background:linear-gradient(transparent 60%,var(--ac-soft) 60%)}
  header{position:sticky;top:0;z-index:20;background:rgba(243,238,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 20px}
  .hwrap{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .htitle{font-size:18px;font-weight:800;letter-spacing:-.01em}.htitle span{color:var(--ac)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;font-size:12.5px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600;color:var(--ink2)}.pill b{color:var(--ink)}
  .pill.ok{background:var(--ok-soft);border-color:#C4E4D2;color:var(--ok)}
  .toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
  .toggle button{border:0;background:var(--card);padding:7px 13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
  .toggle button.on{background:var(--ac);color:#fff}
  main{max-width:900px;margin:0 auto;padding:20px}
  .note-top{font-size:12.5px;color:var(--ink3);margin-bottom:8px;line-height:1.7}
  .models{font-size:11.5px;color:var(--ink3);margin-bottom:16px}.models b{color:var(--ink2)}
  .cat-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .cat-h .zh{color:var(--ink3);font-weight:600;letter-spacing:0;text-transform:none;margin-left:6px;font-size:12px}
  .gc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(60,40,30,.04)}
  .gc.fixed{border-color:#C4E4D2;box-shadow:0 0 0 1px #C4E4D2}
  .gtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
  .gid{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:#fff;background:var(--ink3);border-radius:5px;padding:2px 7px;flex:none}
  .fixed .gid{background:var(--ok)}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
  .badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.keep{background:#E7EEF9;color:#2F5C96}
  .gt{font-family:var(--jpf);font-size:19px;font-weight:700;line-height:1.4;margin:2px 0 2px}
  .gp{font-family:var(--jpf);font-size:13px;color:var(--ink2);background:var(--jp-soft);border-radius:7px;padding:5px 10px;display:inline-block;margin:2px 0 12px}
  .ex-row{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:14px}
  .ex-box{border-radius:9px;padding:9px 12px}.ex-box.zh{background:#F3EEE6}.ex-box.en{background:var(--en-soft)}
  .ex-lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;opacity:.75}
  .ex-box.zh .ex-lab{color:var(--zh)}.ex-box.en .ex-lab{color:var(--en)}
  .ex-box .txt{font-size:13.5px;line-height:1.6}.ex-box.zh .txt{color:var(--ink)}.ex-box.en .txt{color:#234}
  .egs{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .eg{border-left:3px solid var(--line);padding:2px 0 2px 12px}
  .eg .j{font-family:var(--jpf);font-size:15px;color:var(--jp);font-weight:500;line-height:1.7}
  .eg .pair{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:3px}
  .eg .z{font-size:12.5px;color:var(--zh)}.eg .e{font-size:12.5px;color:var(--en);font-weight:500}
  .eg .z::before{content:"中 ";font-size:10px;color:var(--ink3);font-weight:700}
  .eg .e::before{content:"EN ";font-size:10px;color:#8AB49A;font-weight:700}
  .gn{font-size:12.5px;color:var(--ink2);background:#F3EEE6;border-radius:8px;padding:8px 12px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.gn .en{color:var(--en)}
  .flagbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .flagbox summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:6px}
  .flagbox summary::-webkit-details-marker{display:none}
  .flagbox summary::before{content:"\25B8";transition:transform .15s}
  .flagbox[open] summary::before{transform:rotate(90deg)}
  .fitem{margin-top:10px;font-size:12.5px;line-height:1.65;background:#F4EFE7;border-radius:8px;padding:10px 12px}
  .fmeta{font-size:11px;font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fmeta .sev{padding:1px 7px;border-radius:999px}
  .sev.high{background:var(--hi);color:#fff}.sev.medium{background:var(--warn);color:#fff}.sev.low{background:var(--ink3);color:#fff}
  .fmeta .field{font-family:ui-monospace,monospace;color:var(--ink2)}
  .fmeta .by{margin-left:auto;font-weight:800;padding:1px 7px;border-radius:999px;text-transform:uppercase;font-size:10px}
  .by.opus{background:#EFE3F7;color:#7A3FA0}.by.sonnet{background:#E3EEF7;color:#2F6CA0}.by.fable{background:#F7E7E3;color:#B0562F}.by.haiku{background:#E3F7EC;color:#2E8B57}
  @media(max-width:640px){.ex-row,.eg .pair,.gn{grid-template-columns:1fr}.stats{width:100%;margin-left:0}}
</style></head>

<script>
const FLAGS = {"n5-9": [{"field": "ex", "severity": "medium", "issue": "The explanation reduces ～ませんか to \"more polite than ましょう,\" which mischaracterizes the grammar. ～ませんか is not simply a politer ましょう; its function is to make a softer invitation that leaves the listener room to decline (asking rather than proposing jointly), whereas ましょう assumes agreement. Framing it purely as a politeness ranking loses the core nuance.", "suggestion": "A soft invitation: \"Won't you ~?\" / \"Would you like to ~?\" Unlike ましょう (which assumes the listener will join in), ～ませんか asks and leaves them free to decline, so it feels more considerate.", "by": "opus"}, {"field": "ex", "severity": "low", "issue": "The explanation frames ませんか as simply 'more polite than ましょう', but the real functional difference is deference/leaving the choice to the listener (a question form) vs. ましょう which asserts the speaker's proposal more directly. Calling it purely a politeness gradient is a bit thin and could mislead learners into thinking it's just a formality register difference.", "suggestion": "'A soft, deferential invitation that leaves the decision to the listener ('Won't you...?'), gentler than the more assertive 「ましょう」 ('Let's...').'", "by": "sonnet"}], "n5-11": [{"field": "eg", "severity": "medium", "issue": "机の上をきれいにします means to make the (physical) desk surface clean/tidy. Rendering it as \"tidy up the desktop\" is ambiguous in English and will most naturally be read as a computer desktop, which is a mistranslation of 机の上 (the top of the desk).", "suggestion": "\"I'll tidy up the desk.\" (or \"I'll make the desktop tidy,\" i.e. the surface of the desk)", "by": "opus"}, {"field": "eg[1]", "severity": "medium", "issue": "「机の上」/「桌面」 means the surface of a physical desk, but \"the desktop\" in English is most naturally read as a computer desktop, which misleads the learner about what the Japanese sentence says.", "suggestion": "I'll tidy up (the top of) my desk.", "by": "fable"}], "n5-5": [{"field": "eg", "severity": "low", "issue": "\"The old school building used to not be a library\" is grammatically clumsy English (\"used to not be\"). The Japanese じゃありませんでした is simply the negative past of a noun predicate; the sentence doesn't inherently carry the habitual \"used to\" nuance beyond the past tense already implied by 昔.", "suggestion": "\"The old school building wasn't a library back then.\" (or \"...didn't used to be a library.\")", "by": "opus"}, {"field": "eg[1]", "severity": "low", "issue": "\"used to not be\" is awkward, non-standard English for a plain past negative (じゃありませんでした simply means \"was not\").", "suggestion": "The old school building was not a library back then. (or: ...didn't use to be a library.)", "by": "fable"}], "n5-7": [{"field": "eg", "severity": "low", "issue": "Same clumsy \"used to not be\" construction as n5-5: 昔の神戸はにぎやかじゃありませんでした is the negative past of a な-adjective. \"Kobe used to not be lively in the old days\" is redundant (\"used to\" + \"in the old days\") and awkward.", "suggestion": "\"Kobe wasn't lively in the old days.\"", "by": "opus"}, {"field": "eg[1]", "severity": "low", "issue": "\"used to not be lively\" is awkward English; the Japanese is a simple past negative (\"was not lively\").", "suggestion": "Kobe was not lively in the old days.", "by": "fable"}], "n5-4": [{"field": "eg", "severity": "low", "issue": "\"This novel is not interesting\" is a valid rendering of 面白くないです, but 面白い here more idiomatically means \"interesting/fun/entertaining\" for a novel; \"not interesting\" is fine, though \"isn't very good/isn't entertaining\" can read more naturally. Minor naturalness note only.", "suggestion": "\"This novel isn't interesting.\" (contraction reads more naturally; acceptable as-is)", "by": "opus"}], "n5-16": [{"field": "ex", "severity": "medium", "issue": "Stating that も 'replaces は, が, and を' is only true for those three particles; it does not replace/is not a substitute in the same way for locative or instrumental particles like に or で, where も instead attaches after them (e.g. ここにも, それでも). Presented flatly as 'replaces', a learner could over-generalize and drop に/で incorrectly.", "suggestion": "'Means \"also/too.\" It replaces the particles は, が, and を, but attaches after other particles such as に or で (e.g. ここにも \"here too\").'", "by": "sonnet"}], "n5-26": [{"field": "eg", "severity": "medium", "issue": "eg2 「コンビニまで歩きます」 is rendered 'I'll walk to the convenience store.' This loses the specific nuance of まで that this grammar point teaches. まで marks the endpoint/extent ('walk AS FAR AS the convenience store'), contrasting with に/へ (a plain destination). The plain 'walk to' reads identically to a に/へ sentence and doesn't illustrate the 'up to / until the limit' meaning stated in the ex field.", "suggestion": "I'll walk as far as the convenience store.", "by": "opus"}], "n5-32": [{"field": "eg", "severity": "low", "issue": "eg1 「韓国語がわかります」 rendered 'I understand Korean' is fine, but for an N5 learner the point is that わかる marks its object with が (not を). The English is natural but the pedagogical contrast with を is invisible; consider it acceptable as-is, only minor.", "suggestion": "I understand Korean. (keep, or note that the object of わかる takes が, not を)", "by": "opus"}, {"field": "eg[0]", "severity": "low", "issue": "「韓国語がわかります」literally means 'I understand/can understand Korean' (potential/ability nuance from わかる), which the English 'I understand Korean' does convey adequately, but combined with the cat explanation mentioning 'ability' it could be slightly clearer as 'I can understand Korean' to match the ability framing in ex.", "suggestion": "\"I can understand Korean.\"", "by": "sonnet"}], "n5-31": [{"field": "ex", "severity": "low", "issue": "The ex 'Indicates a reason or cause; \"because A, so B.\"' is accurate, but から attaches to the reason clause (A) and states it more subjectively than ので. The eg sentences are correctly translated. No real error; naturalness is fine.", "suggestion": "No change needed (listed only for completeness; not a defect).", "by": "opus"}, {"field": "ex", "severity": "low", "issue": "The gloss \"because A, so B\" is ungrammatical English (double conjunction, a direct calque of Chinese 因為A所以B); the explanation of から itself is accurate.", "suggestion": "Indicates a reason or cause; \"A, so B\" / \"B, because A.\"", "by": "fable"}], "n5-20": [{"field": "ex", "severity": "medium", "issue": "へ and に are not fully interchangeable in nuance — へ emphasizes direction/orientation of movement, while に emphasizes the specific destination/arrival point. Saying they are simply \"interchangeable\" overstates it; in most basic N5 sentences they're swappable but the explanation should note へ is more about direction, not destination, per the Japanese p field '場所＋へ' and standard N5 teaching.", "suggestion": "\"Indicates the direction of movement; pronounced \\\"e.\\\" Often interchangeable with に, though へ emphasizes direction while に emphasizes the specific destination.\"", "by": "sonnet"}, {"field": "ex_en", "severity": "medium", "issue": "Explanation states へ is \"Interchangeable with に\" — this oversimplifies. While both mark direction/destination, へ emphasizes directional movement more strongly, while に emphasizes the destination as a goal/location. Not all contexts allow perfect substitution (へ is more natural with motion verbs; に can work with both motion and static positions).", "suggestion": "Change \"Interchangeable with に\" to something like \"Often used interchangeably with に for direction, but へ emphasizes the direction of movement itself\" OR \"Similar to に for marking destinations, though へ has a stronger directional emphasis.\"", "by": "haiku"}], "n5-22": [{"field": "eg[1]", "severity": "low", "issue": "「その企画を進めますか」— 'entaimes' translated as 'moving that project forward' is fine but slightly formal/business-jargon compared to the neutral Japanese; not wrong, just a stylistic note, no real error.", "suggestion": "No change needed; optionally 'Who are you working on that project with?' for more natural register.", "by": "sonnet"}], "n5-40": [{"field": "eg1", "severity": "medium", "issue": "を here marks the point of departure/separation (卒業する governs を for the thing one graduates FROM). 'I graduate from high school' is correct, but labeling it '(point of departure)' is misleading in English — this を is the 'departure/separation' use (leaving a place/institution), not a physical starting point. The original 離開點 means 'point of separation/leaving', which reads oddly as 'point of departure' (which suggests where you start a journey).", "suggestion": "Change the parenthetical to '(separation / leaving)' and in the ex line change 'point of departure/passing through' to 'point of separation / passing through'.", "by": "opus"}, {"field": "eg3", "severity": "low", "issue": "'The youngest on the team.' is a noun fragment, but the Japanese チームでいちばん若い is a full predicate ('is the youngest on the team'). The other eg lines are rendered as full sentences, so this fragment is inconsistent and loses the predicative nuance.", "suggestion": "'(I'm / He's) the youngest on the team.' or 'The youngest on the team.' with a note it is a predicate.", "by": "opus"}, {"field": "ex", "severity": "medium", "issue": "The pattern list glosses を as \"point of departure/passing through\" but the only example given is 卒業します (graduate FROM), a pure departure-point use, not a passing-through use. This isn't wrong per se but the explanation bundles two distinct を functions (departure point vs. passing-through, e.g. 公園を歩く) while only illustrating one, which could mislead a learner into thinking they're the same usage.", "suggestion": "Split or clarify: \"を (point of departure, e.g. 卒業する)\" — or add a passing-through example if that nuance is meant to be taught here.", "by": "sonnet"}, {"field": "eg", "severity": "low", "issue": "\"The youngest on the team. (scope)\" for チームでいちばん若い renders で as \"scope\" but drops any verb — the English is a sentence fragment/noun phrase whereas the Japanese いちばん若い is a predicate (\"[is] the youngest\"). Also 'で' here marks the comparison group/domain, which \"scope\" only loosely captures compared to clearer terms like \"domain of comparison.\"", "suggestion": "\"[I am] the youngest on the team. (domain/group for comparison)\"", "by": "sonnet"}, {"field": "eg[0]", "severity": "low", "issue": "\"I graduate from high school\" in the simple present is unnatural English for 高校を卒業します (a specific upcoming/statement event); simple present suggests a habitual action.", "suggestion": "I will graduate from high school. (point of departure)", "by": "fable"}], "n5-51": [{"field": "eg2", "severity": "medium", "issue": "姉が雑誌をくれました is glossed 'My older sister gave me a magazine.' The point of くれる is that the receiver is the speaker (or speaker's in-group) — the 'me' is grammatically essential and carries the inward-direction nuance that distinguishes くれる from あげる. The English does include 'me', so it is correct; however the ex text lists the three verbs as 'あげます/もらいます/くれます' but the English ex omits explaining くれる's inward direction (giver→speaker), which is the whole reason くれる exists. Recommend making that explicit.", "suggestion": "In ex, add: 'あげる = give (outward, speaker→others); もらう = receive; くれる = give TO the speaker/in-group (inward).'", "by": "opus"}, {"field": "ex", "severity": "low", "issue": "The paradigm header lists three verbs (あげ/もらい/くれ) but the sentence 'The three giving/receiving verbs' then discusses やります, a fourth form. It reads as if やります is one of the three. Clarify that やる is the humble/downward variant of あげる, not a separate member of the trio.", "suggestion": "'The three giving/receiving verbs (あげる/もらう/くれる). やる is a downward variant of あげる, used for giving to those below oneself (plants, animals, subordinates).'", "by": "opus"}, {"field": "ex", "severity": "medium", "issue": "The explanation says \"やります is used for giving to someone/something below oneself (e.g., plants, animals)\" — accurate for やる/やります itself, but the surrounding sentence lists only two verbs (あげます giving, もらいます receiving) then jumps to a third (くれます, giving-to-me) without ever stating くれます in the prose explanation, even though it's the example used (姉が雑誌をくれました). A learner reading only the 'ex' field would not learn what くれます means at all — only あげます, もらいます, and やります are named, but くれます (arguably the trickiest of the three core verbs, and the one actually shown in example 2) is left unexplained.", "suggestion": "\"The three giving/receiving verbs: あげます (I give to others), もらいます (I receive), くれます (someone gives to me/my in-group). やります is used for giving to someone/something below oneself (e.g., plants, animals) instead of あげます.\"", "by": "sonnet"}], "n5-43": [{"field": "ex", "severity": "low", "issue": "'Dictionary form = plain-style affirmative. Nai form = plain-style negative.' is accurate, but the pattern note only states 'う→わない' for -u ending godan verbs. The English ex should note this is specifically the negative (ない form) stem rule; as written a learner might think 辞書形 also involves う→わ. Minor clarity issue.", "suggestion": "'For the nai form of godan verbs ending in the -u sound (like 買う), う→わ before ない (買う→買わない).'", "by": "opus"}, {"field": "ex_en", "severity": "high", "issue": "Explanation covers only godan verbs (う→わない) and is missing ichidan pattern entirely. Per p: \"あ段＋ない\" is vague; ichidan rule is い→ない. Learner sees only one pattern when both are essential.", "suggestion": "Clarify both patterns: \"Dictionary form = plain-style affirmative. Nai form = plain-style negative. For godan verbs ending in -u: う→わない. For ichidan verbs: い→ない.\"", "by": "haiku"}], "n5-36": [{"field": "eg2", "severity": "low", "issue": "お願いしたいんです けど… glossed 'There's something I'd like to ask you...' is a reasonable natural rendering, but お願いする is closer to 'ask a favor / make a request' than neutral 'ask'. 'ask you' could be misread as asking a question. The trailing けど softens as a lead-in, which is captured well by the ellipsis.", "suggestion": "'There's a favor I'd like to ask...' or 'I have a request, if that's okay...'", "by": "opus"}], "n5-42": [{"field": "ex", "severity": "low", "issue": "States the て-form sound-change groups but omits stating what て-form is used for (only calls it \"the most important conjugation\"), losing the functional nuance present implicitly for a learner-facing card; not a mistranslation but an explanatory gap versus the Chinese original which has the same gap, so this is inherited rather than introduced — flagging only as a minor completeness note.", "suggestion": "Optionally add: \"...used for requests (~てください), sequencing actions, and progressive/state forms (~ている).\"", "by": "sonnet"}, {"field": "ex_en", "severity": "high", "issue": "Explanation covers only godan verbs and missing ichidan pattern. Per p: \"五段音便＋て／一段：去る＋て\". Ichidan instruction \"drop る + て\" is absent, leaving learners without half the conjugation rule they need.", "suggestion": "Add ichidan pattern: \"For ichidan verbs: drop る + て.\" Example: \"Ichidan verbs: drop る + て (e.g., 見る→見て).\" So full ex_en reads: \"...For godan verbs (sound changes): く→いて, ぐ→いで, す→して, む/ぶ/ぬ→んで, う/つ/る→って. For ichidan verbs: drop る + て. Exception: 行く→行って.\"", "by": "haiku"}], "n5-45": [{"field": "eg", "severity": "low", "issue": "\"taisetsu da / ja nai / datta / ja nakatta: the four na-adjective forms\" is correct, but the romaji \"da\" for だ can read oddly without the noun+na-adjective context (大切だ meaning \"[it] is important\"); minor clarity nuance only, no actual error.", "suggestion": "Could gloss as \"important: da / ja nai / datta / ja nakatta\" for clarity, but current version is acceptable.", "by": "sonnet"}, {"field": "ex_en", "severity": "high", "issue": "Explanation lists only な-adjective forms and omits い-adjectives entirely. Per p: \"動詞・い形・な形・名詞 各四種變化\" (verbs, i-adj, na-adj, nouns all need 4-form breakdown). Learner sees incomplete picture.", "suggestion": "Add い-adjective conjugation: \"Dictionary form / nai form / ta form / nakatta form. For i-adjectives: い→くない / かった / くなかった (e.g., 美しい / 美しくない / 美しかった / 美しくなかった). For na-adjectives: だ / じゃない / だった / じゃなかった.\"", "by": "haiku"}], "n5-58": [{"field": "ex", "severity": "high", "issue": "The Japanese pattern is 「～が欲しいです・～たいです」 and the note 「只用於第一人稱」 (used only for the first person) is a common oversimplification. In Japanese these forms are restricted to the first person only in plain declarative statements; they are freely used for the second person in questions (e.g. 何が欲しいですか / 温泉に入りたいですか). The English 'Both are used only for the first person' reproduces this inaccuracy and would mislead a learner into thinking questions to a listener are ungrammatical.", "suggestion": "Add a qualifier: 'In plain statements these describe the speaker's own desire (first person); to ask about the listener's wish, use them in a question.'", "by": "opus"}], "n5-67": [{"field": "ex", "severity": "high", "issue": "Mislabeling: ゆっくり and はっきり are adverbs (擬態語/副詞), NOT 'mimetic words' in the sense implied, and more importantly the English calls them 'Mimetic/adverbial words ... are a distinctive feature of Japanese' — but the eg only shows ゆっくり. The bigger problem: the source header 擬聲語 (onomatopoeia/mimetics) is rendered fine, but ゆっくり is a manner adverb, not onomatopoeia. Calling ゆっくり 'mimetic' is imprecise. Acceptable but the English lumps two categories; low-risk. Downgrade if lenient.", "suggestion": "'Adverbs of manner (ゆっくり slowly, はっきり clearly) and mimetic/onomatopoeic words are a distinctive feature of Japanese.'", "by": "opus"}], "n5-60": [{"field": "eg", "severity": "low", "issue": "Second example 「あの映画は感動的でしょう？」 is translated 'That movie is moving, isn't it?' The Japanese 感動的でしょう seeks confirmation of a supposition the speaker holds, closer to 'That movie must be moving, right?' / 'I bet that movie is moving, isn't it?'. 'is moving, isn't it?' reads as confirming shared known fact rather than a guess-seeking-confirmation, slightly flattening the でしょう nuance.", "suggestion": "'That movie is moving, right?' or 'That movie must be quite moving, isn't it?'", "by": "opus"}], "n5-66": [{"field": "cat", "severity": "medium", "issue": "The item's Japanese title is 副詞 (adverbs) and p lists とても・たくさん・よく・あまり・全然. The English ex ONLY covers the frequency-adverb ordering (いつも>よく>...>全然) and omits degree adverbs like とても/たくさん entirely, yet the first eg 'It was very fun' (とても楽しかったです) demonstrates a degree adverb that the explanation never addresses. The explanation and the first example are mismatched — a learner reading 'From most to least frequent...' cannot connect it to とても.", "suggestion": "Note that this item covers adverbs generally (degree: とても/たくさん; frequency: いつも～全然), then give the frequency ordering. That makes the とても example coherent with the explanation.", "by": "opus"}, {"field": "ex", "severity": "medium", "issue": "The Japanese 'p' field lists とても and たくさん alongside the frequency adverbs, and eg[0] ('とても楽しかったです' → 'It was very fun.') illustrates とても, a degree adverb — but the English 'ex' explanation only describes the frequency scale (いつも>よく>ときどき>たまに>あまり>全然) and never mentions とても/たくさん at all. A learner reading only the English explanation has no idea what category the first example sentence is even demonstrating.", "suggestion": "Add a sentence noting that とても (very) and たくさん (a lot) are degree/quantity adverbs, e.g.: \"とても (very) and たくさん (a lot) express degree/quantity. Separately, frequency adverbs range from most to least frequent: いつも (always) > よく (often) > ときどき (sometimes) > たまに (occasionally) > あまり (not much) > 全然 (not at all), with あまり and 全然 pairing with a negative.\"", "by": "sonnet"}], "n5-68": [{"field": "eg", "severity": "low", "issue": "「村田という人から連絡が。」 is a trailing/elliptical sentence (連絡が[ありました] omitted). English 'Someone named Murata contacted me' is a fine natural rendering but adds a definite subject/object ('me') not in the source and completes the ellipsis; acceptable for a learner gloss, minor nuance loss of the trailing-off style.", "suggestion": "Fine as-is; optionally 'A person called Murata got in touch.' to stay closer.", "by": "opus"}, {"field": "ex", "severity": "low", "issue": "\"A B called A\" is confusing because the indefinite article \"A\" collides with the placeholder noun A; on first read it looks like a typo or that B is called \"A\" twice.", "suggestion": "Rephrase to avoid the article/placeholder collision, e.g. \"'B called/named A' (noun A + という + noun B). Used to introduce a name or to quote.\"", "by": "fable"}, {"field": "ex", "severity": "medium", "issue": "English explanation says \"A B called A\" which is backwards and confusing. The actual pattern structure is [Noun A] + という + [Noun B] = \"B called A\". The current phrasing would lead learners to misunderstand which part is the name and which is the noun being modified.", "suggestion": "Change to: \"Noun B called A (noun A + という + noun B). Used to introduce or name something.\" Or more naturally: \"B named A / B called A. Used to introduce a name or to quote.\"", "by": "haiku"}], "n5-37": [{"field": "eg[0]", "severity": "medium", "issue": "\"I'm going to buy souvenirs\" reads as plain future intention in English (\"gonna buy\"), so it fails to demonstrate the grammar point being taught: physical movement + purpose (〜に行く). A learner can't see the 'motion toward a place in order to do something' meaning that the card is about.", "suggestion": "I'm going out to buy souvenirs. (or: I'll go (there) to buy souvenirs.)", "by": "fable"}], "n5-3": [{"field": "eg[1]", "severity": "medium", "issue": "Example English contradicts structural explanation. The Japanese 「新しい店長は親切じゃありません」contains 「親切」 (na-adjective), but the example sentence uses い-adjective structure (「新しい」modifies 「店長」 without な). The card teaches na-adjectives in 「です」 form but the negative example mixes both adjective types confusingly.", "suggestion": "Clarify: The modifying adjective 「新しい」 is an い-adjective (separate from the predicate). Better example: 「この新しい店長は親切じゃありません。」or provide separate examples for each adjective type.", "by": "haiku"}], "n5-10": [{"field": "eg[1]", "severity": "medium", "issue": "English example 「I've gotten good at the piano」 uses present perfect, but the Japanese 「ピアノが上手になりました」is past tense (completed state change), not ongoing result. The 「-ました」indicates a finished action, not a current state continuing from a past action.", "suggestion": "Use simple past: 「I became good at the piano」or 「I got good at the piano」 to better match the Japanese completed action.", "by": "haiku"}], "n5-12": [{"field": "eg[0]", "severity": "low", "issue": "English 「Let's go into that cafe」is slightly less natural than 「Let's enter that cafe」 or 「Let's go to that cafe」, since 「入りましょう」is more specifically about entering/going in, not just going to a location.", "suggestion": "「Let's go into that cafe」is acceptable but 「Let's enter that cafe」is more precise to the verb 「入る」.", "by": "haiku"}], "n5-14": [{"field": "eg[0]", "severity": "medium", "issue": "The examples 「食べません ＝ 食べないです」and 「寒くありません ＝ 寒くないです」should demonstrate polite vs. colloquial distinction, but the English translation 「do not eat」 and 「not cold」 are incomplete/fragment forms, not full sentences. This doesn't show how learners would use them in actual speech.", "suggestion": "Use complete sentences: 「I don't eat」or 「I will not eat」 and 「It is not cold」 to show how these forms function in real communication.", "by": "haiku"}], "n5-15": [{"field": "eg[1]", "severity": "low", "issue": "English translation 「As for that cake, my older sister baked it」is accurate but slightly awkward. The phrasing could be more natural while preserving the topical-contrastive meaning of は.", "suggestion": "Consider: 「As for the cake, my older sister baked it」or 「That cake was baked by my older sister」(though the second loses the は nuance slightly).", "by": "haiku"}], "n5-44": [{"field": "ex_en", "severity": "medium", "issue": "Explanation assumes learner already knows て-form construction (refers to \"sound changes\") before teaching た-form. Learner unfamiliar with て→た rule will not understand \"changes the same way as the て form.\" Backwards pedagogical order.", "suggestion": "Either explain godan/ichidan patterns directly (\"For godan: sound changes + た (e.g., 話す→話した). For ichidan: drop る + た (e.g., 見る→見た).\") OR reference n5-42: \"See n5-42 (て-form) for sound change patterns; replace て with た.\"", "by": "haiku"}], "n5-47": [{"field": "ex_en", "severity": "medium", "issue": "Phrasing \"add に\" is ambiguous. Learner may think に is added AFTER な (静かなに) rather than REPLACING な. The mechanics are unclear.", "suggestion": "Clarify the replacement: \"I-adjectives: い→く. Na-adjectives: drop な and add に (or: replace な with に).\" Example for clarity: \"静かな → 静かに (quiet na → quietly).\"", "by": "haiku"}], "n5-56": [{"field": "eg[1]", "severity": "medium", "issue": "English uses \"goes up and down\" which suggests continuous motion, but the Japanese 気温が高かったり低かったりします + source 時高時低 means alternating states (sometimes high, sometimes low). This could mislead learners about the たり～たり pattern, which emphasizes listed representative actions with implied others, not continuous fluctuation.", "suggestion": "Change to: \"The temperature is sometimes high, sometimes low.\" or \"The temperature varies (high and low)\" to reflect the alternating/listing nature of たり～たり.", "by": "haiku"}]};
const FIXED = new Set(["n5-3", "n5-4", "n5-5", "n5-7", "n5-9", "n5-10", "n5-11", "n5-14", "n5-16", "n5-20", "n5-22", "n5-26", "n5-31", "n5-32", "n5-36", "n5-37", "n5-40", "n5-42", "n5-43", "n5-44", "n5-45", "n5-47", "n5-51", "n5-56", "n5-60", "n5-66", "n5-67", "n5-68"]);
let FILTER='all';
function esc(s){return (s==null?'':String(s))}
function sevOrder(f){return {high:0,medium:1,low:2}[f.severity]??3}
function render(){
  const listEl=document.getElementById('list'); listEl.innerHTML=''; let lastCat=null;
  N5.forEach(item=>{
    const en=(typeof N5_EN!=='undefined'&&N5_EN[item.id])||null;
    const fl=(FLAGS[item.id]||[]).slice().sort((a,b)=>sevOrder(a)-sevOrder(b));
    const touched=fl.length>0;
    if(FILTER==='flag'&&!touched) return;
    if(item.cat!==lastCat){lastCat=item.cat;const h=document.createElement('div');h.className='cat-h';h.innerHTML=esc(en?en.cat:item.cat)+'<span class="zh">'+esc(item.cat)+'</span>';listEl.appendChild(h);}
    const isFixed=FIXED.has(item.id);
    const card=document.createElement('div'); card.className='gc'+(isFixed?' fixed':'');
    let egHtml=(item.eg||[]).map((e,i)=>{const eEn=en&&en.eg&&en.eg[i]!=null?en.eg[i]:'';return '<div class="eg"><div class="j">'+esc(e.j)+'</div><div class="pair"><div class="z">'+esc(e.z)+'</div><div class="e">'+esc(eEn)+'</div></div></div>';}).join('');
    let flHtml='';
    if(touched){
      const lab=isFixed?('修正依據 · '+fl.length+' 條校對'):('已複核·保留 · '+fl.length+' 條');
      flHtml='<details class="flagbox"><summary>'+lab+'</summary>'+
        fl.map(f=>'<div class="fitem"><div class="fmeta"><span class="sev '+f.severity+'">'+f.severity+'</span><span class="field">'+esc(f.field)+'</span><span class="by '+esc(f.by)+'">'+esc(f.by)+'</span></div><div>'+esc(f.issue)+'</div></div>').join('')+'</details>';
    }
    card.innerHTML='<div class="gtop"><span class="gid">'+esc(item.id)+'</span>'+
      (isFixed?'<span class="badge ok">✓ 已修正</span>':(touched?'<span class="badge keep">✓ 已複核·保留</span>':''))+'</div>'+
      '<div class="gt">'+esc(item.t)+'</div><div class="gp">'+esc(item.p)+'</div>'+
      '<div class="ex-row"><div class="ex-box zh"><div class="ex-lab">中文原文</div><div class="txt">'+esc(item.ex)+'</div></div><div class="ex-box en"><div class="ex-lab">English(已修正)</div><div class="txt">'+esc(en?en.ex:'(缺)')+'</div></div></div>'+
      '<div class="egs">'+egHtml+'</div>'+
      ((item.n||(en&&en.n))?'<div class="gn"><div>'+esc(item.n||'')+'</div><div class="en">'+esc(en&&en.n||'')+'</div></div>':'')+flHtml;
    listEl.appendChild(card);
  });
}
function setFilter(f){FILTER=f;document.getElementById('tAll').classList.toggle('on',f==='all');document.getElementById('tFlag').classList.toggle('on',f==='flag');render();}
(function(){
  const touchedIds=Object.keys(FLAGS).filter(id=>FLAGS[id]&&FLAGS[id].length);
  document.getElementById('fCount').textContent=touchedIds.length;
  document.getElementById('tAll').textContent='全部 '+N5.length;
  document.getElementById('stats').innerHTML=
    '<span class="pill">'+N5.length+' 條</span>'+
    '<span class="pill ok">✓ 已修正 <b>'+FIXED.size+'</b></span>'+
    '<span class="pill">已複核保留 <b>'+(touchedIds.length-FIXED.size)+'</b></span>';
})();
render();
</script></body></html>
