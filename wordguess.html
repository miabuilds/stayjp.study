<style>

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:15px;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;text-decoration:none}

  .ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--bd)}
  .ans .w{font-size:26px;font-weight:800}
  .ans .r{font-size:15px;color:var(--tx2)}
  .ans .m{width:100%;font-size:14.5px;color:var(--tx2)}
  .play{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--ac);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .ex{display:flex;gap:10px;align-items:flex-start}

  .yours{font-size:13.5px;color:var(--tx2);margin-bottom:10px}

  .score b{font-size:44px;font-family:var(--serif);color:var(--ac)}
  .wl{list-style:none}
  .wl li{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
  .wl li:last-child{border-bottom:0}
  .wl .w{font-weight:800;font-size:17px;min-width:72px}

  .hidden{display:none!important}
  footer{padding:30px 0 0;text-align:center;color:var(--tx3);font-size:12.5px}
  footer a{color:var(--tx2)}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
// 看日文猜單字(2026-10-18,用戶回饋:想要「簡單日文解釋 → 填上對應單字」,可手打/選項/拆字選填)。
// 解釋資料 jdef-n5.js…jdef-n1.js 由 scripts/gen-jdef.mjs 產(N5/N4 只用 N5–N4 字,N3 以上放寬到 N3 程度)。照做題規則:作答→送出→詳解→自己按下一題。
// 付費牆同 jlpt-drill.html:免費每日 1 輪(錯題本不算),Premium/試用/白名單無限。
function enOr(zh,en){ try{ return I18n.getLang()==='en'?en:zh; }catch(e){ return zh; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const hira = s => String(s||'').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
const clean = s => String(s||'').replace(/[〜～\s　]/g,'');
function ls(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function today(){ return (window.DayKey&&DayKey.today)?DayKey.today():new Date().toISOString().slice(0,10); }
const N = 10;

// ── Premium 判斷(同 jlpt-drill.html,含降級路徑與 6 秒 pending 放行)──
const WG_ADMIN = ['stayjpplan@gmail.com','abc83327@gmail.com'];
let wgPremium=false, wgAdmin=false, wgTrialStart=null, wgPending=true;
setTimeout(()=>{ wgPending=false; },6000);
(function initAuth(){
  try{
    const cfg = { apiKey:"AIzaSyDnmg2XOuvwgE8m8xCF5sS4o0nQYoUplPI", authDomain:"jpnote-1bdd6.firebaseapp.com", projectId:"jpnote-1bdd6" };
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(u=>{
      wgAdmin = !!(u && WG_ADMIN.includes((u.email||'').toLowerCase()));
      if(!u){ wgPremium=false; wgPending=false; renderHome(); return; }
      wgPending=true; setTimeout(()=>{ wgPending=false; },6000);
      try{ if(localStorage.getItem('jd_prem_'+u.uid)==='1') wgPremium=true; }catch(e){}
      let _wl=null, _sub=null;
      const _sync=()=>{
        if(_wl!==null && _sub!==null){ wgPremium = _wl || _sub || wgAdmin; wgPending=false; }
        else if(_wl===true || _sub===true) wgPremium=true;
        try{ if(_wl!==null&&_sub!==null) localStorage.setItem('jd_prem_'+u.uid, wgPremium?'1':'0'); }catch(e){}
        renderHome();
      };
      firebase.firestore().doc('free_users/'+u.uid).get().then(s=>{ _wl=s.exists; _sync(); }).catch(()=>{});
      firebase.firestore().doc('users/'+u.uid).get().then(s=>{
        const d=s.data()||{}, sub=d.subscription;
        _sub=!!(sub && (sub.status==='active'||sub.status==='trialing'||sub.status==='cancelled') && (sub.expiresAt||0)>Date.now());
        const ts=d.trial_started_at;
        if(ts && typeof ts.toMillis==='function') wgTrialStart=ts.toMillis(); else if(ts && ts.seconds) wgTrialStart=ts.seconds*1000;
        _sync();
      }).catch(()=>{});
    });
  }catch(e){}
})();
const isNative = () => !!(window.STAYJP_NATIVE && window.STAYJP_NATIVE.isNativeApp);
function wgUnlimited(){
  if(wgPremium || wgAdmin || wgPending) return true;
  if(!isNative() && wgTrialStart!=null && Date.now() < wgTrialStart + 3*86400000) return true;
  if(isNative() && window.STAYJP_NATIVE.isPremium) return true;
  return false;
}
const usedToday = () => parseInt(ls('wg_day_'+today(), 0), 10) || 0;
function gateRound(){   // 免費:每日 1 輪;擋下回 true
  if(wgUnlimited()) return false;
  if(usedToday()>=1){ showGate(); return true; }
  lsSet('wg_day_'+today(), usedToday()+1);
  return false;
}
// App 內不能導去網頁價目表(Apple 3.1.1)→ 開原生 paywall;網頁才去 pricing.html
function goPlans(){
  try{ if(isNative() && window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify({ type:'OPEN_PAYWALL', lang:(localStorage.getItem('ui_lang')||'zh-TW') })); return; } }catch(e){}
  location.href='pricing.html';
}
function showGate(){
  const el=document.createElement('div'); el.id='gateCard';
  el.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900" data-x></div>'+
    '<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:901;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:340px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">'+
    '<div style="font-size:30px;color:var(--ac);margin-bottom:8px"><i data-ic=lock></i></div>'+
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px">'+enOr('今天的免費一輪(10 題)玩完了',"You've played today's free round (10 words)")+'</div>'+
    '<div style="font-size:13.5px;color:var(--tx2);line-height:1.7;margin-bottom:16px">'+enOr('明天會再送一輪。錯題本不限次數,可以先把錯的練熟。升級 Premium 就能無限玩。','A new free round tomorrow. The wrong-answer list is unlimited. Premium unlocks unlimited rounds.')+'</div>'+
    '<button class="btn pri wide" id="gGo">'+enOr('看訂閱方案 →','See plans →')+'</button>'+
    '<button class="btn wide" data-x>'+enOr('先不用','Not now')+'</button></div>';
  document.body.appendChild(el);
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>el.remove());
  el.querySelector('#gGo').onclick=()=>{ el.remove(); goPlans(); };
  hydrate();
}
function hydrate(){ try{ if(window.Icons&&Icons.hydrate) Icons.hydrate(); }catch(e){} }

// ── 題庫 ──
// 單字檔(N3 以上每級 600KB)+ 解釋檔都按級延遲載入:選哪級才抓哪級
// 有解釋資料的等級才開放(jdef-<lv>.js 產完、上線後才加進來;app.html 單字區入口 WG_LEVELS 要同步)
const LEVELS = ['n5','n4','n3','n2'];
const VOC = {};
let JD = window.JDEF || {};
const _lvP = {};
function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); }); }
function loadLevel(l){
  if(VOC[l]) return Promise.resolve();
  if(_lvP[l]) return _lvP[l];
  _lvP[l] = Promise.all([loadScript('vocab-'+l+'.js'), loadScript('jdef-'+l+'.js')]).then(()=>{
    VOC[l] = window['VOCAB_'+l.toUpperCase()] || []; JD = window.JDEF || {};
  }).catch(e=>{ _lvP[l]=null; throw e; });
  return _lvP[l];
}
const keyOf = v => v.w+'|'+v.r;
function pool(lv){
  const seen=new Set();
  return (VOC[lv]||[]).filter(v=>{ const k=keyOf(v); if(!JD[k]||seen.has(k)) return false; seen.add(k); return clean(hira(v.r)).length>=1; });
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 避開最近出過的字(用戶回饋:單字測驗答對的字一直重複出現)
function pickRound(lv){
  const P=pool(lv), recent=new Set(ls('wg_seen',[]));
  let fresh=P.filter(v=>!recent.has(keyOf(v)));
  if(fresh.length<N){ lsSet('wg_seen',[]); fresh=P; }
  return shuffle(fresh).slice(0,N);
}
function markSeen(v){ const a=ls('wg_seen',[]); a.push(keyOf(v)); lsSet('wg_seen', a.slice(-400)); }
const getWrong = () => ls('wg_wrong',{});
function setWrong(v, lv, on){ const w=getWrong(), k=keyOf(v); if(on) w[k]={lv,t:Date.now()}; else delete w[k]; lsSet('wg_wrong',w); }
const wrongCount = () => Object.keys(getWrong()).length;
function wrongItems(){   // 呼叫前要先 loadLevel 錯題涉及的等級
  const w=getWrong(), out=[];
  Object.keys(w).forEach(k=>{ const lv=w[k].lv; const v=(VOC[lv]||[]).find(x=>keyOf(x)===k); if(v&&JD[k]) out.push({v,lv}); });
  return out;
}

// ── 狀態 ──
document.querySelectorAll('#segLv button').forEach(b=>{ if(!LEVELS.includes(b.dataset.v)) b.remove(); });
let lv = ls('wg_lv','n5'); if(!LEVELS.includes(lv)) lv='n5';
let mode = ls('wg_mode','choice'); if(!['choice','tiles','type'].includes(mode)) mode='choice';
try{ const q=new URLSearchParams(location.search).get('lv'); if(q && LEVELS.includes(q.toLowerCase())) lv=q.toLowerCase(); }catch(e){}
let Q=[], qi=0, score=0, wrongs=[], fromWrong=false, answered=false, showKana=ls('wg_kana',false);
let sel=null, filled=[], tiles=[];

const $ = id => document.getElementById(id);
function show(id){ ['vHome','vQuiz','vEnd'].forEach(x=>$(x).classList.toggle('hidden', x!==id)); window.scrollTo(0,0); }

function renderHome(){
  document.querySelectorAll('#segLv button').forEach(b=>b.classList.toggle('on', b.dataset.v===lv));
  document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on', b.dataset.v===mode));
  $('btnStart').textContent = enOr('開始一輪(10 題)','Start a round (10 words)');
  const wn = wrongCount();
  $('btnWrong').textContent = enOr('錯題本('+wn+')','Wrong answers ('+wn+')');
  $('btnWrong').disabled = !wn;
  const pn = VOC[lv] ? pool(lv).length : null;
  if(!VOC[lv]) loadLevel(lv).then(renderHome).catch(()=>{});
  $('freeNote').textContent = wgUnlimited() ? (pn==null ? enOr('載入中…','Loading…') : enOr('共 '+pn+' 個單字', pn+' words'))
    : (usedToday()>=1 ? enOr('今天的免費一輪用完了,錯題本不限次數','Today\'s free round is used — wrong answers are unlimited') : enOr('免費版每天 1 輪,錯題本不限次數','Free: 1 round per day; wrong answers unlimited'));
}
document.querySelectorAll('#segLv button').forEach(b=>b.onclick=()=>{ lv=b.dataset.v; lsSet('wg_lv',lv); renderHome(); });
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>{ mode=b.dataset.v; lsSet('wg_mode',mode); renderHome(); });
function withLoading(btn, p, fn){
  const t=btn.textContent; btn.disabled=true; btn.textContent=enOr('載入中…','Loading…');
  p.then(()=>{ btn.disabled=false; btn.textContent=t; fn(); })
   .catch(()=>{ btn.disabled=false; btn.textContent=t; $('freeNote').textContent=enOr('載入失敗,請檢查網路再試一次','Failed to load — check your connection and try again'); });
}
function startRound(btn){ withLoading(btn, loadLevel(lv), ()=>{ if(gateRound()) return; fromWrong=false; begin(pickRound(lv).map(v=>({v,lv}))); }); }
$('btnStart').onclick=()=>startRound($('btnStart'));
$('btnWrong').onclick=()=>{
  const lvs=[...new Set(Object.values(getWrong()).map(x=>x.lv))].filter(l=>LEVELS.includes(l));
  withLoading($('btnWrong'), Promise.all(lvs.map(loadLevel)), ()=>{ const w=shuffle(wrongItems()).slice(0,N); if(!w.length) return; fromWrong=true; begin(w); });
};

function begin(items){ Q=items; qi=0; score=0; wrongs=[]; show('vQuiz'); renderQ(); }

function renderQ(){
  const {v,lv:qlv}=Q[qi], d=JD[keyOf(v)];
  answered=false; sel=null; filled=[];
  $('qPos').textContent = (qi+1)+' / '+Q.length + (fromWrong?enOr(' ・錯題',' · review'):'');
  $('btnQuit').textContent = enOr('結束','Quit');
  $('qBar').style.width = (qi/Q.length*100)+'%';
  $('qTag').textContent = (v.c||'') + ' ・ ' + qlv.toUpperCase();
  $('qDef').textContent = showKana ? d.k : d.d;
  $('btnKana').textContent = showKana ? enOr('顯示漢字','Show kanji') : enOr('全假名','All kana');
  $('btnKana').classList.toggle('on', showKana);
  $('btnZh').textContent = enOr('中文提示','Chinese hint');
  $('btnFirst').textContent = enOr('第一個字','First letter');
  hintOn={zh:false, first:false}; renderHints();
  $('qResult').innerHTML='';
  renderAnswer();
  $('btnSubmit').textContent = enOr('送出','Submit');
  syncSubmit();
}
// 提示是開關:按一下顯示、再按一下收起(Mia 10/18:原本每按一次就多疊一行)
let hintOn={zh:false, first:false};
function renderHints(){
  const v=Q[qi].v, parts=[];
  if(hintOn.zh) parts.push(enOr('意思:','Meaning: ')+v.m);
  if(hintOn.first) parts.push(enOr('第一個字:','First letter: ')+clean(hira(v.r)).charAt(0));
  const h=$('qHint'); h.textContent=parts.join('　'); h.classList.toggle('hidden', !parts.length);
  $('btnZh').classList.toggle('on', hintOn.zh); $('btnFirst').classList.toggle('on', hintOn.first);
}
$('btnKana').onclick=()=>{ showKana=!showKana; lsSet('wg_kana',showKana); const d=JD[keyOf(Q[qi].v)]; $('qDef').textContent = showKana?d.k:d.d; $('btnKana').textContent = showKana?enOr('顯示漢字','Show kanji'):enOr('全假名','All kana'); $('btnKana').classList.toggle('on',showKana); };
$('btnZh').onclick=()=>{ hintOn.zh=!hintOn.zh; renderHints(); };
$('btnFirst').onclick=()=>{ hintOn.first=!hintOn.first; renderHints(); };
$('btnQuit').onclick=()=>{ if(qi>0||answered) finish(); else { show('vHome'); renderHome(); } };

const ansKana = v => clean(hira(v.r));
function renderAnswer(){
  const {v,lv:qlv}=Q[qi], box=$('qAnswer');
  if(mode==='choice'){
    const P=pool(qlv).filter(x=>keyOf(x)!==keyOf(v) && ansKana(x)!==ansKana(v));
    const same=shuffle(P.filter(x=>x.c===v.c)), other=shuffle(P.filter(x=>x.c!==v.c));
    const opts=shuffle([v, ...same.concat(other).slice(0,3)]);
    box.innerHTML='<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'"><b>'+esc(clean(o.w))+'</b>'+(clean(o.w)!==clean(o.r)?'<span>'+esc(clean(o.r))+'</span>':'<span>&nbsp;</span>')+'</button>').join('')+'</div>';
    box._opts=opts;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(answered) return; sel=+b.dataset.i; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===b)); syncSubmit(); });
  } else if(mode==='tiles'){
    const a=[...ansKana(v)];
    const KANA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽっゃゅょー';
    const extra=[]; const n=Math.min(4, Math.max(2, 10-a.length));
    while(extra.length<n){ const c=KANA[Math.floor(Math.random()*KANA.length)]; if(!a.includes(c)&&!extra.includes(c)) extra.push(c); }
    tiles=shuffle(a.concat(extra)).map(c=>({c,used:false}));
    filled=a.map(()=>null);
    drawTiles();
  } else {
    box.innerHTML='<input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ja" placeholder="'+esc(enOr('用平假名打讀音,例:りんご','Type the reading in hiragana, e.g. りんご'))+'">';
    const inp=$('inp'); inp.oninput=syncSubmit; inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); $('btnSubmit').click(); } };
  }
}
function drawTiles(){
  const box=$('qAnswer');
  box.innerHTML='<div class="boxes">'+filled.map((t,i)=>'<div class="box'+(t!=null?' f':'')+'" data-b="'+i+'">'+(t!=null?esc(tiles[t].c):'')+'</div>').join('')+'</div>'
    +'<div class="tiles">'+tiles.map((t,i)=>'<button class="tile'+(t.used?' used':'')+'" data-t="'+i+'">'+esc(t.c)+'</button>').join('')+'</div>';
  box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(answered) return; const i=+b.dataset.t, slot=filled.indexOf(null); if(slot<0||tiles[i].used) return; filled[slot]=i; tiles[i].used=true; drawTiles(); syncSubmit(); });
  box.querySelectorAll('.box').forEach(b=>b.onclick=()=>{ if(answered) return; const i=+b.dataset.b; if(filled[i]==null) return; tiles[filled[i]].used=false; filled[i]=null; drawTiles(); syncSubmit(); });
}
function current(){
  if(mode==='choice') return sel==null?'':null;
  if(mode==='tiles') return filled.includes(null)?'':filled.map(i=>tiles[i].c).join('');
  const el=$('inp'); return el?clean(el.value):'';
}
function syncSubmit(){ if(answered){ $('btnSubmit').disabled=false; return; } const c=current(); $('btnSubmit').disabled = (mode==='choice') ? sel==null : !c; }

$('btnSubmit').onclick=()=>{
  if(answered){ qi++; if(qi>=Q.length) finish(); else renderQ(); return; }
  const {v,lv:qlv}=Q[qi];
  let ok=false, yours='';
  if(mode==='choice'){ const o=$('qAnswer')._opts[sel]; ok=keyOf(o)===keyOf(v); yours=clean(o.w);
    $('qAnswer').querySelectorAll('.opt').forEach((b,i)=>{ const o2=$('qAnswer')._opts[i]; if(keyOf(o2)===keyOf(v)) b.classList.add('right'); else if(i===sel) b.classList.add('wrong'); });
  } else { yours=current(); const h=hira(yours); ok = h===ansKana(v) || yours===clean(v.w); }
  answered=true;
  if(ok) score++; else wrongs.push(Q[qi]);
  setWrong(v, qlv, !ok);
  if(!fromWrong) markSeen(v);
  try{ StayDaily.log('vocab'); }catch(e){}
  showResult(v, ok, yours);
  $('btnSubmit').textContent = qi>=Q.length-1 ? enOr('看結果 →','See results →') : enOr('下一題 →','Next →');
  syncSubmit();
  if(mode==='type'){ try{ $('inp').disabled=true; }catch(e){} }
};
function showResult(v, ok, yours){
  const ex=v.ex||{};
  $('qResult').innerHTML='<div class="res '+(ok?'ok':'ng')+'">'
    +'<div class="head"><i data-ic='+(ok?'check':'x')+'></i>'+(ok?enOr('答對了','Correct'):enOr('差一點','Not quite'))+'</div>'
    +(!ok&&yours&&mode!=='choice'?'<div class="yours">'+enOr('你的答案:','Your answer: ')+esc(yours)+'</div>':'')
    +'<div class="ans"><span class="w">'+esc(clean(v.w))+'</span><span class="r">'+esc(clean(v.r))+'</span>'
    +'<button class="play" data-say="'+esc(v.r)+'" aria-label="'+esc(enOr('聽發音','Play'))+'"><i data-ic=volume></i></button>'
    +'<span class="m">'+esc(v.m)+'</span></div>'
    +(ex.j?'<div class="ex"><button class="play" data-say="'+esc(ex.j)+'" aria-label="'+esc(enOr('聽例句','Play example'))+'"><i data-ic=volume></i></button><div><div class="j">'+esc(ex.j)+'</div><div class="z">'+esc(enOr(ex.z||'',ex.e||ex.z||''))+'</div></div></div>':'')
    +'</div>';
  $('qResult').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  hydrate();
  say(v.r);
}
// 發音:預生 mp3(__TTS 依文字查 hash)。manifest 1.2MB → 第一次用到才載。App 內交給原生播。
let _ttsP=null, _au=null;
function ensureTTS(){ if(window.__TTS) return Promise.resolve(); if(_ttsP) return _ttsP;
  _ttsP=new Promise(res=>{ const s=document.createElement('script'); s.src='audio/tts/manifest.js'; s.onload=()=>res(); s.onerror=()=>{ _ttsP=null; res(); }; document.head.appendChild(s); }); return _ttsP; }
function say(text){
  ensureTTS().then(()=>{
    const h=window.__TTS&&window.__TTS[text]; if(!h) return;
    const rel=window.ttsUrl?window.ttsUrl(h):'audio/tts/'+h+'.mp3';
    try{ if(window.STAYJP_NATIVE&&window.STAYJP_NATIVE.canPlayB64&&window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify({type:'PLAY_URL',url:new URL(rel,location.href).href})); return; } }catch(e){}
    try{ if(_au) _au.pause(); _au=new Audio(rel); _au.play().catch(()=>{}); }catch(e){}
  });
}
window.addEventListener('load',()=>setTimeout(ensureTTS,1500));

function finish(){
  const total = answered ? qi+1 : qi;
  show('vEnd');
  $('eLbl').textContent = enOr('這一輪答對','Correct this round');
  $('eScore').textContent = score+' / '+total;
  $('eWrongCard').classList.toggle('hidden', !wrongs.length);
  $('eWrongLbl').textContent = enOr('答錯的字(已加進錯題本)','Missed words (saved to your list)');
  $('eWrong').innerHTML = wrongs.map(({v})=>'<li><span class="w">'+esc(clean(v.w))+'</span><span class="m">'+esc(clean(v.r))+' ・ '+esc(v.m)+'</span></li>').join('');
  $('btnAgain').textContent = enOr('再來一輪','Another round');
  $('btnRetryWrong').textContent = enOr('練錯題','Practice missed words');
  $('btnRetryWrong').classList.toggle('hidden', !wrongCount());
  $('btnHome').textContent = enOr('換等級或作答方式','Change level or mode');
}
$('btnAgain').onclick=()=>startRound($('btnAgain'));
$('btnRetryWrong').onclick=()=>{ show('vHome'); renderHome(); $('btnWrong').onclick(); };
$('btnHome').onclick=()=>{ show('vHome'); renderHome(); };

function applyStatic(){
  if(enOr(0,1)!==1) return;
  $('tBack').textContent='Back'; $('tTitle').textContent='Guess the Word'; $('tSub').textContent='Read a short definition in easy Japanese and guess the word. Switch to all-kana if the kanji are hard.';
  $('tLv').textContent='Level'; $('tMode').textContent='Answer mode'; $('tFoot').textContent='Study tools';
  const m={ '選擇':'Choice','四選一':'Pick 1 of 4','拼字':'Tiles','點假名拼出來':'Tap the kana','打字':'Type','自己打出讀音':'Type the reading' };
  document.querySelectorAll('[data-z]').forEach(e=>{ if(m[e.dataset.z]) e.textContent=m[e.dataset.z]; });
}
applyStatic();
renderHome();
</script>
